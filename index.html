lia រារាំងប្លោកនោមកុំអោយធ្វើសកម្មភាពលើស","Cerebellum សម្របសម្រួលការបញ្ចេញទឹកនោមអោយអស់","ការខូចខាត cerebellum បង្កអោយ ចុះខ្សោយកម្លាំងសាចដុំប្លោកនោម","ការរបួសខាងលើនៃ brainstem បង្កអោយមានការបង្កើនតែសកម្មភាពប្លោកនោមប៉ុណ្ណោះ"],"a":[2]},{"i":"d1533187","b":"SUR","p":"B","q":"បណ្តាថ្នាំខាងក្រោមតើមួយណាដែលមិនជម្រុញអោយមានការចាល់ទឹកនោម?","o":["sympathomimetics","anticholinergics","cholinergic agonists","Tricyclic Antidepressant (TCAs)","ថ្នាំបន្ធូរសាច់ដុំរលោង (smooth muscle depressants)"],"a":[2]},{"i":"c3f0ede8","b":"SUR","p":"B","q":"អ្នកជំងឺម្នាក់មានហូរឈាមនៅ subarachnoid (SAH) ដោយសារធ្លាយអាទែរមុខ-ស្តាំ ដែលរីកប៉ោង ហើយបានព្យាបាលដោយវះកាត់ក្រោយហូរឈាមពីរ ថ្ងៃ។ បីថ្ងៃក្រោយ ដៃស្តាំចុះខ្សោយទៅៗ ពីមួយថ្ងៃទៅមួយថ្ងៃ។ តើរោគវិន្និច្ឆ័យខាងក្រោមមួយណាត្រឹមត្រូវជាងគេ?","o":["មានទឹកក្នុងខួរក្បាល (hydrocephalus)","រលាកស្រោមខួរ (meningitis)","ការហូរឈាមឡើងវិញ (repeat hemorrhage)","សរសៃឈាមរួមតូច (vasospasm)","មិនមានចម្លើយនៅខាងលើទេ"],"a":[3]},{"i":"c8254140","b":"SUR","p":"B","q":"ចម្លើយខាងក្រោមជាផលវិបាកនៃការកាត់អាមីដាល លើកលែងតែមួយ?","o":["ហូរឈាមក្រោយវះកាត់ (secondary hemorrhage)","ឈឺចាប់ក្នុងត្រចៀក (severe otalgia)","រលាកអាមីដាលនិងមានអាប់សែជាលិកាជុំវិញ (Quinsy)","ចង្អៀតរន្ធច្រមុះបំពង់ក (nasopharyngeal stenosis)","មិនមានចម្លើយនៅខាងលើទេ"],"a":[2]},{"i":"2d35f32b","b":"SUR","p":"B","q":"ចម្លើយខាងក្រោមជាលក្ខណៈនៃអាការៈរលាកអាមីដាលស្រួចស្រាល់ លើកលែងតែមួយ?","o":["លេបអាហារឈឺចាប់ (odynophagia)","ក្អក","សំដៅលើការឈឺចាប់ត្រចៀក (referred otalgia)","ជាជំងឺកូនកណ្តុរនៅក (cervical lymphadenopathy)","ពិបាកលេបអាហារ (dysphagia)"],"a":[1]},{"i":"25f46a36","b":"SUR","p":"B","q":"ទារកអាយុ៦ខែម្នាក់មានអាការៈ mild inspiratory stridor ពីរខែមកហើយ។ ចម្លើយខាងក្រោមមួយណា ត្រឹមត្រូវ?","o":["Laryngomalacia","រលាកអេពីក្លូតស្រួចស្រាល់ (acute epiglottitis)","មានរលាក (croup)","អាមីដាលរីកធំ​ (tonsillar hypertrophy)","មានវត្ថុនៅស្ទះក្នុងផ្លូវដង្ហើម (foreign body aspiration)"],"a":[0]},{"i":"293c22c4","b":"SUR","p":"B","q":"បុរសអាយុ៤៨ឆ្នាំម្នាក់ត្រូវបាននាំចូលបន្ទប់សង្គ្រោះបន្ទាន់ដោយ កំពុងធ្វើ ការសង្រ្គោះបេះដូងនិងផ្លូវដង្ហើម (CPR)។ ECG បង្ហាញថាមានសកម្មភាពបេះដូងតែគេស្ទាបមិនឃើញជីពចរការ៉ូទីតនៅកទេ។ តើចម្លើយខាងក្រោមមួយណាមិនមែនជាការខុសគ្នារវាងការស្ទាបមិនឃើញជីពចរដោយសារសកម្មភាពអគ្គិសនី?","o":["សម្ពាធឈាមទាប (hypotension)","អត្រាប៉ូតាស្យូមក្នុងឈាមទាប (hypokalemia)","Cardiac tamponade","សីតុណ្ហភាពរាងកាយទាប (hypothermia)","មានសម្ពាធខ្យល់ក្នុងប្រអប់ទ្រូង (tension pneumothorax)"],"a":[1]},{"i":"4cfce31f","b":"SUR","p":"B","q":"បុរសអាយុ៨៣ឆ្នាំម្នាក់ធ្លាក់ពេលកំពុងចុះជណ្តើរ។ គាត់ត្រូវបានគេបញ្ជូនទៅបន្ទប់សង្រ្គោះបន្ទាន់ ដោយមានបាក់បីកំណាត់នៃ intertrochanteric ឆ្អឹងភ្លៅ។ ក្នុងចំណោមវិធីខាងក្រោម តើគេត្រូវជ្រើសរើសវិធីមួយណាដើម្បីព្យាបាល?","o":["ប្តូរសន្លាក់សិប្បនិម្មិតម្ខាង (hemiarthoplasty)","ប្តូរសន្លាក់ភ្លៅ (total hip replacement)","ម្ជុលភ្ជាប់ឆ្អឹងច្រើនប្រភេទ (multiple pin fixation)","bipolar arthroplasty","វះកាត់តឆ្អឹងដោយប្រើម្ជុលនិងបន្ទះលោហធាតុ (pin and plate)"],"a":[4]},{"i":"183f2e2e","b":"SUR","p":"B","q":"បុរសអាយុ៤៥ឆ្នាំម្នាក់មានប្រវត្តិគីសជាច្រើននៅតម្រងនោម (polycystic kidney disease) ដោយក្នុងពេលនោមឃើញមានឈាមតែមិនមានការឈឺចាប់ទេ។ ការងារបន្តគឺ","o":["មិនមានការវិភាគអមគ្លីនិកទេ ព្រោះថាការនោមឈាមទំនងជាដោយសាររបួសដោយគីសតម្រងនោម។","មិនមានការវិភាគអមគ្លីនិកនៅពេលនេះទេ តែបើសិនពេលនោមឃើញមានឈាមដោយភ្នែកត្រូវធ្វើការអង្កេត","អ៊ុលត្រាសោន (U/S)","អ៊ុលត្រាសោន, urine​ C&S (culture and sensibility), ឆ្លុះប្លោកនោម (cystoscopy)"],"a":[3]},{"i":"2b0a1047","b":"SUR","p":"B","q":"បុរសអាយុ៧៥ឆ្នាំម្នាក់មានប្រវត្តិនោមយប់ គាត់មិនបានបញ្ចេញទឹកនោម១០ម៉ោងមកហើយ ហើយបានត្អូញឈឺចាប់នៅផ្នែកក្រោមពោះយ៉ាងខ្លាំង។ មូលហេតុដែលសមហេតុផលជាងគេគឺ?","o":["Benign Prostatic Hyperplasia (BPH)","មហារីកប្រូស្តាត (prostate cancer)","ខ្សោយតម្រងនោម renal failure)","រលាកផ្លូវទឹកនោម (UTI)","រលាកប្រូស្តាត"],"a":[0]},{"i":"67c2fa9e","b":"SUR","p":"B","q":"ស្រ្តីអាយុ៤៣ឆ្នាំម្នាក់ត្រូវបាននាំចូលបន្ទប់សង្រ្គោះបន្ទាន់ ក្រោយរលាកដោយសារភ្លើងឆេះផ្ទះ ។ តាមការប៉ាន់ស្មានផ្ទៃរលាកមានប្រហែល ២០%នៃផ្ទៃសរុបដងខ្លួន រលាកកម្រឹតពីរ១១% និង កម្រឹតបី៩%។ គាត់មានទម្ងន់ដងខ្លួន៦០គ.ក្រ កំពស់១២០ស.ម។ តើអ្នកគួរចាប់ផ្តើមព្យាបាលបញ្ចូលសារធាតុរាវ តាមសរសៃវ៉ែនជាបន្ទាន់ដោយរបៀបណា?","o":["សេរ៉ូមប្រៃធម្មតា២០០ម.ល/ម៉ ក្នុង២៤ម៉ោង។","សេរ៉ូមប្រៃធម្មតា៤០០ម.ល/ម៉ ក្នុង២៤ម៉ោង។","សេរ៉ូមប្រៃធម្មតា១៥០ម.ល/ម៉ ក្នុង៨ម៉ោង បន្ទាប់មក៧៥ម.ល/ម៉ ក្នុង១៦ម៉ោងបន្ទាប់។","សេរ៉ូមប្រៃធម្មតា៣០០ម.ល/ម៉ ក្នុង៨ម៉ោង និង១៥០ម.ល/ម៉ ក្នុង១៦ម៉ោងបន្ទាប់។","សេរ៉ូមប្រៃធម្មតា៦០០ម.ល/ម៉ ក្នុង៨ម៉ោង បន្ទាប់ម៣០០ម.ល/ម៉ ក្នុង១៦ម៉ោងបន្ទាប់។"],"a":[3]},{"i":"70b311ef","b":"SUR","p":"B","q":"ចម្លើយខាងក្រោមជាកត្តាគ្រោះថ្នាក់ (risk factors)នៃ hepatocellular carcinoma លើកលែងតែមួយ?","o":["រលាកថ្លើម A","ក្រឹនថ្លើម(cirrhosis)","ការប្រើស្តេរ៉ូអ៊ីត (exogenous steroid use)","hemochromatosis","ការជក់បារី (smoking)"],"a":[0]},{"i":"6b57f77e","b":"SUR","p":"B","q":"ចម្លើយខាងក្រោមមួយណាជាការរួមផ្សំជាមួយការឈឺចាប់ប្រម៉ាត់ (biliary colic)?","o":["ការឈឺចាប់នៅចុងដង្ហើម (epigastric pain)","rebound tenderness","គ្រុនលឿង (jaundice)","រោគសញ្ញាមួកភី (Murphy sign)","ចម្លើយទាំងអស់ខាងលើ (all of the above)"],"a":[0]},{"i":"e946e378","b":"SUR","p":"B","q":"យុវតីអាយុ១៦ឆ្នាំម្នាក់ដួលក្នុងពេលលេង roller-bladingដោយច្រត់បាតដៃស្តាំ។ នៅបន្ទប់សង្រ្គោះបន្ទាន់ កាំរស្មីអ៊ិចបង្ហាញថាបាក់ Colles fracture បិទមុខ។ បច្ចេកទេសការទាញតម្រង់សមស្របសម្រាប់បាក់កដៃនេះគឺអ្វី?","o":["លាកំភួនដៃបន្តិច ផ្កាប់បាតដៃអោយអស់និងតម្រង់ឆ្អឹងយូរណា (ulnar deviation)","បត់កំភួនដៃបន្តិច ផ្ងារបាតដៃអោយអស់និងតម្រង់ឆ្អឹងរ៉ាឌីយ៉ាល់ (radial deviation)","លាកំភួនដៃបន្តិច ផ្ងារបាតដៃអោយអស់និងតម្រង់ឆ្អឹងយូរណា (ulnar deviation)","បត់កំភួនដៃបន្តិច ផ្កាប់បាតដៃអោយអស់និងតម្រង់ឆ្អឹងយូរណា (ulnar deviation)","បត់កំភួនដៃបន្តិច ផ្កាប់បាតដៃអោយអស់និងតម្រង់ឆ្អឹងរ៉ាឌីយ៉ាល់ (radial deviation)"],"a":[3]},{"i":"156fbe60","b":"SUR","p":"B","q":"ចម្លើយខាងក្រោមមួយណាមិនទំនងជាមូលហេតុនៃ avascular necrosis","o":["ជម្ងឺកោសិកាកណ្តៀវ (sickle cell disease)","រលាកសន្លាក់ករោគ (septic arthritis)","ការប្រើស្តេរ៉ូអ៊ីត","រុំបង់តឹងពេក (constrictive dressings)","បាក់ឆ្អឹងក្រោយការប៉ះទង្គិច (post-traumatic fracture)"],"a":[1]},{"i":"0f7645f7","b":"SUR","p":"B","q":"ការអធិប្បាយខាងក្រោមមួយណាត្រឹមត្រូវសំដៅលើការបាក់ឆ្អឹងធ្គាមក្រោម?","o":["ភាគច្រើនបាក់តែម្ខាង (they are predominantly unilateral)","ការបាក់ឆ្អឹងច្រើនបំណែក កម្រកើតមាននៅក្នុងមាត់","វាអាចមានការស្ពឹកក្នុង V2 នៃតំបន់សរសៃប្រសាទមុខ","ការខាំធ្មេញមិនត្រូវជួរ ជារោគសញ្ញាតែងជួបប្រទះ (mal occlussion of teeth is a common sign)","វាកម្របណ្តាលអោយមានការរឹងធ្គាមណាស់ (they seldom result in trismus)"],"a":[3]},{"i":"c8016881","b":"SUR","p":"B","q":"ខាងក្រោមគឺជាទិដ្ឋនៃការឈឺចាប់ពេលស្រោមពងស្វាសហើម លើកលែងតែមួយគឺ?","o":["រមួលខ្នែងពងស្វាសជាទូទៅស្រាលមិនចាំបាច់ធ្វើការវះកាត់","ក្អួត/ចង្អោរជាអាការៈតែងកើតមានជាញឹកញាប់នៅក្នុងការរលាកអេពីឌីឌីម","អ៊ុលត្រាសោនអាចជួយរកឃើញមូលហេតុនៃការហូរឈាមក្នុងពងស្វាស","ការរមួលតែងកើតមានឡើងញឹកញាប់បំផុតនៅ លើបុរសក្មេង","រលាកពងស្វាសអាចធ្វើអោយពងស្វាសស្វិត"],"a":[1]},{"i":"9e7d961e","b":"SUR","p":"B","q":"តើការអធិប្បាយខាងក្រោមមួយណាត្រឹមត្រូវសំដៅលើ Prostate-Specific Antigen (PSA)?","o":["គ្រប់បុរសដែលមានអាយុចាប់ពី៥០ឡើងទៅគួរត្រូវទៅធ្វើPSAតេស្ថដើម្បីរកមហារីកក្រពេញប្រូស្តាតដំណាក់កាលទីមួយ។","PSA ជាវិធីដ៏ល្អបំផុតសម្រាប់តាមដានការវិវឌ្ឍន៍នៃជំងឺឬ តាមដានក្រោយការវះកាត់","PSA ជាវិធីមួយមិនមានប្រយោជន៍អ្វីទេ (PSA is a useless test)","អត្រារវាង complex PSA និង total PSA កើនឡើង ជាលក្ខណៈបង្កអោយមាន Benign Prostate Hyperplasia ច្រើនជាងមហារីកប្រូស្តាត","ចម្លើយទាំងអស់ខាងលើ"],"a":[1]},{"i":"75d80edd","b":"SUR","p":"B","q":"ស្រ្តីអាយុ៤០ឆ្នាំម្នាក់ចូលមកបន្ទប់សង្រ្គោះបន្ទាន់ដោយមានអាការៈក្តៅ និងឈឺចាប់នៅតំបន់ ខាងឆ្វេងផ្ចឹត រាលដាលទៅក្រលៀន។ ស៊ីធីស្កែនលើរាងកាយបង្ហាញថាមានក្រួស៨មីល្លីម៉ែត្រនៅ កំណាត់ខាងដើមនៃបង្ហូរនោម(Uretere)ឆ្វេង។ តើអ្នកគួរធ្វើអ្វី?","o":["អោយគាត់ទៅផ្ទះ ព្រោះជំងឺក្រួសផ្លូវទឹកនោមទើបចាប់ផ្តើម","អោយគាត់ទៅផ្ទះដោយអោយថ្នាំលេបបំបាត់ការឈឺចាប់និងប្រាប់គាត់អោយត្រលប់មកមន្ទីរពេទ្យវិញបើសិនជាមានការឈឺចាប់ក្នុង២៤ម៉ោងមិនព្រមបាត់","អនុញ្ញាត្តិអោយចូលមន្ទីរពេទ្យ តាមដានជាប្រចាំ បង្រ្គប់ជាតិទឹក និងបន្ថយការឈឺចាប់","អនុញ្ញាត្តិអោយចូលមន្ទីរពេទ្យ បង្រ្គប់ជាតិទឹក បន្ថយការឈឺចាប់ អង់ទីប៊ីយ៉ូទិកតាមសរសៃ (ដូចជា៖ Amp និង Gent) និងដាក់បំពង់បង្ហូរ(stenting) បើចង្កោមរោគសញ្ញាមិនថមថយ"],"a":[3]},{"i":"9aa9645c","b":"SUR","p":"B","q":"មហារីកច្រមុះបំពង់ក (Nasopharyngeal carcinoma):","o":["ជាជំងឺតែងតែកើតមានច្រើនបំផុតនៅកម្ពុជា","រោគសញ្ញាកើតមានដំបូងបង្អស់គឺឈឺច្រមុះ","ការព្យាបាលគឺវះកាត់ដោយទូលំទូលាយ","ត្រូវតាមដានដោយវិធី Epstein-Barr virus antibodies","៩០%នៃអ្នកជំងឺត្រូវបានព្យាបាលជាសះស្បើយទាំងស្រុង"],"a":[3]},{"i":"0484e1a3","b":"SUR","p":"B","q":"ខាងក្រោមជាកត្តាដែលរួមចំណែកធ្វើអោយ squamous cell cancers នៅក្បាលនិងក វិវឌ្ឍន៍ឆាប់រហ័ស លើកលែងតែមួយ?","o":["ជក់បារី (cigarette smoking)","ការផឹកស្រា (alcohol ingestion)","អាយុច្រើន (aging)","ការប្រឈមជាមួយនឹងផ្សែងម៉ាស៊ីនម៉ាហ្សូត","កាំរស្មីព្រះអាទិត្យ (solar irradiation)"],"a":[3]},{"i":"de1243c2","b":"SUR","p":"B","q":"បុរសអាយុ៦០ឆ្នាំម្នាក់មកដល់ការិយាល័យរបស់អ្នកដោយមានអាការៈឈឺចាប់នៅចង្កេះនិងជើង ហើយមានវិបត្តិនៃការបញ្ចេញទឹកនោម។ ការពិនិត្យ ឃើញ គាត់មានវេទនារម្មណ៍ថយចុះនៅតំបន់ ក្រោយគូថទាំងសងខាង ចលនាធម្មតា និងបាត់ ការកន្រ្តាក់កជើងទាំងសងខាង។ តើគេមានវិធានការដោយរបៀបណា?","o":["កាំរស្មីអ៊ិចធម្មតាឆ្អឹងកងចង្កេះ (plain films of the lumbar spine)","ស៊ីធីស្កេនខួរឆ្អឹងកងចង្កេះ","សំរាកលើគ្រែ២សប្តាហ៏ បន្ទាប់មកឆាប់ធ្វើចលនា","វះដើម្បីកាត់ថាសទ្រនាប់ឆ្អឹងកងជាបន្ទាន់","ប្រើថ្នាំប្រឆាំងរលាកមិនមែនស្តេរ៉ូអ៊ីត និងព្យាបាលដោយចលនា"],"a":[1]},{"i":"d807663f","b":"SUR","p":"B","q":"បុរសអាយុ៧២ឆ្នាំម្នាក់ ពិនិត្យឃើញមានការពិបាកនិយាយ និងខ្សោយដៃខាងស្តាំ។ តើទីតាំងរបួស ដ៏ត្រឹមត្រូវស្ថិតនៅតំបន់ណា?","o":["ក្លែបប៉ារ៉ង់តាល់ស្តាំ (right parietal lobe)","ក្លែបហ្រ្វុងតាល់ឆ្វេង (left frontal lobe)","ក្លែបហ្រ្វុងតាល់ស្តាំ (right frontal lobe)","ក្លែបប៉ារ៉ង់តាល់ឆ្វេង (left parietal lobe)","បាសាល់ហ្គង់ហ្គ្លីយ៉ា (basal ganglia)"],"a":[1]},{"i":"55abf878","b":"SUR","p":"B","q":"ខាងក្រោមគឺជាការព្យាបាលដំបូងចំពោះអ្នកជំងឺ បាត់ស្មារតី (coma) ដោយមិនដឹងមូលហេតុ លើកលែងតែមួយ?","o":["សំអាតនិងរក្សាផ្លូវដង្ហើម (clear and secure the airway)","Naloxone","D50W 50 mL IV","Dexamethasone 16 mg IV","Thiamine"],"a":[3]},{"i":"5bf80c93","b":"SUR","p":"B","q":"ក្មេងស្រីអាយុ១៦ឆ្នាំម្នាក់ត្រូវបានឪពុកម្តាយនាំចូលមន្ទីរពេទ្យ ក្រោយ ឃ្មុំទិច។ សញ្ញាជីវិតមាន៖ សម្ពាធឈាម ៧០/៤០, សង្វាក់ដង្ហើម ៣០ សង្វាក់បេះដូង១៤០ សីតុណ្ហភាព ៣៧.៥។ តើឪសថខាងក្រោមមួយណាមិនមែនជាជម្រើសនៃការព្យាបាល?","o":["អេពីណេហ្រ្វីន (epinephrine)","ឌីហ្វេនអ៊ីដ្រាមីន (diphenhydramine)","មេទីលប៉្រេដនីសូឡុង (methylprednisolone)","សាល់ប៊ុយតូមូល (salbutomol)","អាត្រូពីន(atropine)"],"a":[4]},{"i":"90529ec7","b":"SUR","p":"B","q":"ស្រ្តីអាយុ២៤ឆ្នាំម្នាក់មកដល់បន្ទប់សង្រ្គោះបន្ទាន់។ សម្ពាធឈាម ៩០/៦0, សង្វាក់បេះដូង៦០, សង្វាក់ដង្ហើម ៨, ល្បាយអុកស៊ីសែន៨៦% ។ ភ្នែកនៅបិទទោះបីទទួលរំញោចឈឺចាប់ក៏ដោយ ហើយស្តាប់មិនយល់ការនិយាយ។ កែងដៃនិងកដៃបត់ ប្រអប់ជើងលា។ ដូច្នេះពិន្ទុ Glasgow Coma Scale (GCS score)របស់អ្នកជំងឺគឺ៖","o":["3","4","5","6","7"],"a":[3]},{"i":"7fa050d3","b":"SUR","p":"B","q":"ការពិនិត្យគ្លីនិកខាងក្រោមមួយណា មិនឃើញមាននៅក្នុង ការកើនសំពាធក្នុងប្រអប់លលាដ៏ក្បាល","o":["ការខូចខាតកម្រឹតនៃស្មារតី (deteriorating level of consciousness)","កើនសង្វាក់បេះដូងនិងកើនសំពាធឈាម","ស្ងាប ត្អើក ក្អួត (yawning, hiccuping, vomiting)","ប្រកាច់ (seizures)","ខ្វិនសរសៃប្រសាទខួរក្បាលទី៦ម្ខាង"],"a":[1]},{"i":"e3dbc840","b":"SUR","p":"B","q":"ការអធិប្បាយខាងក្រោមមួយណាមិនត្រឹមត្រូវ ចំពោះការករោគក្រោយវះកាត់?","o":["មេរោគ S. aureus ជួបប្រទះញឹកញាប់បំផុត","ជាទូទៅមានគ្រុនក្តៅក្រោយ៣ទៅ៤ថ្ងៃ","មានការកើនឡើងជាមួយអ្នកជំងឺទឹកនោមផ្អែម","ការព្យាបាលសំខាន់គឺប្រើអង់ទីប៊ីយ៉ូទិក","ប្រឈមមុខខ្ពស់ជាមួយរយៈពេលនៃការវះកាត់"],"a":[3]},{"i":"8dea8d2f","b":"SUR","p":"B","q":"អ្នកជំងឺដែលមានស្ទះពោះវៀនតូច​ តើរោគសញ្ញាមួយណាដែលអនុញ្ញាត្តិអោយធ្វើការវះកាត់?","o":["ឈឺចាប់ក្នុងពោះ (abdominal tenderness)","កាំរស្មីអ៊ិចពោះឃើញមានកម្រឹតខ្យល់-ទឹក (air-fluid levels on abdominal x-ray)","ការឈឺចាប់ក្នុងពោះយ៉ាងខ្លាំង (worsening abdominal pain)","ក្អួតចេញលាមក","កាំរស្មីអ៊ិចពោះឃើញមានខ្យល់ក្នុងពោះវៀនធំនិងរ៉ិចតូម"],"a":[2]},{"i":"5d8ddf6f","b":"SUR","p":"B","q":"ស្រ្តីអាយុ៥៩ម្នាក់បានរៀបរាប់ប្រាប់គ្រូពេទ្យប្រចាំគ្រួសារថា គាត់មានដុំសាច់ក្នុងដោះទំហំ៣សង្ទីម៉ែត្រ គែមរបស់ដុំសាច់ស្មើច្បាស់ ស្ទាបមិនឈឺ។ គាត់បានចាប់ផ្តើមដឹងជាដំបូងជាច្រើនខែមកហើយ ហើយវាកាន់តែធំឡើងជាលំ ដាប់។ ម្តាយរបស់គាត់ និងម្តាយមីងខាងម្តាយគាត់ ធ្លាប់ត្រូវបានគ្រូពេទ្យធ្វើរោគវិន្និច្ឆ័យថា មានមហារីកដោះ តាំងពីគាត់អាយុជាង៥០ឆ្នាំ។ ក្រៅពីនោះគាត់មិនមានជំងឺណាផ្សេងទៀតទេ។ លទ្ធផលការធ្វើម៉ាម៉ូក្រាមបង្ហាញថាមិនមានអ្វីខុសធម្មតាទេ។ តើជំហ៊ានព្យាបាល ដ៏សមស្របបំផុតបន្តទៅទៀតគឺអ្វី?","o":["វះកាត់ដោះដើម្បីបង្ការ","ធ្វើមាម៉ូក្រាម៦ខែក្រោយ","ធ្វើមាម៉ូក្រាម១ឆ្នាំក្រោយ","កាត់ធ្វើប៊ីយ៉ូបស៊ី","អ៊ុលត្រាសោន (ultrasound)"],"a":[3]},{"i":"c17397d6","b":"SUR","p":"B","q":"ការអធិប្បាយខាងក្រោមមួយណាមិនត្រឹមត្រូវសំដៅ pancreatic pseudocysts?","o":["វាជាមូលហេតុនៃការលេចជ្រាបតាមបំពង់ (it is caused by duct leakage)","ត្រូវបានគេសង្ស័យតាមរយៈគ្លីនិកបើសិនជា ការឈឺចាប់លើសពី២ សប្តាហ៏ ក្រោយការធ្វើរោគវិន្និច្ឆ័យថា រលាកលំពែងស្រួចស្រាវ","ភាគច្រើនត្រូវព្យាបាលដោយវះកាត់ (majority are treated surgically)","អន្តរាគមន៍ដោយវះកាត់ ត្រូវពន្យារដើម្បីទុកអោយដុំគីសទំពេញលក្ខណៈ","កង្វះអេពីតេល្យូមពិត (lacks true epithelium)"],"a":[2]},{"i":"5fd73c81","b":"SUR","p":"B","q":"បុរសលើសទម្ងន់អាយុ៤៥ឆ្នាំម្នាក់ បានរៀបរាប់ថាមានការឈឺចាប់នៅតំបន់ពោះខាងក្រោមឆ្វេង (left lower quadrant) របស់គាត់ និងមានប្រវត្តិចុកចាប់ក្នុងពោះមួយសប្តាហ៏ លាមករាវមិនមានឈាម និងគ្រុនក្តៅខ្លាំង។ ពិសោធន៍ឈាមឃើញគោលិកាឈាមសកើន ណឺត្រូស៊ីតកើនឡើង ( left shift) ។ តើគេត្រូវធ្វើរោគវិន្និច្ឆ័យដោយវិធីណា?","o":["ស៊ីធីស្កេន (CT scan)","បារីយ៉ូមអេនេម៉ា (barium enema)","អ៊ុលត្រាសោន","កាំរស្មីអ៊ិចពោះធម្មតា (plain abdominal film)","ថតសរសៃឈាម(angiography)"],"a":[1]},{"i":"6342a9ad","b":"SUR","p":"B","q":"ក្មេងស្រីអាយុ១៩ឆ្នាំម្នាក់ត្រូវបាននាំចូលបន្ទប់សង្រ្គោះបន្ទាន់ ក្រោយគ្រោះថ្នាក់ចរាចរណ៍ពេលជិះម៉ូតូ។ ការពិនិត្យ គាត់មានពិន្ទុ GCS 10 មានហើមនៅ occipital protuberance។ តើគេត្រូវសិក្សា លើរូបភាពណាដែលត្រឹមត្រូវបំផុត?","o":["MRI លលាដ៏ក្បាលនិងខួរក្បាល (MRI of skull and contents)","កាំរស្មីអ៊ិចប្រអប់លលាដ៏ (skull films)","ស៊ីធីស្កែនក្បាលដោយមាន contrast (head CT with contrast)","ស៊ីធីស្កែនក្បាលដោយគ្មាន contrast (head CT without contrast)","ស៊ីធីស្កែនខួរឆ្អឹងខ្នង (CT myelogram)"],"a":[3]},{"i":"a5dea937","b":"SUR","p":"B","q":"តើគេទទួលបានរូបភាពកាំរស្មីអ៊ិចមួយណា ដែលមាននៅលើជំងឺរលាកឆ្អឹងសន្លាក់នៅជង្គង់ (osteoarthritis of the knee) ។","o":["សឹកគែមឆ្អឹង (marginal erosions)","Osteopenia នៅសន្លាក់ក្បែរខាង","បាត់បង់ articular cartilage ដោយមានការរួមចង្អៀតចន្លោះក្បាលឆ្អឹង","ការរលួយនៅ medialondyle នៃឆ្អឹងភ្លៅ","ការខូចទ្រង់ទ្រាយ syndesmophyte"],"a":[2]},{"i":"949ae09e","b":"SUR","p":"B","q":"ការពិពណ៌នាខាងក្រោមមួយណាមិនត្រឹមត្រូវសំដៅលើការសះស្បើយរបួស (wound healing)?","o":["ការកកើតជាលិកាអេពីតេល្យូមអាចកើតឡើងក្នុងអំឡុង២៤ម៉ោងក្រោយ ភ្ជឹតមុខរបួសដំបូង។","របួសតែងរឹងមាំក្រោយ២ឆ្នាំ","របួសបន្តរឹងមាំក្រោយការសំយោគកូឡាជែនមានតុល្យភាព","មុខរបួសរួញត្រូវបានសម្រួលដោយ myofibroblasts ។","ការករោគមុខរបួសកើនឡើងនៅក្នុងការសះរបួសដំណាក់កាល២ (secondary intention)"],"a":[4]},{"i":"fdb0733d","b":"SUR","p":"B","q":"គ្រូពេទ្យវះកាត់ផ្នែកសរសៃប្រសាទម្នាក់មានប្រវត្តិខ្សោយដៃខាងស្តាំនៅពេលយប់ ៣សប្តាហ៏មកហើយ ភាពមិនប្រកតីនេះកើតឡើងជាច្រើននាទីទើបត្រឡប់មកធម្មតាវិញ។ ការពិនិត្យឃើញ គាត់មានការចុះខ្សោយជាមធ្យមចលនាញែកមេដៃនិងចុះខ្សោយវេទនារម្មណ៍ឈឺចាប់នៅផ្ទៃមុខមេដៃនិងចង្អុលដៃ។ ការធ្វើរោគវិន្និច្ឆ័យត្រឹមត្រូវគឺៈ","o":["ចង្កោមរោគសញ្ញារូងកដៃ (carpal tunnel syndrome)","ជំងឺឬសសរសៃប្រសាទក (cervical radiculopathy)","ស្វិតសរសៃសាំប៉ាទិករ៉េផ្លិច","រលាកសរសៃពួរ (tendonitis)","ការវាយប្រហារនៃកង្វះឈាមចិញ្ចឹមតាមសរសៃអាទែរខួរក្បាលកណ្តាលឆ្វេង (left middle cerebral artery ischemic attacks)"],"a":[0]},{"i":"2ec08972","b":"SUR","p":"B","q":"ស្រ្តីអាយុ៣៧ឆ្នាំម្នាក់ រៀបរាប់ថា៦ខែមុន បានដើរពិបាកនិងពិបាកទ្រាំនៅចង្កេះ រោគសញ្ញានេះកាន់តែខ្លាំងឡើងនៅពេលដើរ។ ការពិនិត្យមិនឃើញមានអ្វីគួរអោយកត់សម្គាល់លើកលែងតែមានការចុះខ្សោយរ៉េផ្លិចនៅសាច់ដុំលាកំភួនជើង។ កាំរស្មីអ៊ិចតំបន់ឆ្អឹងកងចង្កេះនិងគូថបង្ហាញថាមានការខូចខាតស្របទៅនឹងអាយុរបស់គាត់។ ការធ្វើរោគវិន្និច្ឆ័យទំនងជាត្រឹមត្រូវបំផុតគឺ៖","o":["ក្លនលូនឆ្អឹងកងចង្កេះស្រួចស្រាវ (acute lumbar disc herniation)","ត្បៀតឬចង្អៀតឆ្អឹងកងចង្កេះ (lumbar stenosis)","បញ្ហាសាច់ដុំ (myopathy)","សំពាធធម្មតានៃទឹកក្នុងខួរក្បាល (normal pressure hydrocephalus)","ត្បៀតឬចង្អៀតឆ្អឹងកងក (cervical stenosis)"],"a":[1]},{"i":"584564d0","b":"SUR","p":"B","q":"លក្ខណៈខាងក្រោមមួយណាដែលត្រូវបានគេឃើញកើតមានម្តងម្កាលលើ cardiac tamponade?","o":["លើសឈាម","ជីពចរប៉ារ៉ាដុកសាល់ (pulsus paradoxus)","សញ្ញា Kussmaul","រីកសរសៃវ៉ែន jugular","បាត់សម្លេងបេះដូង"],"a":[2]},{"i":"64dd784a","b":"SUR","p":"B","q":"ការធ្វើរោគវិន្និច្ឆ័យល្អបំផុតសម្រាប់សម្ពាធខ្យល់ចូលសួត (Tension pneumothorax) គឺ?","o":["ស៊ីធីស្កែន (stat CT scan)","កាំរស្មីអ៊ិចទ្រូង (chest x-ray)","សង្កេតមើលនិងរង់ចាំ (watch and wait)","ការពិនិត្យគ្លីនិក (clinical exam)","មិនមានចម្លើយខាងលើ (none of the above)"],"a":[3]},{"i":"5302220e","b":"SUR","p":"B","q":"ចម្លើយខាងក្រោមមួយណាមិនមែនជាមូលហេតុសំខាន់នៃការហូរឈាមផ្លូវរំលាយអាហារខាងក្រោម?","o":["រលាកឌីវែកទីគុល(diverticulitis)","ការលូតលាស់ខុសធម្មតានៃសរសៃឈាម (agiodysplasia)","ការលេចធ្លាយសរសៃអាអ័កទៅផ្លូវរំលាយអាហារ (aotoenteric fistula)","មិនមានចម្លើយខាងលើ (none of the above)"],"a":[0]},{"i":"f66ff4bd","b":"SUR","p":"B","q":"ចម្លើយទាំងអស់ខាងក្រោមជាដើមហេតុនៃការភ្លាត់សន្លាក់ស្មាទៅក្រោយ លើកលែងតែ?","o":["ស្រវឹងស្រា អេតាណុល (ethanol)","ឆក់អគ្គិសនី (electricity)","លំហាត់ប្រាណ (exercise)","ឆ្កួតជ្រូក (epilepsy)","រលាកខួរក្បាល(encephalitis)"],"a":[2]},{"i":"247bcb0b","b":"SUR","p":"B","q":"ការព្យាបាលបាក់ឆ្អឹងចំហរមុខ ជានិច្ចជាកាលត្រូវអនុវត្តដូចខាងក្រោម លើកលែងតែ?","o":["វាយតម្លៃសភាពសរសៃឈាម និងសរសៃប្រសាទ","តម្រង់និងតឆ្អឹង (reduction and fixation of fracture)","លាងនិងសម្អាតរបួស","គ្របរបួសដោយស្បៃស្តេរីល","ដាក់ថ្នាំអង់ទីប៊ីយ៉ូទិកនឹងកន្លែងរបួស (topical antibiotic)"],"a":[4]},{"i":"ef8d905f","b":"SUR","p":"B","q":"តើប្រភេទមហារីកក្រពេញទីរ៉ូអ៊ីតមួយណាដែលជួបប្រទះញឹកញាប់ជាងគេ?","o":["medullary","papillary","follicular","lymphoma","anaplastic"],"a":[1]},{"i":"e6c94545","b":"SUR","p":"B","q":"ខាងក្រោមនេះជាករណីដាច់ខាតត្រូវអនុវត្តការកាត់អាមីដាល (tonsillectomy)?","o":["ស្ទះឬឧបសគ្គផ្លូវដង្ហើម (airway obstruction)","រលាកអាមីដាលលាប់សារចុះឡើងលើសពី៥ដង","អាប់សែជុំវិញអាមីដាល","អាមីដាលរីកធំ","មានក្លឹនស្អុយមាត់"],"a":[0]},{"i":"c6979981","b":"SUR","p":"B","q":"ការអធិប្បាយខាងក្រោមមួយណាត្រឹមត្រូវសំដៅចំពោះពិន្ទុ Glasgow coma scale?","o":["ជាពិន្ទុសម្រាប់វាយតម្លៃផលវិបាកយូរអង្វែងនៃការប៉ះទង្គិចក្បាល","ពិន្ទុខ្ពស់មានទំនាក់ទំនងទៅនឹងអត្រាស្លាប់ខ្ពស់","ក្នុងនោះមានវិធានការណ៍វាស់សម្ពាធក្នុងប្រអប់លលាដ៏","រួមមានវិធានការណ៍វាស់រ៉េផ្លិចនៃប្រស្រីភ្នែក","ក្នុងនោះមានវិធានការណ៍វាស់ការឆ្លើយតបដោយសម្លេង"],"a":[4]},{"i":"5c0b2910","b":"SUR","p":"B","q":"ការគ្រប់គ្រងដង្ហើម hyperventilation (មានកម្រឹតកាបូនិកក្នុឈាមទាប) ជាទូទៅគឺក្រោយការប៉ះទង្គិចក្បាល។ ការព្យាបាលផលវិបាករបស់វាគឺ៖","o":["កាត់បន្ថយ (endogenous catecholamines)","កាត់បន្ថយកម្រឹតប៉ូតាស្យូមក្នុងកោសិកា","បង្កើនភាពធន់(resistance)នៃសរសៃឈាមខួរក្បាល","បញ្ចូលបំពេញអាល់កាឡូស៊ីសមេតាបូលីស","ត្រូវតាមដានសំពាធធក្នុងប្រអប់លលាដ៏"],"a":[2]},{"i":"ae4f9993","b":"SUR","p":"B","q":"តើការពិពណ៌នាខាងក្រោមមួយណាត្រឹមត្រូវ សំដៅលើការបាក់ឆ្អឹងលលាដ៏ក្បាល?","o":["ការស្រុតឆ្អឹងគឺជាករណីដែលស្មារតីអ្នកជំងឺចុះខ្សោយឬបាត់បង់","បាក់ឆ្អឹងស្មុគស្មាញគឺជាករណីដែលឆ្អឹងប្រអប់លលាដ៏ត្រូវបាក់ហើយខួរក្បាលខាងក្រោមត្រូវដាច់រហែក","បំណែកឆ្អឹងដាច់ចេញមានទំហំធំជាង១សង្ទីម៉ែត្រទៅខាងក្នុងត្រូវទាញមកវិញដោយការវះកាត់","ការហូរទឺកខួរឆ្អឹងខ្នងតាមត្រចៀកឬច្រមុះ ជាករណីត្រូវធ្វើការព្យាបាលដោយវះកាត់","ស្ទើរតែគ្រប់ការបាក់ឆ្អឹងលលាដ៏ក្បាលទាំងអស់ ត្រូវព្យាបាលដោយវះកាត់"],"a":[2]},{"i":"edef35d6","b":"SUR","p":"B","q":"យុវជនអាយុ១៨ឆ្នាំម្នាក់ចូលបន្ទប់សង្រ្គោះបន្ទាន់ក្រោយគ្រោះថ្នាក់ចរាចរណ៍ដោយម៉ូតូ។ គាត់ នៅដឹងខ្លួនធម្មតាតែសាក្សីនៅកន្លែងកើតហេតុបានឪ្យដឹងថាគាត់វង្វេងវង្វាន់ម្តងម្កាលក្រោយគ្រោះថ្នាក់។ កាំរស្មីអ៊ិចប្រអប់លលាដ៏បង្ហាញថាមានបាក់ឆ្អឹងតំប៉ូរ៉ាល់(temporal)ឆ្វេង។ ក្រោយការថតកាំរស្មីអ្នកជំងឺបានបាត់ស្មារតីមួយរំពេចនិងមានរីកប្រស្រីភ្នែក។ តើអ្នកជំងឺនេះមានបញ្ហាអ្វីកើតឡើង?","o":["របួសសរសៃឈាមរីកប៉ោងបែរី (Ruptured berry aneurysm)","ការហូរឈាមក្នុង subdural ស្រួចស្រាវ","ការកកឈាមក្នុងអេពីឌុយរ៉ាល់ (Epidural hematoma)","ការហូរឈាមក្នុងពោះ (Intraabdominal hemorrhage)","របួសសរសៃវ៉ែនអាទែរដែលមានទម្រង់ខុសធម្មតា"],"a":[2]},{"i":"e0b051c6","b":"SUR","p":"B","q":"លក្ខណៈគ្លីនិកខាងក្រោមមួយណា ត្រូវបានគេរកឃើញនៅក្នុងការកើនសំពាធក្នុងប្រអប់លលាដ៏ក្បាលស្រួចស្រាវ?","o":["ការដកដង្ហើមមិនរៀបរយ (Respiratory irregularities)","សំពាធឈាមធ្លាក់ចុះ (Decreased blood pressure)","សង្វាក់បេះដូងលឿនជាងធម្មតា (Tachycardia)","Papilledema","សរសៃប្រសាទខួរក្បាលទី៥រងការសង្កត់"],"a":[0]},{"i":"dfbaafe5","b":"SUR","p":"B","q":"តើការពិពណ៌នាខាងក្រោមមួយណាត្រឹមត្រូវសំដៅលើការរបួសខ្ទាំខួរក្បាល?","o":["វាច្រើនកើតឡើងនៅក្នុងក្លែប occipital","វាអាចកើតឡើងនៅផ្នែកខាងផ្ទុយពីលលាដ៏ក្បាលដែលប៉ះទង្គិច.","វាកម្រមានការរួមផ្សំជាមួយការហូរឈាមក្នុងសាច់ខួរក្បាល","វាអាចកើតឡើងដោយឯកឯងលើអ្នកជំងឺដែលបានប្រើប្រាស់ថ្នាំប្រឆាំងការកកឈាម","ថ្នាំប្រឆាំងការប្រកាច់មិនមានតួនាទីអ្វីទេក្នុងការព្យាបាលដំបូងនូវវិបត្តិនេះ"],"a":[1]},{"i":"09d389b0","b":"SUR","p":"B","q":"បុរសអាយុ៣៧ឆ្នាំម្នាក់ក្នុងខណៈពេលមើលការប្រកួតវាយកូនហ្គោល បានប៉ះទង្គិចត្រូវផ្នែកម្ខាងនៃក្បាលដោយកូនហ្គោល។ ក្រោយប៉ះទង្គិចគាត់នៅដឹងខ្លួននិង និយាយកម្មតា តែក្រោយប៉ុន្មានថ្ងៃ គាត់សង្កេតឃើញថា ពិបាកធ្វើចលនាកាន់តែខ្លាំងឡើង ជួនកាលវង្វេងវង្វាន់និងមិនអាចធ្វើចលនា ចំហៀងខ្លួនខាងស្តាំ។ តាមការពិពណ៌នាខាងលើ ជ្រើសរើសយកប្រភេទសរសៃឈាម ដែលទំនងជាមានការពាក់ព័ន្ធច្រើនជាងគេ?","o":["កកឈាមក្នុង Subdural (Subdural hematoma)","កកឈាមក្នុង Epidural (Epidural hematoma)","ដាច់ការ៉ូទីត (Carotid dissection)","ខ្ទាំខួរក្បាល (Brain contusion)","របួសសរសៃឈាមរីកប៉ោងក្នុងប្រអប់លលាដ៏ក្បាល"],"a":[0]},{"i":"b2be86c7","b":"SUR","p":"C","q":"បុរសអាយុ១៩ឆ្នាំម្នាក់ត្រូវបានបញ្ជូនមកអាគារសង្គ្រោះបន្ទាន់ដោយ សារការបាក់ចុងក្រោមឆ្អឹងដើមដៃ ( supra-condylar fracture) ។ ពេលល្ងាច ក្រោយវះកាត់ត ឆ្អឹង គាត់សង្កេតឃើញកដៃធ្លាក់ចុះ ( wrist drop) ដោយមានស្ពឹកនៅខាងក្រោយកំភួនដៃខាងក្រៅ \n( dorso-radial)។ តើមូលហេតុមួយណាដែលជួបប្រទះញឹកញាប់ជាងគេ?","o":["របួសសរសៃវីញ្ញាណមេដ្យាន (A median nerve injury)","របួសសរសៃវិញ្ញាណយូណា (An ulnar nerve injury)","របួសសរសៃវិញ្ញាណសាច់ដុំ-ស្បែក(A musculo-cutaneous nerve injury)","របួសសរសៃវិញ្ញាណក្លៀក (An anxilliary nerve injury)","របួសសរសៃវីញ្ញាណរ៉ាដ្យាល់ (A radial nerve injury)"],"a":[4]},{"i":"987fae4c","b":"SUR","p":"C","q":"បុរសអាយុ៧២ឆ្នាំម្នាក់ស្រាប់តែឈឺចាប់ភ្លាមៗនិងខ្សោយស្មាស្តាំ។ ការពិនិត្យ ឃើញមានវិបត្តិនៃចលនាកន្ធែកស្មា (trouble initiating abduction at the shoulder)តែការលើក ដៃទៅក្រៅ៩០ដឺក្រេ គឺធម្មតា។ តើរបួសសរសៃពួរមួយណាដែលបណ្តាលអោយមាន វិបត្តិដូចខាងលើ?","o":["ក្បាលពីរ (Biceps)","ដែលតា (Deltoid)","ស៊ូប្រាស្ពីណាទុស (Supraspinatus)","អ៊ីនហ្វ្រាស្ពីណាទុស (Infraspinatus)","ក្បាលបី (Triceps)"],"a":[1]},{"i":"52712d75","b":"SUR","p":"C","q":"បុរសអាយុ២៥ឆ្នាំម្នាក់ដែលជាអ្នកសម្អាត គាត់បានរបួសមុតសើរស្បែកនៅតាមបណ្តោយកំភួនដៃឆ្វេង ប្រវែង៣សង្ទីម៉ែត្រ ដោយបំណែកកញ្ចក់ (A 25 year old man who sustains a clean, fairly superficial, 3cm long laceration to his left forearm on a piece of broken glass) ។ តើការព្យាបាលខាងក្រោមមួយណាត្រឹមត្រូវ?","o":["ចាំបាច់ត្រូវប្រើអង់ទីប៊ីយ៉ូទិកដើម្បីបង្ការ","សម្អាតអោយបានល្អឹតល្អន់ដោយសេរ៉ូមប្រៃដើម្បីបង្ការការចម្លងរោគជាជម្រើសទី១(Thorough cleansing with saline is the decontamination method of choice)","ចាំបាច់ចាក់ថ្នាំបង្ការតេតាណូស (Immediate tetanus prophylaxis is required as this is a tetanus-prone wound)","ចាំបាច់ត្រូវថតកាំរស្មីអ៊ិចបណ្តោយនិងជម្រៅរបួសអាចមើលឃើញ (X-ray is required even if the whole length and depth of the wound can be visualised)","ត្រូវដេរភ្ជឹតរបួស (The wound should be closed in layers)"],"a":[1]},{"i":"f3ca46c6","b":"SUR","p":"C","q":"បុរសចូលនិវត្តន៍អាយុ៧២ឆ្នាំថតកាំរស្មីអ៊ិចដើមទ្រូង មានគំរោងត្រូវវះកាត់។ ការថតបានបង្ហាញថាមានដុំទោលមួយទំហំ៥សង្ទីម៉ែត្រ។ តើការអធិប្បាយខាងក្រោមមួយណាមិនមែនជា សំណើសម្រាប់ធ្វើរោគ វិន្និច្ឆ័យមហារីកសួតដែលបណ្តាលអោយមានដុំទោលក្នុងសួត។","o":["មានប្រវត្តិជក់បារី (Smoking history)","អាយុច្រើន (Increasing age)","ដុំម៉ាស់មានទំហំធំជាង២សង្ទីម៉ែត្រ (Nodule size >2cm)","ដុំជាកាល់ស៊ី (Nodule calcification)","ក្អកមានឈាម (Haemoptysis)"],"a":[3]},{"i":"4a5a0a22","b":"SUR","p":"C","q":"បុរសអាយុ៧២ឆ្នាំម្នាក់ដួលបាក់កឆ្អឹងភ្លៅឆ្វេង( fracture of the neck of the left femur)។ ៦ថ្ងៃក្រោយពីវះកាត់តឆ្អឹង នៅកំភួនជើងនិងភ្លៅឆ្វេងហើមប៉ោង។ កំដៅ៣៧.៥ អង្សាសេ ក្រៅពីនោះមិនមានរោគសញ្ញាអ្វីទៀតទេ។ តើជំហ៊ានព្យាបាល បន្ទាប់ត្រូវធ្វើអ្វី?","o":["បន្តការតាមដាន (Continue observation)","រៀបចំថតកាំរស្មីអ៊ិចធម្មតាជើងឆ្វេង","រៀបចំធ្វើ venous duplex ultrasound ជើងឆ្វេង។","រៀបចំធ្វើការបណ្តុះឈាមនិងចាប់ផ្តើមប្រើអង់ទីប៊ីយ៉ូទិកតាមលទ្ធផលពិសោធន៍","រៀបចំធ្វើការវះកាត់សន្លាក់ភ្លៅជាបន្ទាន់ (Perform hip surgery immediately)"],"a":[2]},{"i":"b5e9e64c","b":"SUR","p":"C","q":"និស្សិតប្រុសអាយុ១៧ឆ្នាំម្នាក់ ដួលដោយសារជិះស្គី។ ពីរថ្ងៃក្រោយត្រូវបានបញ្ជូនមកអាគារសង្ក្រោះបន្ទាន់ដោយសារការឈឺចាប់នៅគល់មេដៃនិងតឹងណែននៅតំបន់ anatomical snuffbox/Tabatière anatomique។ ក្រៅពីនោះនៅតំបន់នេះមានហើមតែមិនមានការវៀចខុសធម្មតាទេ។ ចូរធ្វើរោគវិន្និច្ឆ័យដ៏ត្រឹមត្រូវបំផុតមួយ?","o":["រលាកថង់ទឹករំអិលនៃសរសៃពួរ (Tenosynovitis)","បាក់ឆ្អឹង Scaphoid (Scaphoid fracture)","រលាកសន្លាក់គល់មេដៃ (Base of thumb arthritis)","ភ្លាត់សន្លាក់ radiocarpal (Dislocation of the radiocarpal joint)","ភ្លាត់សន្លាក់ក្រោមនៃ radio-ulnar (Distal radio-ulnar dislocation)"],"a":[1]},{"i":"6942e386","b":"SUR","p":"C","q":"បុរសអាយុ២៨ឆ្នាំម្នាក់មានពាក់ព័ន្ធទៅនឹងការប៉ះទង្គិចបុករថយន្តចំពីមុខ។ គាត់ប្រាប់ថាបានចូលតៀមផឹកស្រាជាមួយមិត្តភក្តិក្រោយមកក៏ចាកចេញបន្ទាប់ពីប្រកែកគ្នា។ គាត់ត្រូវជាប់ក្នុងរថយន្តដែលប៉ះទង្គិចយ៉ាងខ្លាំងលើភ្លៅស្តាំ។ បន្ទាប់មកត្រូវបានគេនាំចូលអាគារសង្រ្គោះបន្ទាន់ ក្នុងសភាពនៅដឹងខ្លួនធម្មតា តែជីពចរលោត 135bpm សម្ពាធឈាម 90/60 mmHg ។ ភ្លៅខាងស្តាំគាត់វៀចនិងឃើញមានចុងឆ្អឹងលៀនចេញពីរបួស។ តើការអធិប្បាយខាងក្រោម មួយណាជាពាក្យត្រឹមត្រូវចំពោះការពិពណ៌នាការបាក់ឆ្អឹងខាងលើ?","o":["បាក់របៀបឈើខ្ចី (Greenstick fracture)","បាក់ឆ្អឹងដោយសារជំងឺ (Pathological fracture)","បាក់ឆ្អឹងស្រ្តេស (Stress fracture)","បាក់ឆ្អឹងដោតចូលគ្នា (Impacted fracture)","បាក់ច្រើនបំណែក (Compound fracture)"],"a":[4]},{"i":"10ca2d21","b":"SUR","p":"C","q":"បានចូលតៀមផឹកស្រាជាមួយមិត្តភក្តិក្រោយមកក៏ចាកចេញបន្ទាប់ពីប្រកែកគ្នា។ គាត់ត្រូវជាប់ក្នុងរថយន្តដែលបានប៉ះទង្គិចយ៉ាងខ្លាំងលើភ្លៅស្តាំ។ បន្ទាប់មកត្រូវបានគេនាំចូលអាគារសង្រ្គោះបន្ទាន់ ក្នុងសភាពនៅដឹងខ្លួនធម្មតា តែជីពចរលោត 135bpm សម្ពាធឈាម 90/60 mmHg ។ ភ្លៅខាងស្តាំគាត់វៀចនិងឃើញមានចុងឆ្អឹងលៀនចេញពីរបួស។តើចម្លើយខាងក្រោមនេះមួយណាទំនងជាផលវិបាកដំបូងគេ","o":["របួសសរសៃអាទែរហ្វេម៉ូរាល់ (Femoral artery injury)","របួសឬសសរសៃប្រសាទ S1 (S1 nerve root injury)","របួសប្លោកនោម (Ruptured bladder)","ស្ទះសរសៃឈាមនៅសួត (Pulmonary embolus)","របួសឬសសរសៃប្រសាទ L5 (L5 nerve root injury)"],"a":[0]},{"i":"233814e9","b":"SUR","p":"C","q":"ការសះស្បើយជាលិកាទន់គឺជាទំរង់ការរៀបរយមួយ។ តើចម្លើយខាងក្រោមមួយណា មិនមែនជាដំណាក់កាលក្នុងប្រភេទសះស្បើយរបួសនេះ?","o":["ប្រតិកម្មរលាកស្រួចស្រាវ (Acute inflammatory reaction)","ការកកើតជាលិការសរសៃ (Formation of fibrous tissue)","ការកកើតជាលិកាគ្រាប់ (Granuloma formation)","ការកកើតដុំកំណកឈាម (Formation of the coagulum)","ការកកើតសរសៃឈាម (Angiogenesis)"],"a":[2]},{"i":"d4220dfc","b":"SUR","p":"C","q":"ការអធិប្បាយខាងក្រោមនេះមួយណាត្រឹមត្រូវសំដៅការព្យាបាលវះកាត់មហារីកពោះវៀនធំ-រ៉ិចតូម(Rectum)?","o":["ការព្យាបាលជំនួយAdjuvantជាករណីត្រូវអនុវត្តន៍លើគ្រប់អ្នកជំងឺមហារីកពោះវៀនធំ-រ៉ិចតូមមហារីកពោះវៀនធំ-រ៉ិចតូម","គោលបំណងការព្យាបាលជំនួយAdjuvantគឺដើម្បីឲ ្តីអាយុ២០ឆ្នាំម្នាក់ស្ថិតក្នុងហេតុការនៃតៀមស្រាមួយ បានចូលមកក្នុងអាគារសង្រ្គោះបន្ទាន់ ក្នុងអាការៈសំពាធឈាមទាប និង មានរបួសចាក់ចូលពោះដោយកាំបិត ។ ពេលមកដល់មាន៖ ជីពចរ 140/min សំពាធឈាម 80/50 mmHg។ គាត់ត្រូវបានបញ្ចូលសេរ៉ូមប្រៃធម្មតា៣លីត្រ រួចហើយដើម្បីសង្រ្គោះភ្លាមៗ។ ការពិនិត្យឃើញរបួសប្រវែង២សង្ទីម៉ែត្រពីរនៅ តំបន់ចុងដង្ហើម។ ក្រោយការសង្រ្គោះតើបណ្តាការព្យាបាលខាងក្រោមមួយណាដែលចាត់ទុកថាត្រឺមត្រូវជាងគេ?","o":["វះបើកពោះដើម្បីព្យាបាលរបួស (Trauma laparotomy)","ចោះពោះឬវះបើកពោះធ្វើរោគវិន្និច្ឆ័យ (Diagnostic laparoscopy ± laparotomy)","Diagnostic peritoneal lavage","ធ្វើការវាយតម្លៃរបួសក្នុងពោះដោយសូណូក្រាហ្វីឡើងវិញ (Repeated Focused Assessment with Sonography for Trauma (FAST)","បន្តសង្កេតតាមដាននិងសង្រ្គោះនៅបន្ទប់វះកាត់នៃ​ ICU"],"a":[0]},{"i":"f76c502d","b":"SUR","p":"C","q":"កុមារអាយុ១២ឆ្នាំម្នាក់មានរបួសធ្លាយភ្លៅ ក្នុងពេលជិះកង់តាមផ្លូវ។ គាត់ត្រូវបានគេបញ្ជូនចូលអាគារសង្រ្គោះបន្ទាន់ដែលរបួសមានកំទេចកំទីខាងក្នុង។ ពេលសាកសួរ ម្តាយបានបញ្ជាក់ថា កូនគាត់បានទទួលវ៉ាក់សាំងកាលនៅអាយុ១ខួប និងម្តងទៀតមុនចូលសាលាអាយុ៥ឆ្នាំ។ តើការព្យាបាលមួយណាសមស្របជាងគេ?","o":["ចាក់ tetanus immune globulin មួយដូស","ចាក់ tetanus toxoid មួយដូស","ចាក់ tetanus toxoid បីដង","វាស់ការឆ្លើយតបអង់ទីបូឌីចំពោះ tetanus toxoid (Measure his antibody response to tetanus toxoid)","ចាក់អង់ទីប៊ីយ៉ូទិកនឹងកន្លែងរបួស"],"a":[4]},{"i":"6b10a86e","b":"SUR","p":"C","q":"បុរសអាយុ៥៦ឆ្នាំម្នាក់ដែលបានសួរអ្នក GPរបស់គាត់ ទោះបីយ៉ាងណាគាត់ត្រូវធ្វើតេស្តរកមហារីកប្រូស្តាត។តើការអធិប្បាយខាងក្រោមមួយណាត្រឹមត្រូវសំដៅលើការធ្វើតេស្តរកមហារីកប្រូស្តាត(prostate cancer screening)?","o":["តេស្តមហារីកប្រូស្តាតលើបុរសនេះមិនចាំបាច់ទេព្រោះសាច់ញាតិក្រុមគ្រួសារមិនមានអ្នកណាកើតជំងឺនេះទេ","ការព្យាបាលដោយវះកាត់មហារីកប្រូស្តាតដំណាក់កាលដំបូងអាចកាត់បន្ថយអត្រាស្លាប់","តេស្តអង់ទីហ្សែនប្រូស្តាតជាក់លាក់(Prostade-Specific Antigen=PSA test)មិនអាចរកឃើញជំងឺនេះនៅដំណាក់កាលដំបូងទេ","ការពិនិត្យជាប្រចាំមិនចាំបាច់ទេព្រោះវាថ្លៃជាងការពិនិត្យជាប្រចាំរកមហារីកដោះ","បុរសនៅអាយុនេះមិនប្រឈមនឹងមហារីកប្រូស្តាតទេ ដូច្នេះមិនចាំបាច់ពិនិត្យតាមដានជាប្រចាំឡើយ។"],"a":[1]},{"i":"9a805be8","b":"SUR","p":"C","q":"តើខាងក្រោមនេះ មួយណាជាអត្ថន័យនៃការបាក់ឆ្អឹងចំហរមុខ\nHow is an \"open\" fracture defined?","o":["គឺជាការបាក់ផ្នែកក្រាស(ឬតាន់)ទាំងមូលនៃឆ្អឹងមួយ","តម្រូវអោយធ្វើការព្យាបាលតឆ្អឹងដោយវះកាត់","តម្រូវអោយធ្វើការព្យាបាលដោយអង់ទីប៊ីយ៉ូទិក","តម្រូវអោយធ្វើការវះកាត់ដាក់ឧបករណ៍តឆ្អឹងខាងក្នុង","មានការរួមផ្សំជាមួយការខូចខាតស្បែក"],"a":[4]},{"i":"f5eeaed9","b":"SUR","p":"C","q":"ចម្លើយខាងក្រោមមួយណាដែលជួយពន្លឿនដល់ ដំណើរការសះស្បើយឆ្អឹងបាក់ធម្មតា?","o":["ថ្នាំគ្រាប់មុលទីវីតាមីន (Multivitamin tablets)","ការផឹកទឹកដោះគោ (Drinking milk)","ដាក់ប្លាត្រម្នាងសិលា (Application of a plaster of Paris cast)","រៀបចំឡើងវិញតាមកាយវិភាគនៃឆ្អឹងដើម្បីអោយឆ្អឹងតភ្ជាប់គ្នា (Restoring anatomical continuity of the bones)","ការព្យាបាលដោយថ្នាំ bisphosphonate"],"a":[2]},{"i":"2e64f000","b":"SUR","p":"C","q":"តើចម្លើយខាងក្រោមមួយណាមិនមែនជាដំណាក់កាលនៃការសះស្បើយរបួសផ្នែកទន់ធម្មតា?","o":["ប្រតិកម្មរលាក (Acute inflammatory reaction)","ការបង្កើតជាលិកាសរសៃ (Formation of fibrous tissue)","ការបង្កើតជាលិកាគ្រាប់ (Granuloma formation)","ការបង្កើតកំណកឈាម (Formation of the coagulum)","ការឃាត់ឈាម (Haemostasis)"],"a":[2]},{"i":"f8896312","b":"SUR","p":"C","q":"បុរសជិះម៉ូតូអាយុ១៨ឆ្នាំម្នាក់ ត្រូវបាននាំចូលមន្ទីរពេទ្យតាមរថយន្តគិលានសង្រ្គោះ បន្ទាប់ពីដួលម៉ូតូខ្លួនឯង។ គាត់មានបាក់ស្មុគស្មាញនៃឆ្អឹងភ្លៅស្តាំនិងមានសភាពឡេះឡះព្រមទាំងវង្វេងវង្វាន់។ តើចម្លើយខាងក្រោមមួយណាមិនមែនជាអត្ថិភាពភ្លាមៗ។","o":["ប៉ាន់ប្រមាណខ្យល់ដង្ហើមចូលនិងស្ថានភាពបំពង់ខ្យល់​ (trachea)","ពិនិត្យស្ថានភាពផ្លូវដង្ហើមខាងលើអោយបានម៉ត់ចត់","តេស្តរាប់គ្រាប់ឈាមគ្រប់ប្រភេទជាបន្ទាន់ (Urgent full blood count)","មើលកម្រឹតជាតិស្ករក្នុងឈាមជាបន្ទាន់ (Urgent blood sugar level)","បង្កើតផ្លូវចូលសរសៃវ៉ែន (Establish intravenous access)"],"a":[3]},{"i":"c92529f0","b":"SUR","p":"C","q":"បុរសអាយុ៥៧ឆ្នាំម្នាក់កំពុងរង់ចាំការវះកាត់ ត្អូញថាគាត់បានសង្កេតឃើញមានឈាមស្រស់ជាប់នៅក្រដាសអនាម័យជាច្រើនលើក ជាងពីរខែចុងក្រោយនេះ។ គាត់មានប្រវត្តិឬសដូងបាត (haemorrhoids) តាំងពីអាយុ៣០។ ការពិនិត្យឃើញតំបន់ជុំវិញទ្វារវច្ចមគ្គមានសភាពធម្មតា ចំណែកការពិនិត្យពោះវៀនត្រង់ (rectum)គឺធម្មតាដែរ។ តើសកម្មភាពដ៏ត្រឹមត្រូវបន្ទាប់គឺអ្វី?","o":["ធានាជូនគាត់ឡើងវិញម្តងទៀត (Reassure)","បញ្ជូនទៅធ្វើការឆ្លុះ ពោះវៀនធំដោយអងដូស្កូប (Refer for colonoscopy)","ពិនិត្យឡើងវិញក្រោយបីខែ (Review in 3 months)","បញ្ជូនទៅធ្វើតេស្តឈាមក្នុងលាមក (Refer for a faecal occult blood test)","ពិនិត្យរកកកម្រឹតអង់ទីហ្សែននៃ carcino-embryonic"],"a":[0]},{"i":"32563fd3","b":"SUR","p":"C","q":"អ្នកជំងឺម្នាក់ត្រូវដាក់កាដឺទែរទៅក្នុង epidural ដើម្បីបញ្ចូលថ្នាំស្ពឹកក្រោយវះ។ គាត់បានវះពោះចាប់ពីចុងឆ្អឹងសន្ទះទ្រូងទៅដល់ឆ្អឹងថ្ងាស (midline incision from xiphisternum to pubic symphysis)។ តើទីតាំងឆ្អឹងកងណាដែលត្រូវដាក់បញ្ចូលកាដឺទែរ ទៅក្នុង epidural?","o":["C7/8","T4/5","T9/10","L3/4","L5/S1"],"a":[3]},{"i":"423259dd","b":"SUR","p":"C","q":"ចម្លើយខាងក្រោមនេះតើមួយណាដែលទំនងជាមូលហេតុ ធ្វើអោយសំពាធឈាមទាបលើអ្នកជំងឺដែលបានធ្វើ epidural infusionដើម្បីស្ពឹកនឹងកន្លែង?","o":["ពុលថ្នាំស្ពឹកនឹងកន្លែង (Local anaesthetic toxicity)","រារាំង (blockade)សាំប៉ាទិក (Sympathetic blockade)","ប្រតិកម្មការពារ (Allergy causing anaphylaxis)","អាប់សែ Epidural (Epidural abscess)","ឈាមកកនៅ Epidural (Epidural haematoma)"],"a":[1]},{"i":"35a98527","b":"SUR","p":"C","q":"តើចម្លើយខាងក្រោមមួយណាដែលទំនងជាមូលហេតុធ្វើអោយស្ទះផ្លូវដង្ហើមខាងលើ ចំពោះអ្នកជំងឺបាត់ស្មារតី?","o":["វត្ថុក្រៅរាងកាយ (A foreign body)","កំអួត (Vomitus)","អណ្តាត (The tongue)","ហើមផ្លូវដង្ហើម​ (Airway oedema)","ជាលិកាបំពង់កធំហួស (Excessive pharyngeal tissue)"],"a":[2]},{"i":"bae46a68","b":"SUR","p":"C","q":"តើសមាសធាតុមួយណាអាចប្រើជារបបអាហារអ្នកជំងឺដែលត្រូវវះកាត់ពោះវៀនធំ?","o":["Polyethelene glycol","Sodium sulphate","Aluminium hydroxide","Sodium thiopentone","ទឹក (Water)"],"a":[0]},{"i":"5e9db67a","b":"SUR","p":"C","q":"អ្នកជំងឺភេទប្រុសអាយុ២៥ឆ្នាំម្នាក់ទើបទទួលការកាត់បើកវះពោះ ថ្មីៗ។ សញ្ញាជីវិតរបស់គាត់បង្ហាញ៖សំពាធឈាម 120/80 mmHg ជីពចរ 120 per min។ សារធាតុរាវបង្ហូរតាមកាដឺទែរ in-dwelling មានចំនួន100 mlsតាំងពីពេលចេញពីបន្ទប់វះកាត់១០ម៉ោងមកហើយ។ បំពង់បង្ហូរមុខរបួសមានលាយឈាម៤៥០មីល្លីលីត្រ។ តើការងារដ៏ត្រឹមត្រូវបន្តទៀតគឺអ្វី?","o":["ចាក់បញ្ចូលសារធាតុ colloid មួយ unit និងបញ្ជូនទៅធ្វើ cross match ជាបន្ទាន់និងរាប់ចំនួនគ្រាប់ឈាម។ តាមដានជីពចរនិងទិន្នផលទឹកនោមក្រោយបានបញ្ចូលសារធាតុរាវ។","តាមដានជាប្រចាំ បើសំពាធឈាមធ្លាក់ចុះ ត្រូវបន្ថែមសារធាតុរាវទៀត","បញ្ចូលឈាមក្រុម O negative និងបញ្ជូនទៅធ្វើ cross match ជាបន្ទាន់ និងរាប់ចំនួនគ្រាប់ឈាម។តាមដានជីពចរនិងទិន្នផលទឹកនោមក្រោយបានបញ្ចូលសារធាតុរាវ។","អោយអ្នកជំងឺលេប lasixចំនួន20 mg","តាមដានអ្នកជំងឺជាប្រចាំ បើទិន្នផលទឹកនោមកើនឡើងមិនចាំបាចឮធ្វើអ្វីទៀតទេ"],"a":[4]},{"i":"011557fe","b":"SUR","p":"C","q":"ស្រ្តីដ៏ធាត់អាយុ៦៥ឆ្នាំម្នាក់ដែលខ្សោយតម្រងនោមបានវះកាត់បើកពោះ។ ៥ថ្ងៃក្រោយវះកាត់ មុខរបួសវះនៅកណ្តាលពោះមានជ្រាបចេញសារធាតុរាវទាំងស្រុង។ គាត់មិនមានឡើងកំដៅទេ។ តើវាទំនងជា បណ្តាលមកពីអ្វី?","o":["អាប់សែមុខរបួស (Wound abscess)","មុខរបួសមិនផ្សារភ្ជាប់គ្នា (Wound dehiscence)","ការសះស្បើយមុខរបួសធម្មតា (Normal wound healing)","ប្រតិកម្មនៃថ្នេររបួស (Allergic reaction to the sutures)","មានរន្ធធ្លាយពោះវៀន (Bowel fistula)"],"a":[1]},{"i":"89379e3c","b":"SUR","p":"C","q":"តើមួយណាជាសមាសធាតុល្អបំផុតដែលអាចលាបលើជាលិកាមនុស្ស ដើម្បីរារាំងឬសម្លាប់មេរោគក្នុងគោលបំណងកាត់បន្ថយការប្រឈមមុខនឹងការចម្លងមេរោគ ( reducing the risk of sepsis)?","o":["A disinfectant","A sterilising agent","An antiseptic","An antibacterial","An antibiotic"],"a":[2]},{"i":"e014b4d7","b":"SUR","p":"C","q":"ស្រ្តីអាយុ៧៨ឆ្នាំម្នាក់មានអាការៈក្តៅខ្លួនតិចតួច សង្វាក់បេះដូងលឿន ឈឺចាប់ក្នុងពោះ។ ពិនិត្យឃើញមាន៖ ដុំម៉ាស់ឈឺមួយនៅ iliac fossaឆ្វេង (tender mass in the left iliac fossa)។ ក្រោយការសង្រ្គោះជំហ៊ានដំបូងនិងតេស្តឈាម តើអ្នកគួរធ្វើការអង្កេតអ្វីបន្តទៀតដែលសមស្របជាងគេ?","o":["ស៊ីធីស្កែនអាងត្រគាកនិងពោះ (Abdominal and pelvic CT scan)","តេស្តរកឈាមក្នុងលាមក (Faecal occult blood)","បារីយ៉ូមអាណេម៉ា (Barium enema)","អ៊ុលត្រាសោនពោះ (Ultrasound of the abdomen)","ឆ្លុះអង់ដូស្កូបពោះវៀនធំ (Colonoscopy)"],"a":[0]},{"i":"85b9de71","b":"SUR","p":"C","q":"អ្នកជំងឺរងការប៉ះទង្គិចម្នាក់សង្ស័យថារបួសឆ្អឹងកងក តម្រូវអោយដាក់ intubation។ តើការអធិប្បាយខាងក្រោមមួយណាត្រឹមត្រូវសំដៅលើ intubation?","o":["ការប្រើដៃទប់កអោយត្រង់ Manual in-line stabilisation​ (MILS)ដើម្បីធ្វើការឆ្លុះបំពង់កនិងដាក់ intubation ងាយស្រួល ជាង","រណបករឹងគួរដាក់នៅនឹងកន្លែងកើតហេតុ (The hard collar should be left in place)","ការទាញតម្រង់គួរអនុវត្តក្រោយដោះរណបករឹងចេញ","ការប្រើដៃទប់កអោយត្រង់ (MILS) អាចទប់ក្បាលអ្នកជំងឺកុំអោយមានចលនា","រណបកទន់គួរអនុវត្តក្រោយដាក់បំពង់ដកដង្ហើមចូលបំពង់ខ្យល់រួចហើយ (endotracheal intubation) ។"],"a":[0]},{"i":"431ddc08","b":"SUR","p":"C","q":"យុវជនអាយុ១៥ឆ្នាំម្នាក់មានអាការៈឈឺចាប់តំបន់ជុំវិញផ្ចឹត សីតុណ្ហភាពមធ្យម និងក្អួត។ បន្ទាប់ពីជាងពីរម៉ោងមកការឈឺចាប់ប្រមូល ផ្តុំនៅ right iliac fossa (pain shifts to the right iliac fossa)។ តើបណ្តារោគវិន្និច្ឆ័យខាងក្រោមមួយណាទំនងជាងគេ?","o":["Mesenteric lymphadenitis","រលាកខ្នែងពោះវៀនស្រួចស្រាវ (Acute appendicitis)","ជំងឺក្រូន (Crohn's disease)","ជំងឺរលាកអាងត្រគាក (Pelvic inflammatory disease)","រលាកកូនថង់ពោះវៀនមីកែល (Meckel's diverticulitis)"],"a":[1]},{"i":"0672d2c3","b":"SUR","p":"C","q":"តើការខុសគ្នាសំខាន់រវាងថ្នាំរំងាប់អារម្មណ៍និងថ្នាំសណ្តំ (sedation and general anaesthesia)?","o":["សតិវិបល្លាស (ការខូចស្មារតី) (Amnesia)","ខ្វះចលនាឆ្លើយតបពេលមានរំញោចឈឺចាប់","រក្សាចលនាដង្ហើមដោយខ្លួនឯង (Maintenance of spontaneous respiration)","មានអន្តរកម្មជាមួយ one's environment (Ability to interact with one's environment)","បន្ថយការឈឺចាប់ (Analgesia)"],"a":[4]},{"i":"61562799","b":"SUR","p":"C","q":"បុរសអាយុ៥៨ឆ្នាំម្នាក់មានអាការៈឈឺចាប់និងលាមកមានឈាមស្រស់នៅពេលបត់ជើងធំ។ ការពិនិត្យឃើញមានស្នាមប្រេះនៅលើសាច់ដុះតូចៗ(skin tag)មួយនៅចំខាងក្រោយទ្វារវច្ចមគ្គ។ តើវាជារបួសពិតប្រាកដមួយណា?","o":["អាប់សែជុំវិញទ្វារវច្ចមគ្គ (Peri-anal abscess)","ឬសដូងបាត (Haemorrhoids)","រន្ធធ្លាយទ្វារវច្ចមគ្គ (Anal fistula)","Pilonidal sinus","ប្រេះទ្វារវច្ចមគ្គ (Anal fissure)"],"a":[1]},{"i":"2cb98504","b":"SUR","p":"C","q":"យុវជនស្រម៉ូមអាយុ២០ឆ្នាំម្នាក់មានអាការៈឈឺចាប់យ៉ាងខ្លាំងនៅតំបន់រន្ធគូថ ( internatal cleft) ។គាត់មានសីតុណ្ហភាពរាងកាយមធ្យម ការពិនិត្យឃើញ៖ ដុំពកមួយ ឈឺ​ និងពណ៌ក្រហម ។ តើរោគវិន្និច្ឆ័យទំនងជាត្រឹមត្រូវជាងគេគឺអ្វី? \nA hirsute 20 year old male presents with severe pain in the internatal cleft. He has a low grade temperature and on examination there is a red tender lump in that region. \nWhat is the most likely diagnosis?","o":["អាប់សែជុំវិញទ្វារវច្ចមគ្គ (Perianal abscess)","Pilonidal abscess","រន្ធធ្លាយទ្វារវច្ចមគ្គ (Anal fistula)","Spina bifida","Folliculitis"],"a":[0]},{"i":"600e7325","b":"SUR","p":"C","q":"អនុវត្តការរុំសង្កត់លើមុខរបួសវះ ( Graduated compressive stockings) ចំពោះ អ្នកជំងឺសះស្បើយពីការវះកាត់គឺដើម្បីបង្ការអ្វី?","o":["ការហើមជុំវិញ (Peripheral oedema)","សំពាធសង្កត់លើដំបៅ (Pressure ulcers)","រលាកកោសិកា (Cellulitis)","រលាកសរសៃវ៉ែនរាក់ដោយសារស្ទះ (Superficial thrombo phlebitis)","កកស្ទះសរសៃឈាមវ៉ែន (Venous thrombo embolism)"],"a":[4]},{"i":"d92c8aa8","b":"SUR","p":"C","q":"អ្នកជំងឺម្នាក់សង្ស័យថាមានអាប់សែក្នុងពោះ (intra-abdominal abscess)តើការអធិប្បាយខាងក្រោមនេះមួយណាតំណាងអោយក្រា ហ្វិកសីតុណ្ហភាពរាងកាយរបស់គាត់?\nA patient with a suspected intra-abdominal abscess would have the following pattern to their temperature chart?","o":["សីតុណ្ហភាព 38°C ថេរ (A constant temperature of about 38°C)","សីតុណ្ហភាព36°C ថេរ (A constant temperature below 36°C)","សីតុណ្ហភាពនៅពេលយប់ឡើងដល់ 40°C (Night fevers rising to 40°C)","សីតុណ្ហភាពប្រែប្រួលពីធម្មតាដល់ 40°C","សីតុណ្ហភាពប្រែប្រួលពី 35°C ដល់ 37.5°C"],"a":[0]},{"i":"e1ae42b1","b":"SUR","p":"C","q":"អ្នកជំងឺអាយុ៣៦ឆ្នាំនៅមាំទាំម្នាក់នឹងត្រូវវះកាត់ជ្រើសរើស (elective operation)ក្រោមការដាក់ថ្នាំសណ្តំ។ ៨នាទីក្រោយដាក់បញ្ចូលបំពង់ដង្ហើម ( intubation) ចូលទៅក្នុងបំពង់ខ្យល់ នាឡិកាបង្ហាញកម្រឹតកំហាប់អុកស៊ីសែនបានធ្លាក់ចុះពី 98% ទៅ 88%។ តើមូលហេតុមួយណាទំនងជាងគេ?","o":["ដាក់បំពង់ចូលទៅក្នុងបំពង់អាហារ (Oesophageal intubation)","ដាក់បំពង់ចូលទៅក្នុងទងសួត (Endobronchial intubation)","ស្វិតសួតផ្នែកខាងក្រោម (Basal atelectasis)","ស្ទះសរសៃឈាមក្នុងសួត (Pulmonary embolism)","ខ្យល់ចូលស្រោមសួត (Pneumothorax)"],"a":[0]},{"i":"d64d7a4c","b":"SUR","p":"C","q":"តើយន្តការយ៉ាងដូចម្តេចចំពោះសកម្មភាពរបស់ថ្នាំស្ពឹក​លើកោសិកាសរសៃប្រសាទ?","o":["រារាំងរ៉េសិបទ័រ nicotinic acetylcholine (Blockade of nicotinic acetylcholine receptors)","ការកើនឡើងនៃ Gamma Aminon Butyric Acid-B ដើម្បីជំរុញសកម្មភាពរ៉េសិបទ័រ","រារាំងភ្នាស Na-K-ATPase (Blockade of the membrane Na-K-ATPase)","រារាំង voltage-gated sodium channels (Blockade of voltage-gated sodium channels)","ទប់ស្កាត់ការរំដោះចេញអាសេទីលកូលីន"],"a":[3]},{"i":"9e50e507","b":"SUR","p":"C","q":"តើ tramadol មានផលល្អជាង morphine​​​ដូចម្តេចខ្លះ?","o":["ធ្វើអន្តរកម្មជាមួយ antidepressants តិចជាង morphine","មានសំពាធទៅលើការដកដង្ហើមតិចជាង (Less respiratory depression)","ជាមូលហេតុធ្វើអោយប្រកាច់តិចជាង (Less likely to cause seizures)","រាគតិចតួចជាង (Less diarrhoea)","ងាយប្រឆាំងតបជាមួយ flumazenil (Easily reversed with flumazenil)"],"a":[1]},{"i":"8713d091","b":"SUR","p":"C","q":"ស្រ្តីអាយុ៧៥ឆ្នាំម្នាក់ត្រូវបាននាំចូលអាគារសង្រ្គោះបន្ទាន់តាមរថយន្តគិលានសង្រ្គោះក្រោយដួលនៅផ្ទះ។ គាត់មិនអាចដើរបាន និងត្អូញឈឺនៅក្រលៀនពេលធ្វើចលនាជើងឆ្វេង។ ពិនិត្យឃើញគាត់ដេកនៅលើគ្រែដោយកំណាត់ជើងឆ្វេងរមួល។ ជើងឆ្វេងខ្លីជាងជើងស្តាំ៣សង្ទីម៉ែត្រ។ សភាពទូទៅធម្មតានិងមិនទាន់មានប្រើថ្នាំទេ។ តើការអង្កេតដ៏សមស្របជាបន្តគឺអ្វី?","o":["ពិនិត្យ ថង់លាមក (Rectum) និងពោះ","ស្កែនឆ្អឹង (Bone scan)","ថតកាំរស្មីអ៊ិចអាងត្រគាក (Plain X-ray of the pelvis)","អ៊ុលត្រាសោនជង្គង់ (Ultrasound of the knee)","ថតកាំរស្មីអ៊ិចសន្លាក់ភ្លៅ (Plain X-ray of the hip)"],"a":[4]},{"i":"8ff48da8","b":"SUR","p":"C","q":"កុមារាអាយុ៤ឆ្នាំម្នាក់ត្រូវបាននាំចូលអាគារសង្រ្គោះបន្ទាន់។ ម្តាយក្មេងបានរៀបរាប់ថាវាបានធ្លាក់ពីខាងក្រោយ trampoline។ កែងដៃស្តាំហើមនិងវៀច។ បាត់ជីពចរកដៃព្រមទាំងប្រអប់ដៃស្លាំង។ កុមារនិយាយថាមានអារម្មណ៍ចម្លែកលើប្រអប់ដៃ \"feels funny\"។ តើរោគវិន្និច្ឆ័យដ៏សមស្របគឺអ្វី?","o":["ភ្លាត់សន្លាក់ក្បាលឆ្អឹងរ៉ាដ្យាល់រួមជាមួយបាក់ឆ្អឹងយូណា","ពាក់កណ្តាលភ្លាត់សន្លាក់ក្បាលឆ្អឹងរ៉ាដ្យាល់ (Subluxed radial head)","បាក់ចុងលើឆ្អឹងយូណា (Proximal ulnar fracture)","បាក់ចុងក្រោមឆ្អឹងដើមដៃ (Supracondylar humeral fracture)","បាក់អេពីកុងឌីលក្នុង (Fractured medial epicondyle)"],"a":[3]},{"i":"4fb3094c","b":"SUR","p":"C","q":"កុមារាអាយុ៤ឆ្នាំម្នាក់ត្រូវបាននាំចូលអាគារសង្រ្គោះបន្ទាន់។ ម្តាយក្មេងបានរៀបរាប់ថាវាបានធ្លាក់ពីខាងក្រោយ trampoline។កែងដៃស្តាំហើមនិងវៀច។ បាត់ជីពចរកដៃព្រមទាំងប្រអប់ដៃស្លាំង។ កុមារនិយាយថាមានអារម្មណ៍ចម្លែកលើប្រអប់ដៃ \"feels funny\"។ ​តើការព្យាបាលជំហ៊ានដំបូងដ៏សមស្របគឺអ្វី?","o":["ត្រួតពិនិត្យអំពី សភាពបញ្ជូនចរន្តប្រសាទនៃសរសៃប្រសាទជាបន្ទាន់ (Urgent nerve conduction studies)","លាដៃកាន់តែត្រង់កាន់តែល្អបន្ទាប់មកអចល័តនៅខាងក្រោយដោយបន្ទះក្រាស។","ដាក់ដៃទៅក្នុងសំពត់ព្យួរ រង់ចាំការទាញតម្រង់ក្នុង២៤ម៉ោង","ចាក់ថ្នាំស្ពឹកនឹងកន្លែងចូលទៅតំបន់ជុំវិញកែងដៃដើម្បីបន្ថយការឈឺចាប់","ផ្តល់ដំណឹងករណីនេះទៅនាយកដ្ឋានរបំរើសហគមន៍"],"a":[2]},{"i":"78723803","b":"SUR","p":"C","q":"បុរសអាយុ២១ឆ្នាំម្នាក់ត្រូវបាននាំចូលអាគារសង្រ្គោះបន្ទាន់។ គាត់បានផឹកស្រាយ៉ាងច្រើន ហើយបានដួលក្នុងពេលព្យាយាមគេចពីការឃាត់ខ្លួន។ កជើងគាត់ហើមយ៉ាងធំនិងវៀចយ៉ាងធ្ងន់ធ្ងរ។ ជីពចរនៅខ្នងជើងមានធម្មតា ចំណែកស្បែកមិនមានដាច់រលាត់ទេ តែមានតឹងណែនលាតសន្ធឹងនៅផ្នែកខាងក្នុងកជើង។ តើរោគវិន្និច្ឆ័យទំនងជាត្រឹមត្រូវបំផុតគឺអ្វី?","o":["រហែកមួយផ្នែកនៃសរសៃពួរក្នុង(deltoid)នៃកជើង","បាក់ឆ្អឹងនិងភ្លាត់សន្លាក់កជើង (Fracture dislocation of the ankle)","បាក់កឆ្អឹងតាលុស (talus) (Fractured neck of talus)","បាក់ឆ្អឹងណាវីគូឡា(Navicular) (Navicular fracture)","បាក់និងបែកឆ្អឹងកាល់កានៀល (Calcaneal) (Calcaneal crush fracture)"],"a":[1]},{"i":"bf118a32","b":"SUR","p":"C","q":"ស្រ្តីអាយុ៣៥ឆ្នាំម្នាក់ត្រូវបាននាំចូលអាគារសង្រ្គោះបន្ទាន់តាមរថយន្តគិលានសង្រ្គោះក្រោយឃើញដេកនៅក្នុងប្រឡាយ។ គាត់អាចនិយាយបានតែមិនអាចឆ្លើយចម្លើយជាប់ៗគ្នាបាន។ សញ្ញាជីវិតដំបូង៖ សង្វាក់បេះដូង 120 bpm សំពាធឈាម 80/40 mmHg សីតុណ្ហាភាព 38ºC សង្វាក់ដង្ហើម 28 bpm។ ដំបូងតើអ្នកគួរធ្វើអ្វីចំពោះអ្នកជំងឺនៅលើគ្រែនេះ","o":["ធ្វើការពិនិត្យសភាពប្រព័ន្ធប្រសាទ","ដោះសំលៀកបំពាក់ សង្កេតមើលសញ្ញានៃរបួស","Ask for an urgent 12 lead electrocardiogram (ECG)","ស្តាប់សួតរបស់គាត់ (Auscultate her chest)","បញ្ចូលកានុលក្នុងសរសៃវ៉ែន (Insert an intravenous cannula)"],"a":[4]},{"i":"d528f4e3","b":"SUR","p":"C","q":"បុរសអាយុ២២ឆ្នាំម្នាក់ដែលផឹកស្រានៅក្រៅផ្ទះកាលពីយប់ត្រូវបាននាំចូលអាគារសង្រ្គោះ បន្ទាន់ ដោយបានត្អូញឈឺប្រអប់ដៃស្តាំ។ ពេលសួរនាំអ្វីដែលបានកើតឡើង គាត់បដិសេធ។ ពិនិត្យឃើញមានការឈឺចាប់នៅតាមបណ្តោយឆ្អឹងUlnaនៅប្រអប់ដៃនិងកដៃ និងមានហើមបបូរមាត់ និងជាំជុំវិញភ្នែកស្តាំ។ តើអ្នកអាចធ្វើរោគវិន្និច្ឆ័យដំបូងយ៉ាងដូចម្តេច?","o":["គ្រេចនៅកដៃ (A sprained wrist)","បាក់ឆ្អឹងរបៀប Bennett (A Bennett's fracture)","ភ្លាត់សន្លាក់ បាក់ឆ្អឹង Colles (A displaced Colles' fracture)","បាក់ឆ្អឹងកដៃខាងក្នុង (A fracture of ceptive therapy)","អស់រដូវក្រោយអាយុ​ ៥៥ ​ឆ្នាំ","Nonsteroida anti-inflammatory drugs","មិនបង្កើតកូន (nulliparity)","Ovulation induction medications"],"a":[0]},{"i":"8ca34c83","b":"OBG","p":"A","q":"ស្រ្តីអាយុ៤២ ឆ្នាំម្នាក់ ធ្លាប់មានផ្ទៃពោះចំនួន៤ដង សំរាលបានបួនដង មកពិនិ ត្យតាមដានរកជំងឺមហារីកជាប្រចាំ (Well-known examination)។គាត់បានសំរាលកូនដោយធម្មជាតិចំនួន៣ដង និងដោយវះកាត់មួយដង ដោយសារកូនហុចគូថមកមុន (breech)។គាត់ប្រាប់ថា រដូវរបស់គាត់មកទៀងទាត់ ហើយអះអាងថា គាត់គ្មានឆ្លងជំងឺកាមរោគទេ។បច្ចុប្បន្ននេះ គាត់ និងប្តីរបស់គាត់ប្រើស្រោមអនាម័យ ប៉ុន្តែ ពួកគាត់មិនចូលចិត្តមធ្យោបាយពន្យារកំណើត ដែលរំខានដល់ការរួមដំណេកទេ( Coital-dependent method) ។ គាត់ចាប់អារម្មណ៍លើការពន្យារកំណើតដែលមានប្រសិទ្ធិភាពល្អជាងនេះ ព្រោះពួកគាត់មិនចង់បានកូនទៀតទេ។ គាត់ប្រាប់ថា ជួនកាលគាត់ឈឺក្បាលប្រកាំងនិងកាលពីវ័យកុមារគាត់ធ្លាប់មានប្រតិកម្មទាស់ជាមួយនឹងថ្នាំស្ពឹកយ៉ាងធ្ងន់ធ្ងរ នៅពេលដែលគាត់ទទួលយកការវះកាត់យកអាមីដាល់ចេញ (tonsillectomy)។ គាត់ផឹកនិងជក់ជាប់ជាប្រចាំ។គាត់មានទំងន់ ៧៨ គ.ក្រ ហើយមានសំពាធឈាម ១៤២/៨៩ mm Hg ។ ក្នុងពេលដែលគាត់មក ពិនិត្យ អ្នកផ្តល់ប្រឹក្សាយ៉ាងវែងដល់គាត់ ជុំវិញវិធីសាស្រ្តគ្រប់គ្រង កំណើត។ ក្នុងចំណោមវិធីសាស្រ្តខាងក្រោម តើវិធីសាស្រ្តពន្យារកំណើតណាមួយ ដែលសមស្របសំរាប់គាត់ជាងគេ?","o":["ដាក់កងក្នុងស្បូន (Intrauterine device)","ចងដៃស្បូន (Bilateral tubal ligation)","ថ្នាំពន្យារកំណើត (combination oral contraceptives)","Diaphragm","ដាក់កងនៅដៃ Transdermal patch"],"a":[0]},{"i":"6ea8d086","b":"OBG","p":"A","q":"ស្រ្តីម្នាក់អាយុ៤៨ឆ្នាំ ធ្លាប់មានគភ៌២ដងកើតបាន២ដង មកពិនិត្យរកមហារីក។ គាត់សំរាលកូនទាំងពីរតាមធម្មជាតិ ដោយគ្មានហេតុការណ៍អ្វីគួរឲ្យចាប់អារម្មណ៍ទេ។ គាត់បានវះកាត់យកស្បូនចេញ ដោយសារគាត់មានដុំសាច់ (fibroids) និង មានធ្លាក់ឈាម (menorrhagia) ។ គាត់បដិសេធថាគ្មានបញ្ហាវេជ្ជសាស្រ្ត (medical problems)ដទៃទៀតទេ ប៉ុន្តែខានមកជួបវេជ្ជបណ្ឌិត ៦ ឆ្នាំមកហើយ។ ក្រុមគ្រួសាររបស់គាត់មានប្រវត្តិដាច់សរសៃឈាម (stroke) ទឹកនោមផ្អែម (diabetes) និង លើសឈាម (high blood pressure)។ នៅពេល ពិនិត្យ គាត់ជាស្រ្តីគួរឲ្យចូលចិត្តម្នាក់ កំពស់ ១.៥២ម ទំងន់៨៥ គ.ក្រ សំពាធឈាម ១៥០/៩២ mm Hg ជីពចរលោត ៧០ដង ក្នុងមួយនាទី ដកដង្ហើម ១៤ ដង ក្នុងមួយនាទី និង មានសីតុណ្ហភាពក្នុងខ្លួន ៣៧ ើម្បីវាយតំលៃអំពី postmenopausal bleeding។ គាត់មានជំងឺធាត់ និង មានជំងឺលើសឈាមរ៉ាំរ៉ៃ និងមានការយារយីពីជំងឺទឹកនោមផ្អែម ។ ការធ្វើ Endometrial sampling មួយនៅក្នុងបន្ទប់ពិគ្រោះរបស់អ្នក បង្ហាញពី complex endometrial hyperplasia with atypia និង ការពិនិត្យ pelvic ultrasound ដែលធ្វើឡើងនៅក្នុងមន្ទីរពេទ្យបង្ហាញពីស្បូនធំនិងដុំសាច់ជាច្រើន លើផ្ទៃស្បូន។ ក្នុងចំណោមវិធីព្យាបាលខាងក្រោមនេះ តើវិធីណាមួយដែលល្អបំផុតសំរាប់ព្យាបាលគាត់?","o":["ចៀរយកតែដុំសាច់ចេញពីស្បូន (Myomectomy)","បើកពោះកាត់ស្បូនចេញទាំងអស់ (Total abdominal hysterectomy)","លេបថ្នាំគ្រាប់ពន្យារកំណីត(Oral contraceptives)","​ Uterine artery ambolization","លេបថ្នាំគ្រាប់progesterone"],"a":[1]},{"i":"a75a3e60","b":"OBG","p":"A","q":"អ្នកបានជួបជាមួយអ្នកជំងឺដែលអស់រដូវ (postmenopausal patients) ចំនួន៥នាក់នៅគ្លីនីក។ អ្នកជំងឺម្នាក់មានបញ្ហាមួយ ក្នុងចំណោមបញ្ហាដែលមានរាយឈ្មោះដូចខាងក្រោម ហើយពួកគាត់សុទ្ធតែចង់ចាប់ផ្តើមព្យាបាលដោយប្រើ អ័រម៉ូន (hormone replacement therapy) ថ្ងៃនេះ។ តើអ្នកជំងឺមួយណាដែល អ្នកគួរចាប់ផ្តើមព្យាបាលមុនគេ ក្នុងពេលនេះ?","o":["លើសឈាមកំរិតដំបូង (Mild essential hypertension)","មានជំងឺថ្លើម ហើយលទ្ធផលធ្វើតេស្តបង្ហាញថា មុខងាររបស់ថ្លើមមានភាពមិនប្រក្រតី (Liver disease with abnormal liver function tests)","ហើម ដែលអាចបង្កឲ្យមានគ្រោះថ្នាក់ដល់ជីវិត (Malignant melanoma)","មានឈាមនៅក្នុងទ្វារមាស ដោយមិនដឹងមូលហេតុ (undiagnosed genital tract bleeding)","មានជំងឺមហារីកស្បូនដំណាក់កាលទីបី ដែលបានព្យាបាលហើយ។"],"a":[0]},{"i":"5492f2f9","b":"OBG","p":"A","q":"ម្តាយម្នាក់នាំកូនស្រីអាយុ១២ ឆ្នាំ មកជួបអ្នក ដើម្បីពិគ្រោះយោបល់។ គាត់បារម្ភ ព្រោះកុមារីជាច្រើនក្នុងថ្នាក់របស់កូនស្រីគាត់ចាប់ផ្តើមមានរដូវ។ គាត់គិតថា កូនស្រីគាត់មិនទាន់មានសញ្ញាអ្វីបញ្ជាក់ថា នាងពេញវ័យនៅឡើយ។ ដោយយល់ដឹងអំពីសញ្ញាដំបូងនៃការពេញវ័យ ក្នុងចំណោមសំនួរខាងក្រោម តើអ្នកគួរសួរសំនួរអ្វីទៅកាន់ម្តាយកុមារីនេះ?","o":["តើកូនស្រីគាត់មានកើតមុន​ដែរ ឬទេ?","តើកូនស្រីរបស់គាត់ចាប់ផ្តើមមានឡើងដោះហើយ ឬនៅ?","តើកូនស្រីគាត់មានដុះរោមក្លៀក ឬរោមលើថ្ងាសទ្វារមាស​ហើយឬនៅ","​​​ តើកូនស្រីរបស់គាត់ចាប់ផ្ដើមឡើងខ្លួនហើយ ឬនៅ","តើកូនស្រីរបស់គាត់មានឈាមតាមទ្វារមាសហីយ ឬនៅ"],"a":[1]},{"i":"611470f0","b":"OBG","p":"A","q":"ស្រ្តីអាយុ៥៥ ាំ មកបន្ទប់ពិគ្រោះជំងឺរបស់អ្នក ដោយមានគភ៌ ១០ អាទិត្យដើម្បីពិគ្រោះតាមដានគភ៌ដំបូងរបស់គាត់។ គាត់ត្រូវបានណែនាំដោយមិត្ដរបស់គាត់ដែលធ្លាប់ជាអតិថិជនរបស់អ្នក ។ គាត់ចង់បានអ្នកជា គ្រូពេទ្យរបស់គាត់ ដែល និង សំរាលបុត្រអោយគាត់ ថែទាំបុត្ររបស់គាត់ ផង ។ស្បូនរបស់ គាត់មានទំហំស្មើនិង ១០អាទិត្យ បើតាមការពិនិត្យមើលដោយស្ទាបនិងដៃ។ គាត់មានសំពាធឈាម ១០០/៧០ mmHg។ ការពិនិត្យ បង្ហាញ ថាសុខភាពគាត់មានសភាពធម្មតាទាំងអស់ ។ស្ត្រីចោទជាសំនួរសួរអ្នកអំពីគម្រោងសម្រាលនៅពេលដែលគាត់មកពិនិត្យដំបូងនេះ ហើយសួរអំពីឥរិយាបថអ្នក ចំពោះគូរស្រករដែលមានគ៌ភចង់ចូលរួមសំរេច ចិត្ដក្នុងការឈឺពោះ និងសម្រាល តើអ្នកឆ្លើយយ៉ាងណា","o":["គម្រោងសម្រាលមិនមែនជាគំនិតល្អដោយជាធម្មតាអ្វីៗមិនដូចគម្រោងនិងធ្វើអោយគូស្រករខកចិត្ដ","គម្រោងសម្រាល មិនមែនជាគំនិតល្អដោយជាញឹកញាប់ វាអាចនាំដល់កំហុសដែលមិនអាចដោះស្រាយបាន ចំពោះគូស្រករ ។","គំរោងសំរាលត្រូវតែជៀសវាងដោយផលវិបាក និង ការស្លាប់ជុំវិញការសំរាលមានការកើនឡើងច្រើនជាទូទៅ","គម្រោងសម្រាល ជាគំនិតល្អណាស់ ដោយអ្វីប្រព្រឹត្ដទៅតាមការគ្រោងទុក","គម្រោងសម្រាលជាគំនិតល្អ ដោយវានាំឳ្យគូស្រករបានចូលរួមក្នុងការ ​​​ សម្រាលកូនរបស់គាត់ និងអាចជាផ្នែកដ៏​មាន​​សារៈសំខាន់ នៃការថែទាំគភ៌ មុនសំរាល និងក្រោយសំរាលផង"],"a":[4]},{"i":"3a07dcd8","b":"OBG","p":"C","q":"ស្ដ្រីម្នាក់អាយុ ២២ ឆ្នាំ មកបន្ទប់ពិគ្រោះជំងឺរបស់អ្នក ដោយមានគភ៌ ១០ អាទិត្យដើម្បីពិគ្រោះតាមដានគភ៌ដំបូងរបស់គាត់។ គាត់ត្រូវបានណែនាំដោយមិត្ដរបស់គាត់ដែលធ្លាប់ជាអតិថិជនរបស់អ្នក ។ គាត់ចង់បានអ្នកជាគ្រូពេទ្យរបស់គាត់ ដែលនឹងសម្រាលបុត្រអោយ គាត់ ថែទាំបុត្ររបស់គាត់ផង ។ស្បូនរបស់គាត់មានទំហំស្មើនិង ១០អាទិត្យ បើតាមការពិនិត្យមើលដោយស្ទាបនិងដៃ។ គាត់មានសំពាធឈាម ១០០/៧០ mmHg។ ការពិនិត្យ បង្ហាញ ថាសុខភាពគាត់មានសភាពធម្មតាទាំងអស់ ។ស្តី្រចោទសួរអ្នកអំពីទម្លាប់នៃការចាក់បញ្ចូលសេរ៉ូមតាមសរសៃឈាមពេល ឈឺពោះសំរាល។ ចំពោះទម្លាប់នេះ តើគំនិតខាងក្រោមណាមួយដែលខុស","o":["ការចាក់សេរ៉ូមតាមសរសៃឈាមជាទម្លាប់នេះ មិនរំខានដល់ការផ្លាស់ប្តូរ ស្ថានភាពស្ត្រី នៅដំណាក់កាលទីមួយនៃការឈឺពោះ​សំរាលទេ។","បើសិនមានធ្វើEpiduralកុំឱ្យឈឺពោះនោះ ការចាក់សរសៃត្រូវមានជាការចាំបាច់","បើសិនជាដំណាក់កាលទីមួយនៃការឈឺពោះសំរាលអូសបន្លាយ នោះ ការចាក់សរសៃឈាម គួរតែមាន ដើម្បីការពារការខ្វះជាតិទឹក ។","បើអ្នកជំងឺមានប្រវត្ដិ ធ្លាក់ឈាមក្រោយសំរាលធ្ងន់ធ្ង នោះការចាក់សរសៃឈាម គួរតែមាន។", <script>

  {k:"MED",name:"Medicine",km:"វេជ្ជសាស្ត្រ",subs:["MED","PED","OBG"]},
  {k:"SUR",name:"Surgery",km:"វះកាត់",subs:["SUR"]},
  {k:"ALL",name:"Mixed",km:"ទាំងបីផ្នែក",subs:["BS","MED","PED","OBG","SUR"]}
];

const KEY="osce-mcq-state-v1",SKEY="osce-mcq-stats-v1",PKEY="osce-mcq-papers-v1",PMAX=15;
const LET="ABCDE";
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n.toLocaleString("en-US");

let STATS=load(SKEY,{});

let tick=null,confirmFinish=false,confirmClear=false;

function save(){store(KEY,S)}

function poolFor(cfg){
  let p=BANK.filter(q=>cfg.subs.includes(q.b));
  if(cfg.src==="wrong")p=p.filter(q=>STATS[q.i]&&STATS[q.i].w);
  return p;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function deal(cfg){
  let p=shuffle(poolFor(cfg).slice());
  if(cfg.src==="unseen")p.sort((a,b)=>((STATS[a.i]||{}).s||0)-((STATS[b.i]||{}).s||0));
  const n=cfg.len&&cfg.len<p.length?cfg.len:p.length;
  return shuffle(p.slice(0,n)).map(q=>q.i);
}
function isRight(q,ans){if(!ans||!ans.length)return null;return ans.length===q.a.length&&q.a.every(x=>ans.includes(x))}

/* ---------- render ---------- */
const app=document.getElementById("app");

  clearInterval(tick);tick=null;
  if(S.screen==="exam"&&S.paper)renderExam();
  else if(S.screen==="results"&&S.lastId)renderResults(PAPERS.find(p=>p.id===S.lastId),false);

  else{S.screen="start";renderStart()}
}

  <header class="top">

  </header>
  ${resume?`<section class="panel" style="border-color:var(--accent)"><div class="row" style="justify-content:space-between"><div><h2>Test in progress</h2><p class="muted small">${S.paper.ids.length} questions · ${Object.keys(S.paper.ans).length} answered · ${S.paper.mode==="exam"?"exam mode":"practice mode"}</p></div><div class="row"><button class="btn primary" id="resume">Resume</button><button class="btn" id="discard">Discard</button></div></div></section>`:""}
  <section class="panel">
    <div class="field"><span class="lbl">Subject</span>
      <div class="cats">${CATS.map(x=>{const cnt=BANK.filter(q=>x.subs.includes(q.b)).length;return`<button class="cat" data-cat="${x.k}" aria-pressed="${x.k===c.cat}"><b>${x.name}</b><span class="km">${x.km}</span><span class="n">${fmt(cnt)} questions</span></button>`}).join("")}</div>
    </div>
    ${subsHTML}
    <div class="field"><span class="lbl">Questions</span>
      <div class="chips">${LENS.map(l=>`<button class="chip" data-len="${l}" aria-pressed="${c.len===l}">${l?l:"All"}</button>`).join("")}</div>
    </div>
    <div class="field"><span class="lbl">Which questions</span>
      <div class="chips">
        <button class="chip" data-src="unseen" aria-pressed="${c.src==="unseen"}">New ones first</button>
        <button class="chip" data-src="any" aria-pressed="${c.src==="any"}">Any</button>
        <button class="chip" data-src="wrong" aria-pressed="${c.src==="wrong"}" ${wrongN?"":"disabled"}>My wrong answers (${wrongN})</button>
      </div>
    </div>
    <div class="field"><span class="lbl">Mode</span>
      <div class="chips">
        <button class="chip" data-mode="practice" aria-pressed="${c.mode==="practice"}">Practice · see the answer straight away</button>
        <button class="chip" data-mode="exam" aria-pressed="${c.mode==="exam"}">Exam · timed, marked at the end</button>
      </div>
    </div>
    <div class="summary">
      <p class="small"><b class="num">${n}</b> questions from ${c.subs.map(s=>SUB[s]).join(", ")||"nothing selected"}${c.mode==="exam"?` · <span class="num">${n}</span> minutes`:""}</p>
      <button class="btn primary" id="start" ${n?"":"disabled"}>${resume?"Start a new test":"Start test"}</button>
    </div>
  </section>
  ${progressHTML()}
  ${historyHTML()}
  <p class="note">Your progress and past tests are saved in this browser on this device only.</p>`;
  app.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{const x=CATS.find(k=>k.k===b.dataset.cat);c.cat=x.k;c.subs=x.subs.slice();if(c.src==="wrong")c.src="unseen";save();renderStart()});
  app.querySelectorAll("[data-sub]").forEach(i=>i.onchange=()=>{const s=i.dataset.sub;c.subs=i.checked?[...new Set([...c.subs,s])]:c.subs.filter(x=>x!==s);save();renderStart()});
  app.querySelectorAll("[data-len]").forEach(b=>b.onclick=()=>{c.len=+b.dataset.len;save();renderStart()});
  app.querySelectorAll("[data-src]").forEach(b=>b.onclick=()=>{c.src=b.dataset.src;save();renderStart()});
  app.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{c.mode=b.dataset.mode;save();renderStart()});
  const st=document.getElementById("start");if(st)st.onclick=startTest;
  const r=document.getElementById("resume");if(r)r.onclick=()=>{S.screen="exam";save();render();scrollTo(0,0)};
  const d=document.getElementById("discard");if(d)d.onclick=()=>{S.paper=null;save();renderStart()};
  app.querySelectorAll(".hrow").forEach(b=>b.onclick=()=>{S.reviewId=b.dataset.id;S.filter="all";S.screen="review";save();render();scrollTo(0,0)});
  const cl=document.getElementById("clearhist");if(cl)cl.onclick=()=>{if(!confirmClear){confirmClear=true;cl.textContent="Tap again to delete all saved tests";return}confirmClear=false;PAPERS=[];store(PKEY,PAPERS);renderStart()};
  const cs=document.getElementById("clearstats");if(cs)cs.onclick=()=>{if(!confirmClear){confirmClear=true;cs.textContent="Tap again to reset all progress";return}confirmClear=false;STATS={};store(SKEY,STATS);renderStart()};
}
function progressHTML(){
  const rows=["BS","MED","PED","OBG","SUR"].map(b=>{
    const qs=BANK.filter(q=>q.b===b);let seen=0,ok=0,bad=0;
    qs.forEach(q=>{const s=STATS[q.i];if(s&&s.s){seen++;if(s.w)bad++;else ok++}});
    const t=qs.length;
    return`<div class="prow"><span>${SUB[b]}</span><div class="bar" role="img" aria-label="${ok} right, ${bad} wrong, ${t-seen} not tried"><i class="c" style="width:${ok/t*100}%"></i><i class="w" style="width:${bad/t*100}%"></i></div><span class="num small muted">${seen}/${t}</span></div>`}).join("");
  const any=Object.keys(STATS).length;
  return`<section class="panel"><div class="row" style="justify-content:space-between"><h2>Your progress</h2><div class="legend"><span class="lc">Right last time</span><span class="lw">Wrong last time</span><span class="lu">Not tried</span></div></div><div class="prog">${rows}</div>${any?`<button class="linkbtn" id="clearstats">Reset progress</button>`:""}</section>`;
}
function historyHTML(){
  if(!PAPERS.length)return`<section class="panel"><h2>Past tests</h2><p class="empty">Finished tests appear here. Open one to see every question with your answer and the correct answer.</p></section>`;
  return`<section class="panel"><h2>Past tests</h2><div class="hist">${PAPERS.slice().reverse().map(p=>`<button class="hrow" data-id="${esc(p.id)}"><span class="l"><b>${esc(p.label)}</b><span>${esc(p.date)} · ${p.mode==="exam"?"exam":"practice"} · ${p.items.length} questions</span></span><span class="score">${p.score}/${p.items.length} <span class="muted">${Math.round(p.score/p.items.length*100)}%</span></span></button>`).join("")}</div><button class="linkbtn" id="clearhist">Delete saved tests</button></section>`;
}

function startTest(){
  const c=S.cfg,ids=deal(c);if(!ids.length)return;
  const cat=CATS.find(x=>x.k===c.cat);
  let label=cat.name;
  if(cat.subs.length>1&&c.subs.length<cat.subs.length)label+=" ("+c.subs.map(s=>SUB[s]).join(", ")+")";
  if(c.src==="wrong")label+=" · wrong answers";
  S.paper={ids,ans:{},flag:{},lock:{},cur:0,mode:c.mode,label,start:Date.now(),deadline:c.mode==="exam"?Date.now()+ids.length*60000:null,done:false};
  S.screen="exam";confirmFinish=false;save();render();scrollTo(0,0);
}

function renderExam(){
  const P=S.paper,k=P.cur,q=BYID[P.ids[k]];
  if(!q){P.ids.splice(k,1);if(!P.ids.length){S.paper=null;S.screen="start"}else P.cur=Math.min(k,P.ids.length-1);save();return render()}
  const ans=P.ans[k]||[],need=q.a.length,locked=P.mode==="practice"&&P.lock[k];
  const answered=Object.keys(P.ans).filter(x=>P.ans[x]&&P.ans[x].length).length;
  const opts=q.o.map((o,j)=>{
    let cls="opt",mk="";
    if(locked){if(q.a.includes(j)){cls+=" right";mk=ans.includes(j)?"Your answer · correct":"Correct answer"}else if(ans.includes(j)){cls+=" wrong";mk="Your answer"}}
    else if(ans.includes(j))cls+=" sel";
    return`<button class="${cls}" data-o="${j}" ${locked?"disabled":""} aria-pressed="${ans.includes(j)}"><span class="bub">${LET[j]}</span><span>${esc(o)}</span><span class="mk">${mk}</span></button>`}).join("");
  const right=locked?isRight(q,ans):null;
  app.innerHTML=`
  <div class="bar-top"><div class="in">
    <div><span class="eyebrow">${esc(P.label)}</span><div class="small muted num">${answered}/${P.ids.length} answered</div></div>
    <div class="row">${P.deadline?`<span class="timer" id="timer" aria-live="off"></span>`:""}<button class="btn ${confirmFinish?"warn":""}" id="finish">${confirmFinish?finishText():"Finish"}</button></div>
  </div></div>
  <article class="qcard">
    <div class="qhead"><span class="qno">Question <span class="num">${k+1}</span><span class="muted" style="font-weight:500"> / ${P.ids.length}</span></span><span class="tag">${catOf(q.b)}${q.b!=="BS"&&q.b!=="SUR"?" · "+SUB[q.b]:""}${q.p?" · Part "+q.p:""}</span></div>
    <p class="qtext">${esc(q.q)}</p>
    ${need>1?`<span class="multi">Choose ${need} answers</span>`:""}
    <div class="opts">${opts}</div>
    ${locked?`<div class="feedback ${right?"ok":"bad"}">${right?"Correct":"Not quite. The correct answer is "+q.a.map(x=>LET[x]).join(" and ")+"."}</div>`:""}
    <div class="qnav">
      <button class="btn" id="prev" ${k?"":"disabled"}>← Previous</button>
      <button class="btn flagbtn" id="flag" aria-pressed="${!!P.flag[k]}">${P.flag[k]?"Flagged":"Flag for review"}</button>
      <button class="btn ${k===P.ids.length-1?"":"primary"}" id="next">${k===P.ids.length-1?"Last question":"Next →"}</button>
    </div>
  </article>
  <section class="panel">
    <div class="row" style="justify-content:space-between"><h3>Answer sheet</h3><span class="keys"><kbd>A</kbd>–<kbd>E</kbd> answer · <kbd>←</kbd><kbd>→</kbd> move · <kbd>F</kbd> flag</span></div>
    <div class="sheet">${P.ids.map((id,j)=>{const a=P.ans[j];let c="";if(a&&a.length){if(P.mode==="practice"&&P.lock[j])c=isRight(BYID[id],a)?"r":"x";else c="done"}if(j===k)c+=" cur";if(P.flag[j])c+=" fl";return`<button class="${c}" data-go="${j}" aria-label="Question ${j+1}">${j+1}</button>`}).join("")}</div>
  </section>`;
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>choose(+b.dataset.o));
  document.getElementById("prev").onclick=()=>go(k-1);
  document.getElementById("next").onclick=()=>{if(k<P.ids.length-1)go(k+1)};
  document.getElementById("flag").onclick=()=>{P.flag[k]=!P.flag[k];if(!P.flag[k])delete P.flag[k];save();renderExam()};
  document.getElementById("finish").onclick=()=>{if(!confirmFinish){confirmFinish=true;renderExam();return}finish()};
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
  if(P.deadline){updTimer();tick=setInterval(updTimer,1000)}
}
function finishText(){const P=S.paper,left=P.ids.length-Object.keys(P.ans).filter(x=>P.ans[x]&&P.ans[x].length).length;return left?`Tap again to finish · ${left} unanswered`:"Tap again to finish"}
function updTimer(){
  const P=S.paper,el=document.getElementById("timer");if(!P||!el)return;
  const ms=P.deadline-Date.now();
  if(ms<=0){finish();return}
  const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  el.textContent=(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(ss).padStart(2,"0");
  el.classList.toggle("low",ms<120000);
}
function go(j){const P=S.paper;if(j<0||j>=P.ids.length)return;P.cur=j;confirmFinish=false;save();renderExam();const c=document.querySelector(".qcard");if(c&&c.getBoundingClientRect().top<0)c.scrollIntoView({block:"start"})}
function choose(j){
  const P=S.paper,k=P.cur,q=BYID[P.ids[k]];
  if(P.mode==="practice"&&P.lock[k])return;
  let a=(P.ans[k]||[]).slice();
  if(q.a.length===1)a=[j];
  else{a=a.includes(j)?a.filter(x=>x!==j):[...a,j];if(a.length>q.a.length)a.shift()}
  P.ans[k]=a;
  if(P.mode==="practice"&&a.length===q.a.length){P.lock[k]=1;record(q,a)}
  confirmFinish=false;save();renderExam();
}
function record(q,a){const r=isRight(q,a),s=STATS[q.i]||{s:0,c:0};s.s++;if(r)s.c++;s.w=r?0:1;STATS[q.i]=s;store(SKEY,STATS)}

function finish(){
  const P=S.paper;if(!P)return;
  clearInterval(tick);tick=null;
  let score=0;
  const items=P.ids.map((id,k)=>{const q=BYID[id],a=P.ans[k]||[];const r=isRight(q,a);if(r)score++;
    if(a.length&&!(P.mode==="practice"&&P.lock[k]))record(q,a);
    return{i:id,a,f:P.flag[k]?1:0}});
  const d=new Date();
  const rec={id:String(Date.now()),label:P.label,mode:P.mode,date:d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}),secs:Math.round((Date.now()-P.start)/1000),score,items};
  PAPERS.push(rec);
  while(PAPERS.length>PMAX)PAPERS.shift();
  while(!store(PKEY,PAPERS)&&PAPERS.length>1)PAPERS.shift();
  S.paper=null;S.lastId=rec.id;S.screen="results";S.filter="all";confirmFinish=false;save();render();scrollTo(0,0);
}

function renderResults(R,saved){
  if(!R){S.screen="start";save();return renderStart()}
  const rows=R.items.map((it,k)=>({...it,k,q:BYID[it.i]})).filter(x=>x.q);
  const missing=R.items.length-rows.length;
  rows.forEach(x=>x.r=isRight(x.q,x.a));
  const pct=Math.round(R.score/R.items.length*100);
  const by={};rows.forEach(x=>{const b=x.q.b;by[b]=by[b]||{n:0,c:0};by[b].n++;if(x.r)by[b].c++});
  const wrong=rows.filter(x=>x.r===false).length,skip=rows.filter(x=>x.r===null).length,fl=rows.filter(x=>x.f).length;
  const f=S.filter||"all";
  const shown=rows.filter(x=>f==="all"||(f==="wrong"&&x.r===false)||(f==="skip"&&x.r===null)||(f==="flag"&&x.f));
  const mins=Math.floor(R.secs/60),secs=R.secs%60;
  app.innerHTML=`
  ${saved?`<div class="savedbar"><button class="btn" id="back">← Back</button><span class="muted small">Saved test · ${esc(R.date)}</span></div>`:""}
  <header class="top"><span class="eyebrow">${esc(R.label)} · ${R.mode==="exam"?"exam":"practice"}</span><h1>Results</h1></header>
  <section class="panel">
    <div class="hero"><div class="big num">${R.score}<small>/${R.items.length}</small></div>
      <div><p style="font-size:20px;font-family:var(--display);font-weight:600">${pct}% correct</p><p class="muted small">${wrong} wrong · ${skip} not answered · ${fl} flagged · time ${mins}m ${String(secs).padStart(2,"0")}s</p></div></div>
    <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Subject</th><th class="num">Right</th><th class="num">Score</th></tr></thead><tbody>
      ${Object.keys(by).sort().map(b=>`<tr><td>${catOf(b)}${b!=="BS"&&b!=="SUR"?" · "+SUB[b]:""}</td><td class="num">${by[b].c}/${by[b].n}</td><td class="num">${Math.round(by[b].c/by[b].n*100)}%</td></tr>`).join("")}
    </tbody></table></div>
    <div class="row">
      ${wrong+skip?`<button class="btn primary" id="retry">Retry the ${wrong+skip} I missed</button>`:""}
      ${saved?"":`<button class="btn" id="new">New test</button><button class="btn" id="home">Back to start</button>`}
    </div>
    ${missing?`<p class="note">${missing} question${missing>1?"s are":" is"} no longer in the question bank and can't be shown.</p>`:""}
  </section>
  <section class="panel">
    <div class="row" style="justify-content:space-between"><h2>Answers</h2>
      <div class="filters">${[["all","All",rows.length],["wrong","Wrong",wrong],["skip","Not answered",skip],["flag","Flagged",fl]].map(([v,l,n])=>`<button class="chip" data-f="${v}" aria-pressed="${f===v}">${l} ${n}</button>`).join("")}</div></div>
    <div class="rev">${shown.length?shown.map(x=>reviewItem(x)).join(""):`<p class="empty">No questions in this group.</p>`}</div>
  </section>`;
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;save();renderResults(R,saved)});
  const bk=document.getElementById("back");if(bk)bk.onclick=()=>{S.screen="start";save();render();scrollTo(0,0)};
  const nw=document.getElementById("new");if(nw)nw.onclick=()=>startTest();
  const hm=document.getElementById("home");if(hm)hm.onclick=()=>{S.screen="start";save();render();scrollTo(0,0)};
  const rt=document.getElementById("retry");if(rt)rt.onclick=()=>{
    const ids=rows.filter(x=>x.r!==true).map(x=>x.i);
    S.paper={ids:shuffle(ids),ans:{},flag:{},lock:{},cur:0,mode:R.mode,label:R.label+" · retry",start:Date.now(),deadline:R.mode==="exam"?Date.now()+ids.length*60000:null,done:false};
    S.screen="exam";confirmFinish=false;save();render();scrollTo(0,0)};
}
function reviewItem(x){
  const q=x.q,a=x.a||[];
  const cls=x.r===true?"ok":x.r===false?"bad":"skip";
  return`<div class="ritem ${cls}">
    <div class="qhead"><span class="tag">Q${x.k+1} · ${catOf(q.b)}${q.b!=="BS"&&q.b!=="SUR"?" · "+SUB[q.b]:""}${q.p?" · Part "+q.p:""}${x.f?" · flagged":""}</span><span class="tag" style="color:var(--${x.r===true?"ok":x.r===false?"bad":"muted"})">${x.r===true?"Correct":x.r===false?"Wrong":"Not answered"}</span></div>
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts">${q.o.map((o,j)=>{let c="opt",mk="";if(q.a.includes(j)){c+=" right";mk=a.includes(j)?"Your answer · correct":"Correct answer"}else if(a.includes(j)){c+=" wrong";mk="Your answer"}return`<div class="${c}"><span class="bub">${LET[j]}</span><span>${esc(o)}</span><span class="mk">${mk}</span></div>`}).join("")}</div>
    ${x.r===null?`<p class="note">You didn't answer this question.</p>`:""}
  </div>`;
}

document.addEventListener("keydown",e=>{
  if(S.screen!=="exam"||!S.paper||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  const key=e.key.toUpperCase();
  const q=BYID[S.paper.ids[S.paper.cur]];
  let j=LET.indexOf(key);if(j<0&&/^[1-5]$/.test(key))j=+key-1;
  if(j>=0&&q&&j<q.o.length){e.preventDefault();choose(j)}
  else if(e.key==="ArrowRight"){e.preventDefault();go(S.paper.cur+1)}
  else if(e.key==="ArrowLeft"){e.preventDefault();go(S.paper.cur-1)}
  else if(key==="F"){e.preventDefault();document.getElementById("flag").click()}
});
render();
</script>
</body>
</html>
