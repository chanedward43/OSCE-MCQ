<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="OSCE MCQ practice: Basic Science, Medicine and Surgery">
<title>OSCE MCQ Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@500;600;700&family=Noto+Sans+Khmer:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a single answer-booklet column; options and the navigator use bubble-sheet circles */
:root{
  --bg:#F4F5F0; --surface:#FFFFFF; --ink:#1C2422; --muted:#5D6965; --line:#D8DCD3;
  --accent:#12635A; --accent-ink:#FFFFFF; --soft:#E1EEEA;
  --flag:#B97C0B; --flag-soft:#F7ECD6;
  --ok:#2C7A4B; --ok-soft:#E1F1E7; --bad:#B2362D; --bad-soft:#F8E3E0;
  --display:"Kantumruy Pro","Noto Sans Khmer",system-ui,sans-serif;
  --body:"Noto Sans Khmer","Kantumruy Pro",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#18201D; --ink:#E5ECE8; --muted:#97A59F; --line:#2B3531;
  --accent:#4DB6A3; --accent-ink:#0E1513; --soft:#1B3330;
  --flag:#E2A73C; --flag-soft:#3A2F17;
  --ok:#5DC08A; --ok-soft:#173226; --bad:#E86F62; --bad-soft:#3A1E1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#18201D; --ink:#E5ECE8; --muted:#97A59F; --line:#2B3531;
  --accent:#4DB6A3; --accent-ink:#0E1513; --soft:#1B3330;
  --flag:#E2A73C; --flag-soft:#3A2F17;
  --ok:#5DC08A; --ok-soft:#173226; --bad:#E86F62; --bad-soft:#3A1E1B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:780px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,5vw,38px);font-weight:700;letter-spacing:-.01em}
h2{font-size:20px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;min-height:44px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:14px;min-width:0}
.field{display:grid;gap:8px}
.field>.lbl{font-family:var(--display);font-weight:600;font-size:15px}

/* header */
.top{display:grid;gap:8px;padding-top:8px}
.top p{max-width:62ch}

/* category cards */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.cat{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;text-align:left;display:grid;gap:2px;min-height:96px}
.cat .km{font-size:13px;color:var(--muted)}
.cat .n{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:auto}
.cat b{font-family:var(--display);font-size:17px;font-weight:600}
.cat[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.cat[aria-pressed="true"]::after{content:"";position:absolute;top:12px;right:12px;width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--surface),0 0 0 4.5px var(--accent)}
.subs{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:40px;background:var(--surface);cursor:pointer;font-size:14.5px}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;min-height:40px;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[disabled]{opacity:.4;cursor:not-allowed}
.summary{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

/* progress table */
.prog{display:grid;gap:10px}
.prow{display:grid;grid-template-columns:minmax(110px,1fr) 2fr auto;gap:12px;align-items:center;font-size:14.5px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .c{background:var(--ok)} .bar .w{background:var(--bad)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}
.legend .lc::before{background:var(--ok)} .legend .lw::before{background:var(--bad)} .legend .lu::before{background:var(--line)}

/* history */
.hist{display:grid;gap:8px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:transparent;border-radius:8px;padding:10px 14px;min-height:52px}
.hrow:hover{border-color:var(--ink)}
.hrow .l{display:grid;gap:0;min-width:0}
.hrow .l span{font-size:13px;color:var(--muted)}
.score{font-family:var(--mono);font-weight:600;white-space:nowrap}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;font-size:13.5px;justify-self:start}

/* exam */
.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-left,0px))}
.bar-top .in{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.timer{font-family:var(--mono);font-size:18px;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:clamp(16px,3vw,26px);display:grid;gap:18px}
.qhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between}
.qno{font-family:var(--display);font-weight:700;font-size:22px}
.tag{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.qtext{white-space:pre-line;font-size:17px;line-height:1.85;overflow-wrap:anywhere}
.multi{font-size:14px;font-weight:600;color:var(--flag);background:var(--flag-soft);border-radius:6px;padding:4px 10px;justify-self:start}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:56px;line-height:1.65;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--ink)}
.bub{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:14px;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt .mk{font-size:12.5px;font-weight:600;white-space:nowrap}
.opt.right .mk{color:var(--ok)} .opt.wrong .mk{color:var(--bad)}
.opt[disabled]{cursor:default}
.feedback{border-radius:8px;padding:10px 14px;font-weight:600}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.qnav{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.qnav .btn:last-child{justify-self:end}
.qnav .btn:first-child{justify-self:start}
.flagbtn[aria-pressed="true"]{border-color:var(--flag);color:var(--flag);background:var(--flag-soft)}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.sheet button{height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:12.5px;position:relative;padding:0}
.sheet .done{background:var(--soft);border-color:var(--accent)}
.sheet .r{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.sheet .x{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.sheet .cur{outline:2px solid var(--ink);outline-offset:1px}
.sheet .fl::after{content:"";position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--flag);border:2px solid var(--surface)}
.keys{font-size:12.5px;color:var(--muted)}
kbd{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}

/* results */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.big{font-family:var(--display);font-size:clamp(44px,9vw,64px);font-weight:700;line-height:1}
.big small{font-size:.4em;color:var(--muted);font-weight:500}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl th{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tbl td.num,.tbl th.num{text-align:right}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.rev{display:grid;gap:14px}
.ritem{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px;background:var(--surface)}
.ritem.ok{border-left-color:var(--ok)} .ritem.bad{border-left-color:var(--bad)} .ritem.skip{border-left-color:var(--muted)}
.ritem .qtext{font-size:15.5px}
.ritem .opt{min-height:44px;padding:8px 12px;font-size:15px}
.ritem .bub{width:28px;height:28px;font-size:13px}
.ritem .opt{grid-template-columns:30px 1fr auto}
.note{font-size:14px;color:var(--muted)}
.savedbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.empty{color:var(--muted);font-size:14.5px}
@media (max-width:560px){
  .hero{grid-template-columns:1fr}
  .qnav{grid-template-columns:1fr 1fr}
  .qnav .flagbtn{grid-column:1/-1;grid-row:2;justify-self:stretch}
  .qnav .btn:last-child{justify-self:stretch}.qnav .btn:first-child{justify-self:stretch}
  .prow{grid-template-columns:1fr auto}.prow .bar{grid-column:1/-1;grid-row:2}
}
@media (pointer:coarse){.opt{min-height:60px}.chip,.chk{min-height:44px}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.chip,.cat{transition:border-color .12s,background-color .12s}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>

,"b":"BS","p":"","q":"ជម្ងឺមួយប្រភេទនៃប្រភេទជម្ងឺឆ្លងតាមការរូមភេទដែលជួបប្រទះជាញឹកញាប់ ហើយអាចនឹងបង្កអោយទៅជាមហារីកមាត់ស្បូន (cervical carcinoma / carcinome du col utérin) បណ្តាលដោយវីរុសមួយណាខាងក្រោមនេះ ៖","o":["Cytomégalovirus","Papillomavirus","Epstein-Barr virus","Virus herpès simplex","Adénovirus"],"a":[1]},{"i":"52fff336","b":"BS","p":"","q":"វីរុសនៃជម្ងឺរលាកថ្លើម ប្រភេទ E (Hepatitis E / hépatite E) ជា វីរុសថ្លើម (viral hepatitis/hépatite virale) ដែលថ្មីៗនេះទើបនឹងបានកំណត់លក្ខណៈ របស់វា ។តើប្រយោគណាមួយខាងក្រោមនេះ ដែលបានអត្ថាធិប្បាយយ៉ាងត្រឹមត្រូវបំផុតដែលទាក់ទងនឹងវីរុសនេះ ៖","o":["វាមិនមានការគំរាមកំហែងដល់ការផ្តល់និងការចាក់បញ្ចូលឈាម","វាជាមួលហេតុចំបងនៃជំងឺរលាកថ្លើមតាមការចាក់បញ្ចូលឈាម","វាកើតមានជាញឹកញាប់នៅអាមេរិកខាងជើង","វាជាវីរុសដែលមាន AND តែមួយខ្សែ (ADN à simple brin / single-stranded DNA)","វាអាចបណ្តាលឲ្យកើតជម្ងឺប្រហាក់ប្រហែលនឹងការរលាកថ្លើមប្រភេទC"],"a":[0]},{"i":"531be179","b":"BS","p":"","q":"ការបង្ករោគដោយវីរុសរលាកថ្លើមប្រភេទD (HDV, virus delta) អាចកើតមានរួមគ្នាជាមួយការបង្ករោគដោយវីរុសរលាកថ្លើមប្រភេទ B (HBV) ឬក៏មាននៅក្នុងបុគ្គលដែលមានផ្ទុកវីរុសរលាកថ្លើមប្រភេទBពីព្រោះ HDV ជា វីរុសមាន លក្ខណៈមិនពេញលេញ (defective virus/virus défectif) ដែលចាំបាច់វាត្រូវការវីរុស HBV សំរាប់បំពេញមុខងារក្នុងការបង្កើតកូនវីរុសថ្មី(replication/réplication)។តើ serological test / test sérologique ណាមួយដែលអាចយកមកប្រើប្រាស់សំរាប់កំណត់ថាអ្នកជម្ងឺម្នាក់មានវីរុស HDV ជាអ្នកផ្ទុកវីរុសHBV","o":["តេស្តរកអង់ទីហែ្សន HBs (Ag HBs/HBsAg)","តេស្តរកអង្គបដិបក្ខ IgM anti-HBc/HBc IgM","តេស្តរកអង់ទីហែ្សន HBe (Ag HBe/HBeAg)","តេស្តរកអង្គបដិបក្ខ IgM anti-HBs/HBs IgM","តេស្តរកអង្គបដិបក្ខ IgG anti-HBs/HBs IgG"],"a":[0]},{"i":"940209bd","b":"BS","p":"","q":"គិលានុបដ្ឋាកយិកាម្នាក់ លេចចេញរោគសញ្ញាគ្លីនីកដូចគ្នានឹងការរលាកថ្លើម(hepatitis/hépatite)។ នាងបានរៀបរាប់ឡើងវិញថា នាងបានមុតម្ជុលចាក់ថ្នាំ ប្រហែលជា 4 ខែមកហើយ បន្ទាប់ពីបានចាក់បូមឈាមពីអ្នកជម្ងឺម្នាក់ ។លទ្ធផលនៃ serological test / test sérologique របស់នាងបានបង្ហាញថាអវិជ្ជមាននៃអង់ទីហែ្សនHBs (HBsAg/Ag HBs) , អង្គបដិបក្ខanti-HBs និងអវិជ្ជមានផងដែរនៃវីរុសរលាកថ្លើមប្រភេទ A (HAV) ប៉ុនែ ង វីរុស ប្រភេទBនិងC"],"a":[0]},{"i":"8aff33f8","b":"BS","p":"","q":"វីរុសalpha (Alphavirus)​ បណ្តាលឲ្យកើតមានជម្ងឺមួយណាខាងក្រោមនេះ ៖","o":["ជម្ងឺវីរុស Marburg","ជម្ងឺ encéphalite de Saint Louis / St.Louis encephalitis","ជម្ងឺ encéphalite équine de l’Ouest / Western equine encephalitis","ជម្ងឺ Dengue","ជម្ងឺគ្រុនលឿង (maladie de la fièvre jaune/yellow fever)"],"a":[2]},{"i":"21942583","b":"BS","p":"","q":"សមាសធាតុប្រឆាំងវីរុស (Antiviral compounds/composants anti-viraux)មួយចំនួនត្រូវបានអភិវឌ្ឍក្នុងប៉ុន្មានទសវត្សរ៍ចុងក្រោយនេះ។ សារធាតុមួយក្នុងចំណោមសារធាតុទាំងនោះ គឺ Ribavirin/Ribavirine។Ribavirin/Ribavirineជាnucleoside / nucléoside សំយោគមានរចនាសម្ព័ន្ធទាក់ទងនឹង guanosine។ ការព្យាបាលដោយ Ribavirin / Ribavirineត្រូវបានប្រើប្រាស់ដោយជោគជ័យដើម្បីប្រឆាំងនឹង៖","o":["វីរុស syncytium respiratoire (RSV)","វីរុស Herpès simplex (HSV)","វីរុសរលាកថ្លើមប្រភេទ B","វីរុស Coxsackieក្រុមA (Group A coxsackievirus /Coxsackievirus groupe A)","វីរុស Parvovirus"],"a":[0]},{"i":"23eeeffe","b":"BS","p":"","q":"តើនីតិវិធី ឬ រោគសញ្ញាគ្លីនីកមួយណាដូចតទៅនេះដែលបញ្ជាក់យ៉ាងច្បាស់លាស់ក្នុងការធ្វើរោគវិនិច្ឆ័យជំងឺ infectiousmononucleosis / mononucléose infectieuse ដែលបណ្តាលមកពីវីរុស Epstein-Barr ៖","o":["ការធ្វើរោគវិនិច្ឆ័យដោយមន្ទីរពិសោធន៍ផ្អែកសំខាន់លើការរកឃើញវត្តមានកោសិកា lymphocyte atypique / atypical lymphocytes និងអង្គបដិបក្ខ EBV-specific antibody / spécifiqueanti-EBV","ការដុះលូតលាស់របស់វីរុសក្នុងកោសិកានៃថ្នាលបណ្តុះជាលិកា(tisssue culture cells / cellules de culturetissulaire)","មានវត្តមានអង្គបដិបក្ខhétérophile ក្នុងសេរ៉ូមអ្នកជំងឺ","រកឃើញការរីករាលដាលនៃកូនកណ្តុរ(lymphadenopathie/lymphadenopathy) និងការធ្លាក់អណ្តើក(splenomegaly/splénomégalie) នៅពេលពិនិត្យគ្លីនីក","មានការរីកសាយ (prolifération) នៃកោសិកា lymphocyte B"],"a":[0]},{"i":"8817b314","b":"BS","p":"","q":"តើក្រុមមនុស្សប្រភេទណាមួយខាងក្រោមនេះ អាចជាក្រុមដែលប្រឈមមុខខ្ពស់នឹងគ្រោះថ្នាក់ឆ្លងជំងឺ ហ៊ីវ(VIH)៖","o":["សមាជិកគ្រួសារទាំងឡាយដែលក្នុងនោះមានបុគ្គលផ្ទុកវីរុសហ៊ីវ ស្នាក់នៅជាមួយ","បុគ្គលិកបដិសណ្ឋារកិច្ចនៅក្នុងមន្ទីរពេទ្យ","កម្មកររោងចក្រដែលសហការីរបស់គាត់មានផ្ទុកវីរុសហ៊ីវ","និយោជិកសេវាកម្មបរទេស ដែលសំរាកពេទ្យក្នុងប្រទេសហ្សាអ៊ា(Zaire)ដោយមូលហេតុហូរឈាមដំបៅ(hémorragie ulcéreuse/bleeding ulcers)","ក្រុមដៃគូរួមភេទ នារី និងនារី(homosexuel femelle/homosexual female)"],"a":[4]},{"i":"65d38a97","b":"BS","p":"","q":"អ្នកជំងឺម្នាក់ មានគ្រប់រោគសញ្ញាក្រពះ-ពោះវៀន (Gastrointestinal symptoms / Isymptômes gastro-intestinaux) ។ លទ្ធផលវិភាគនៃតេស្ត IgG anti-HAV និង IgM anti-HAV របស់គាត់ គឺអវិជ្ជមាន។ មូលហេតុមូយ នៃការបង្ករោគនេះគឺ៖","o":["អង់ទីហ្សែនផ្ទៃខាងក្រៅ(HBsAg/AgHBs)របស់វីរុសរលាកថ្លើមប្រភេទB","វីរុស រលាកថ្លើមប្រភេទC","វីរុស រលាកថ្លើមប្រភេទD","វីរុស រលាកថ្លើមប្រភេទE","វីរុសRotavirus"],"a":[4]},{"i":"b92a9d01","b":"BS","p":"","q":"ស្រ្តីអ្នកជំងឺនៅផ្ទះម្នាក់អាយុ 70ឆ្នាំ បានបដិសេធការចាក់វ៉ាក់សាំងការពារជំងឺផ្ដាសាយ ហើយបន្ទាប់មកគាត់បានកើតជំងឺផ្ដាសាយ។ គាត់បានស្លាប់ដោយការហើមសួតស្រួចស្រាវ (pneumonie aiguë/acute pneumonia)បន្ទាប់ពីកើតផ្ដាសាយបានមួយសប្តាហ៍។ មូលហេតុចំបងបំផុតនៃការហើមសួតស្រួចស្រាវក្រោយពីផ្ដាសាយ(pneumonie aigue post-influenza / post influenzal \npneumonia) គឺ៖","o":["Legionnella","Listeria","Staphylococcus aureus","Klebsiella","Escherichia coli"],"a":[0,2]},{"i":"124740b0","b":"BS","p":"","q":"តើវីរុសណាមួយខាងក្រោម ធ្វើការចំលងជាបឋមតាម ផ្លួវមាត់-លាមក (voie oro-fécale / fecal-oral route)","o":["វីរុស encéphalite de Saint Louis / St.Louis encephalitis virus","Virus de la fièvre à tique de Colorado / Colorado tick fever virus","Coxsackievirus","វីរុសគ្រុនលឿង (virus de la fièvre jaune/Yellow fever virus)","វីរុសគ្រុនឈាម (virus de fièvre de la dengue/Dengue fever virus)"],"a":[2]},{"i":"d6879657","b":"BS","p":"","q":"ការបង្ករោគដោយ cytomégalovirus (CMV) កើតមានជាទូទៅ ។ តើឃ្លាមួយណា ខាងក្រោមនេះដែលអត្ថាធិប្បាយយ៉ាងត្រឹមត្រូវពីលក្ខណៈរបស់CMV","o":["វាអាចចំលងដោយឆ្លងកាត់របាំងសុក (barrière placentaire/placental barrier)","ជាទូទៅ CMV ស្ទើរតែស្តែងចេញជារោគសញ្ញាគ្រប់ពេល ក្នុងខណៈនៃការបង្ករោគ","CMV អាចបណ្តុះបានចេញអំពីគោលិកាក្រហមរបស់អ្នកជម្ងឺ","មិនដូចជាវីរុសដ៏ទៃទៀត CMV មិនបានបាត់សកម្មភាពដោយសារការ ព្យាបាល immunosuppressif / immunosuppressive","គ្មានការព្យាបាលណាមួយដ ំ នោមច្រើន (polyuria)។ ការធ្វើរោគវិនិច្ឆ័យ គាត់មានជំងឺទឹកនោមផ្អែមជា Diabetes mellitus ។ កំរិតជាតិស្ករ 24 mm​ol/L។តើចំណុចណាមួយខាងក្រោម ដែលចំបងជាងគេ (strongest) ដែលទាមទារអោយធ្វើការព្យាបាល Insulin ជាបន្ទាន់ (Treatment immediately)?","o":["កំរិតជាតិស្កររបស់គាត់ឡើងខ្ពស់","អាយុរបស់គាត់","រោគសញ្ញារបស់គាត់ជាមួយកំរិតជាតិស្ករខ្ពស់ (symptomatic hyperglycaemia)","មាន ketones នៅក្នុងឈាម (Moderate blood ketones)","មានផ្សិតនៅទ្វារមាស (Vaginal candidiasis)"],"a":[3]},{"i":"9262af50","b":"MED","p":"C","q":"តើចំណុចណាមួយដែលត្រឹមត្រូវដើម្បីធ្វើការវះកាត់ព្យាបាលចំពោះមហារីកពោះវៀនធំ (colorectal cancer)?","o":["Adjuvant therapy ត្រូវបានអនុវត្តន៏លើអ្នកជំងឺទាំងអស់ដែលមានជំងឺមហារីកពោះវៀនធំ (colorectal cancer)","គោលបំណងនៃ Adjuvant therapy ដើម្បីបង្កើតឳកាសនៃការជាសះស្បើយ (improve the chances of cure)","Adjuvant radiotherapy គឺត្រូវបានអនុវត្តន៏សំរាប់អ្នកជំងឺមហារីកពោះវៀន","Adjuvant chemotherapy សំរាប់ជំងឺមហារីកពោះវៀនគួរតែបន្តយ៉ាងហោចណាស់ 12ខែ","Adjuvant chemotherapy គឺមិនសមស្របសំរាប់ព្យាបាលអ្នកជំងឺដែលមានអាយុលើសពី 65ឆ្នាំទេ"],"a":[1]},{"i":"ce7cef14","b":"MED","p":"C","q":"តើចំណុចខាងក្រោមណាមួយ ជាផ្នែកសរីរាង្គរបស់បំពង់ខ្យល់ (Laryngeal prominence (Adam’s apple) នៅផ្នែកនៃក(neck)?","o":["Epiglottis","Hyoid bone","Thyroid cartilage","Cricoid cartilage","Thyroid gland"],"a":[2]},{"i":"14decd83","b":"MED","p":"C","q":"តើចំណុចណាមួយខាងក្រោម ដែលសំខាន់ជាងគេក្នុងការប្រើថ្នាំបំបាត់ការឈឺចាប់ (Opium) ក្រោយពីការវះកាត់បើកពោះដល់អ្នកជំងឺ (Post-operative opioid requirements of a patient undergoing a laparotomy)?","o":["ទំងន់របស់អ្នកជំងឺ","ការសន្និដ្ឋានដុំសាច់របស់អ្នកជំងឺ(estimated lean body mass of patient)","ភេទរបស់អ្នកជំងឺ","អាយុរបស់អ្នកជំងឺ","ទំហំនៃការវះកាត់(Magnitude of the surgery)"],"a":[3]},{"i":"69f2f497","b":"MED","p":"C","q":"ស្ត្រីម្នាក់អាយុ 55ឆ្នាំ។ គាត់សំរាកនៅអាគារសង្គ្រោះបន្ទាន់រយៈពេល 24ម៉ោង ដោយគាត់ឈឺចុកនៅពោះផ្នែកខាងស្តាំខាងលើ (Right upper quadrant pain) ទឹកនោមលឿងចាស់ (passing dark coloured urine) ហើយថង់ទឹកប្រម៉ាត់ (bile duct) រីកធំប្រវែង 1.5 សង់ទីម៉ែត្រ។តើចំណុចខាងក្រោមណាមួយជាការធ្វើរោគវិនិច្ឆ័យចំពោះករណីខាងលើ?","o":["Acute appendicitis","Acute pancreatitis","Acute cholecystitis","Acute cholangitis","Acute hepatitis"],"a":[3]},{"i":"674f4664","b":"MED","p":"C","q":"តើចំណុចខាងក្រោមណាមួយដែលត្រឹមត្រូវក្នុងការព្យាបាលការរលាក? (Management of burn)","o":["គ្រប់អ្នកជំងឺទាំងអស់ត្រូវបានការពារដោយការប្រើប្រាស់ Antibiotics","ការរលាកសើរស្បែក (Superficial or first degree) គឺឈឺខ្លាំង ហើយតំរូវអោយប្រើថ្នាំបំបាត់ការឈឺចាប់ (pain relief)","ការរលាកពេញខ្លួន ជ្រៅ (Full thickness or third degree) គឺឈឺចាប់ខ្លាំង ហើយតំរូវអោយប្រើថ្នាំបំបាត់ការឈឺចាប់ (pain relief)","យុវវ័យគួរតែទទួល Serum normal saline 3 litres កំឡុងពេល 12 ម៉ោង ដើម្បីបង្គ្រប់ជាតិទឹកដែលបាត់បង់ពេលរលាកស្បែក","ការសង្គ្រោះបឋមត្រូវបានចូលរូមនៅហ្នឹងកន្លែងដែលបណ្តាលអោយរលាក ក្រោមទិដ្ឋភាព cold running tap water for 20 minutes"],"a":[4]},{"i":"0256dd0a","b":"MED","p":"C","q":"នារីម្នាក់អាយុ 19ឆ្នាំ សំរាកព្យាបាលនៅអាគារសង្គ្រោះបន្ទាន់ (Emergency department) រយៈពេល 1ថ្ងៃ ដោយនាង Drowsiness ឈឺក្បាល ខ្លាចពន្លឺ (Photophobia)។ ពីមុនមកនាងមិនធ្លាប់មានការប៉ះទង្គិចទេ (Trauma) ហើយនាងក៏អត់មានរមាស់ដែរ (Rash)។តើចំណុចណាមួយខាងក្រោមជាជំហានបន្ទាប់ (next step) ក្នុងការព្យាបាលអ្នកជំងឺម្នាក់នេះ?","o":["ការអោយ opioid ដើម្បីព្យាបាលការឈឺក្បាលរបស់នាង","Administer intravenous antibiotics បន្ទាន់ក្រោយពីបណ្តុះមេរោគរួច (after blood cultures)","CT Scan of the brain (ខួរក្បាល)","Lumbar puncture with CSF sampling.","រង់ចាំលទ្ធនៃការរាប់គ្រាប់ឈាម (Full blood count) ហើយ other inflammatory markets"],"a":[1]},{"i":"a51e2511","b":"MED","p":"C","q":"តើពពួកអតិសុខុមប្រាណ (organism) ណាមួយដែលតែងជាមូលហេតុនៃការរលាកសាច់ដុំបេះដូងខាងក្នុង(endocarditis) ក្រោយពីធ្វើការវះកាត់ដាក់ Valve សប្បនិមិត្ត (Prosthetic valve surgery)?","o":["Fungus","Streptococcus","Enterococcus","Staphylococcus","Haemophilus"],"a":[3]},{"i":"804cf913","b":"MED","p":"C","q":"តាមការសិក្សាលើក្រុមថ្នាំ (pharmacological agents) ដែលប្រើចំពោះអ្នកជំងឺទឹកនោមផ្អែមប្រភេទទី២ (Type 2 diabetes) ដែលមិនទាក់ទងនឹងការឡើងគីឡូ (weight gain)?","o":["Metformin","Sulphonylureas","Short acting insulin","Thiazolidinediones","Biphasic insulin"],"a":[0]},{"i":"0e1297e1","b":"MED","p":"C","q":"តើចំណុចណាមួយខាងក្រោមដែលមិនបានចាត់ចូលជាផលវិបាក (side effect) នៃ NSAIDs (Non Steroidal Anti-inflammory Drugs)?","o":["ដំបៅក្រពះ (peptic ulceration)","ការហូរឈាម (Bleeding)","ប៉ះពាល់ដល់មុខងារតំរង់នោម (Renal Impairment)","ភាពមិនល្អចំពោះអ្នកជំងឺហឺតខ្លះ(Aggravation of asthma in some patients)","មហារីកស្បែក (Squamous cell carcinoma of the skin)"],"a":[4]},{"i":"d1d3aabe","b":"MED","p":"C","q":"អ្នកជំងឺParkinson’s disease ធ្លាប់បានទទួលការព្យាបាលជោគជ័យ ២ ទៅ៣ឆ្នាំ (several years) ជាមួយនឹង Levodopa។ ថ្មីៗនេះគាត់ក៏ស្តែងចេញនូវរោគសញ្ញាដោយមិនបានតាំងចិត្ត (involuntary) ពេលកំពុងសរសេរ (writing movements of the limbs)។តើចំណុចណាមួយខាងក្រោមដែលបរិយាយ (describes) ពីស្ថានភាពខាងលើនេះ?","o":["Hypokinesia","Akinesia","Bradykinesia","Dyskinesia","Hyperkinesia"],"a":[3]},{"i":"9b4f4e00","b":"MED","p":"C","q":"ស្ត្រីម្នាក់អាយុ 65ឆ្នាំ ដោយគាត់រមាស់នៅជុំវិញទ្វារលាមក (perianal itching) រយៈពេល 2ឆ្នាំ ហើយ។ គាត់កាន់តែរមាស់ និងមានដាច់ស្បែក (Irritation) បន្ថែមកាលពីខែមុន (past month)។ តាមរយៈនៃការ Inspection of the perineumបង្ហាញថាមាន Hyper Keratosis, Leukoplakia ហើយការរីកធំនៃដំបៅ (Large irregular ulcer) នៅ anal urge in the mid-line posteriorly។តើចំណុចណាមួយជាជំហានបន្ទាប់ក្នុងការព្យាបាលជំងឺរបស់នាង?","o":["ធ្វើការវះបើកនៅត្រង់កន្លែងឈឺ (Perform a wide local excision)","Prescribe a steroid cream.","គាត់គួរលាប rectogesic ointment 5% (nitroglycerin-base)","ធ្វើការវះ internal and sphincterotomy","ធ្វើការច្រឹបសាច់ដើម្បីយកទៅវិភាគ (incisional biopsy)"],"a":[4]},{"i":"c6a21dd5","b":"MED","p":"C","q":"តើក្នុងចំណោមសន្លាក់ខាងក្រោម សន្លាក់ណាមួយដែលប៉ះពាល់ញឹកញាប់ជាងគេ ដោយសារការរលាកសន្លាក់ឆ្អឹង (Most commonly by osteoarthritis)?","o":["Meta carp phalangeal joint","សន្លាក់កែងជើង (Ankle joint)","សន្លាក់គួយដៃ (Elbow joint)","សន្លាក់កដៃ","សន្លាក់ស្មា (shoulder joint)"],"a":[4]},{"i":"a1845aed","b":"MED","p":"C","q":"តើការរលាកត្រចៀករ៉ាំរ៉ៃ (chronic suppurative otitis media) ស្តែងចេញ រោគសញ្ញាអ្វី?","o":["គ្មានការឈឺចាប់ម្ដងហើយ ម្តងទៀត មានខ្ទុះ (Recurrent painless aural discharge)","មានការហួរខ្ទុះភ្លាមៗ ជាមួយការឈឺចាប់ (Acute aural discharge accompanied by pain)","ការស្តាប់ឮធ្លាក់ចុះ (Hearing-loss)","ធ្លាក់មុខម្ខាង (Facial palsy)","ទាក់ទងការរហែកនៃ Ear drum (An incidental finding of a perforated ear drum)"],"a":[0]},{"i":"ba143a3e","b":"MED","p":"C","q":"សិស្សស្រីម្នាក់មានអាយុ 17ឆ្នាំ។ គេបានត្អួញត្អែរថាច្រមុះរបស់គេជារឿយៗតែងតែមានហៀរសំបោរ រមាស់ និងកណ្តាស់ (Recurrent nasal discharge, irritation and sneezing)។តាមរយៈការត្អួញត្អែររបស់នាង តើចំណុចណាមួយខាងក្រោមដែលជាមូលហេតុចំបង (Most likely cause)?","o":["ភាពមិនប្រក្រតីរបស់ឆ្អឹងចន្លោះរន្អច្រមុះ (Deviated nasal septum)","រលាក Sinus ដោយមេរោគ (Infective sinusitis)","សមាសធាតុខាងក្រៅចូលច្រមុះ(Nasal foreign body)","រលាកច្រមុះដោយប្រតិកម្ម (Allergic Rhinitis)","រលាកច្រមុះដោយសារថ្នាំ (Rhinitis medicamentosa)"],"a":[3]},{"i":"1b9824b5","b":"MED","p":"C","q":"តើចំណុចណាមួយខាងក្រោមដែលមិនតំរូវអោយមានការធ្វើ Tracheotomy?","o":["មានការស្ទះភ្លាមៗនៅផ្លូវដង្ហើម (Acute airway obstruction)","ការដកដង្ហើមវែងៗ (Prolonged ventilation)","ការសំអាតទងសួតជារឿយៗ (Recurrent bronchial toilet)","ដេកស្រម៉ុក (Moderate sleep apnea)","ការវះកាត់មហារីក ក និងក្បាលមានទំហំធំ (Major head and neck cancer resection)"],"a":[3]},{"i":"58ecab41","b":"MED","p":"C","q":"បុរសម្នាក់មានអាយុ 50ឆ្នាំ ។ លេចចេញនូវរោគសញ្ញារយៈពេល 2សប្តាហ៏ដោយ ក្តៅខ្លួនខ្លាំង (High spiking fever) ឈឺពោះខាងស្តាំផ្នែកខាងលើ (Right upper quadrant pain) ។ តាមរយៈការធ្វើ CT scan ពោះ បង្ហាញថា បូសថ្លើម (Liver abscess) ។ ការបូមតាមរយៈការមើលអេកូសាស្ត្រ (Ultrasound) បង្ហាញថាទឹកដែលបូមមកមានពណ៌ដូចទឹកសូកូឡា។តើមេរោគអ្វីដែលភាគច្រើនបង្ករអោយមានបូសថ្លើមនេះ?","o":["បូសថ្លើមបង្កដោយ Staphylococcus","បូសថ្លើមបង្កដោយ អាមីប (Amoebic)","បូសថ្លើមបង្កដោយ ប៉ារ៉ាស៊ីត (Hydatid Liver abscess)","បូសថ្លើមបង្កដោយ មេរោគរបង","បូសថ្លើមបង្កដោយ E.coli"],"a":[1]},{"i":"3b6fbaa9","b":"MED","p":"C","q":"ក្មេងប្រុសម្នាក់អាយុ 12ឆ្នាំ ។ មុតរបួស (penetrating wound) នៅត្រង់ភ្លៅដែលគេជិះនៅលើផ្លូវលំ។ ក្មេងប្រុសត្រូវបានដឹកបញ្ជូនមកអាគារសង្រោះ បន្ទាន់ជាមួយការ លាងសំអាតកំទេចកំទីចេញ (debrided) នៅទីនោះ។ ពេលសួរម្តាយក្មេងប្រុសម្នាក់នោះ គាត់មានប្រសាសន៏ថា កូនរបស់គាត់ធ្លាប់បានទទួលការចាក់ថ្នាំបង្ការ(immunization) កាលពីមានអាយុ 1ឆ្នាំ និងម្តងទៀតមុនពេលក្មេងប្រុសម្នាក់នោះ ចូលរៀននៅអាយុ 5ឆ្នាំ។តើចំណុចណាមួយខាងក្រោមដែលល្អជាងគេក្នុងការព្យាបាលករណីខាងលើនេះ?","o":["ចាក់ Tetanus immune globulin one dose","ចាក់រំលឹក Tetanus toxoid one dose","ចាក់តាមក្បូននូវ Tetanus toxoid ៣ដង","វាស់នូវការឆ្លើយតបប្រព័ន្ធការពាររបស់ក្មេងប្រុស ទៅនឹង Tetanus toxoid","ចាក់ Topical antibiotics"],"a":[1]},{"i":"1ce6f4ca","b":"MED","p":"C","q":"និស្សិតម្នាក់មានអាយុ 24ឆ្នាំ បានមកសំរាកនៅអាគារសង្គ្រោះបន្ទាន់ ដោយ ការៈក្អក ក្តៅខ្លួនខ្លាំងភ្លាមៗ (cough, high fever) ។ ការថតវិទ្យុសាស្ត្រនៅទ្រូង (chest x-ray) បង្ហាញថារលាកសាច់សួតខាងឆ្វេងផ្នែកខាងក្រោម ហើយគាត់ធ្លាប់រលាក Sinus ជាញឹកញាប់ តំរូវអោយប្រើ Antibiotics និងធ្លាប់រលាកសួត 2ដងកាលពី 5ឆ្នាំមុន។តើមេរោគខាងក្រោមណាមួយដែលភាគច្រើនបង្កអោយគាត់មានការរលាកឡើងវិញ?","o":["Haemophilus influenzae","Streptococcus pneumoniae","Moraxella catarrhalis","Pneumocystis jiroveci","Pseudomonas aeruginosa"],"a":[1]},{"i":"61be9e23","b":"MED","p":"C","q":"បុរសម្នាក់មានអាយុ 56ឆ្នាំ ។ បានសួរគ្រូពេទ្យរបស់គាត់ថា គាត់គួរធ្វើតេស្ត ដើម្បីមើលកោសិកាមហារីកនៅក្រពេញ ប្រូស្តាត (Prostate) រឺទេ ?\nចំពោះ ស្ថានភាពណាមួយខាងក្រោមនេះ តើចម្លើយណាមួយដែលត្រឹមត្រូវដើម្បីរក Prostate cancer screening?","o":["Prostate cancer screening ចំពោះបុរសម្នាក់នេះ គឺមិនត្រូវបានធ្វើទេ ព្រោះក្រុមគ្រូសារ របស់គាត់គ្មាននរណាម្នាក់ឈឺជំងឺនេះទេ","ធ្វើការវះកាត់ព្យាបាលសំរាប់ការរកឃើញមានមហារីកប្រូស្តាតដំបូង (Early prostate cancer result) ក្នុងការកាត់បន្ថយអត្រាមរណៈ(Reduction in mortality)","PSA តេស្ត មិនត្រូវបានរកឃើញពីជំងឺនេះក្នុងដំណាក់កាលដំបូង (Earliest stage)","Screening មិនត្រូវបានធ្វើទេ ព្រោះវាគឺមានអ្វីច្រើនជាងការធ្វើ Screening មហារីកដោះ","បុរសមានអាយុប៉ុនហ្នឹង មិនប្រឈមទៅនឹងការរីកលូតលាស់នៃកោសិកាមហារីកនៅ Prostate ទេ ដូច្នេះគឺមិនតំរូវអោយធ្វើ screening ទេ"],"a":[1]},{"i":"72c7a84d","b":"MED","p":"C","q":"ស្រ្ដីម្នាក់មានអាយុ 39ឆ្នាំ ។ គាត់មានប្រវត្តិជំងឺហឺតរ៉ាំរ៉ៃ (chronic asthma) ។ សំពាធឈាមរបស់នាងត្រូវបានពិនិត្យដោយគ្រូពេទ្យគឺ 165/95mmHg ។ BMI: 32 kg/m2(ធម្មតា 20-25 kg/m2)។ រាងកាយពិនិត្យធម្មតា។ ក ណាមួយខាងក្រោមនេះ ដែលឆ្លើយតបទៅនឹងលទ្ទផលខាងលើ?","o":["Compensated metabolic acidosis","Uncompensated metabolic alkalosis","Compensated respiratory acidosis","Uncompensated respiratory alkalosis","Compensated respiratory alkalosis"],"a":[1]},{"i":"f19c2b80","b":"MED","p":"C","q":"អ្នកជិះម៉ូតូម្នាក់មានអាយុ 18ឆ្នាំ។ ត្រូវបានបញ្ជូនមកមន្ទីពេទ្យ ដោយឡានសង្គ្រោះ (Ambulance) ដោយសារគ្រោះថ្នាក់ចររាចរណ៌(Single vehicle crash) បាក់ភ្លៅខាងស្តាំ (Fracture of the right femur) , ឡេះឡាស់(agitated) ហើយវង្វេងវង្វាន់(disoriented)។តើចំណុចខាងក្រោមណាមួយ ដែលមិនមែនជាអទិភាពមុនគេ (not an immediate priority)?","o":["ការវាស់តំលៃលើខ្យល់ដែលចូល និងស្ថានភាពទីតាំងរបស់បំពង់ខ្យល់ (Trachea)","ពិនិត្យនៅផ្លូវដង្ហើមផ្នែកខាងលើ ដើម្បីបញ្ជាក់ថាបំពងខ្យល់បើក (upper air-way to ensure patency)","វិភាគការរាប់គ្រាប់ឈាមបន្ទាន់ (urgent blood count)","វាស់កំរិតជាតិស្ករក្នុងឈាមបន្ទាន់ (urgent blood sugar level)","ការចាក់សរសៃរវ៉ែន (Establish intravenous access)"],"a":[2]},{"i":"9f317a7a","b":"MED","p":"C","q":"ការឈឺចាប់ជាអតិប្បរមា (Hyperalgesia) មានន័យដូចម្តេច?","o":["ការធ្លាក់ចុះនៃញាណដែលទទួលការឈឺចាប់","ការកើនឡើងនូវញាណនៅពេលប៉ះពាល់ (Increased sensitivity to touch)","ការកើនឡើងនូវញាណដែលទទួលការឈឺចាប់(Increased sensitivity to pain)","ការឆ្លើយតបការឈឺចាប់ដោយគ្មានការភ្ញោចនៃឧស្ម័ន (non-noxious stimulus)","ការកើនឡើងនៃចំនួនសរសៃប្រសាទដែលបញ្ជូនការឈឺចាប់ទៅ ខួរក្បាល (nociceptors)"],"a":[2]},{"i":"a90baed2","b":"MED","p":"C","q":"តាមរយៈនៃការមើលបំពង់ស្បូន (uterine tubes) តើចម្លើយណាមួយ ដែលមិនត្រឹមត្រូវ?","o":["នៅជញ្ជាំងស្បូនជាដុំរលោង (smooth muscle in their wall)","បំពង់ស្បូនភ្ជាប់ទៅនឹងខ្លួន និងកំពូលស្បូន(body and Fundus of uterine)","បំពង់ស្បូនភាគច្រើនលាតសន្ធឹងរីក (dilated) នៅ Isthmus","បំពង់ស្បូនមានទីតាំងនៅខាងលើនៃ broad ligament","បំពង់ស្បូនចំហនៅខាង (open laterally) ចូលទៅក្នុងប្រហោងស្រោមពោះ"],"a":[2]},{"i":"cd28b24d","b":"MED","p":"C","q":"តើឃ្លាណាមួយ ជានិយមន័យរបស់ Scapula (ឆ្អឹងស្លាបប្រជៀវ)?","o":["វាជួយបង្កើតអោយមានសន្លាក់ acromioclavicular","វាមិនបានចូលរួមក្នុងកំលាំងបញ្ជូនពីអវៈយវៈខាងលើទៅទ្រូងទេ (upper limb to the thorax)","នៅផ្នែកខាងលើនៃឆ្អឹងស្លាបប្រជៀវ(suprascapular) radial nerve ឆ្លងកាត់","មានតែសាច់ដុំតែ2គត់ដែលភ្ជាប់ទៅនឹងវា(musculotendinous cuff muscles)","Spine នៃឆ្អឹងស្លាបប្រជៀវ នៅត្រឹមឆ្អឹងទី7 នៃ thoracic vertebra"],"a":[0]},{"i":"5e5bb908","b":"MED","p":"C","q":"តើចំណុចណាមួយខាងក្រោម ដែលបកស្រាយបញ្ជាក់ពីការឆ្លើយតបនៃ កោសិកាសាច់ដុំបេះដូង ចំពោះការឡើងសំពាធឈាម (cardiac myocytes to hypertension)?","o":["ការស្វិតសាច់ដុំ (Atrophy)","ការកើនចំនួនកោសិកាសាច់ដុំ (Metaplasia)","ការរីកចំនួនកោសិកាសាច់ដុំ (Hyperplasia)","ការរីកសាច់ដុំ (Hypertrophy)","វិបត្ដិន៍នៃការរីកកោសិកាសាច់ដុំ​ (Dysplasia)"],"a":[3]},{"i":"7e06a23d","b":"MED","p":"C","q":"អំឡុងពេលស្ត្រីមានផ្ទៃពោះ (during pregnancy) តើជំងឺឆ្លងណាមួយ ដែលប្រឈមតិចតួចបំផុត (causing congenital infection)","o":["Toxoplasmosis","Syphilis","Rubella","Listeriosis","Tuberculosis"],"a":[4]},{"i":"15d8339b","b":"MED","p":"C","q":"តើរោគសញ្ញាណាមួយ ដែលត្រឹមត្រូវបញ្ជាក់ពីការធ្លាក់ចុះនៃមុខងារប្រហោងបេះដូងខាងស្តាំ (Right-sided heart failure)?","o":["ភាគច្រើនមូលហេតុមកពីបេះដូងខាងឆ្វេង មុខងារធ្លាក់ចុះ (Left side cardiac failure)","ផលវិបាកនៃការហើមសួត (Pulmonary edema is consequence)","ជាលទ្ធផលនៃជំងឺសួត ភាគច្រើនគឺ ventricular ខាងឆ្វេង hypertrophy","សរីរាង្គថ្លើម ជាមួយនឹង ការក្រិនថ្លើម (Cirrhosis) ហើយថយចុះ (Shrinkage)","ការវាយតំលៃដោយសង្កត់លើស្បែកហើម(Pitting edema)ដោយផ្អែកលើសញ្ញាសំខាន់ៗ"],"a":[4]},{"i":"8524dcc7","b":"MED","p":"C","q":"តើចម្លើយណាមួយខាងក្រោមនេះ ត្រឹមត្រូវ ដែលបង្ហាញនូវការផ្លាស់ប្តូរប្រព័ន្ឋឈាមបេះដូង អំឡុងពេលមានផ្ទៃពោះ (Maternal cardiovascular changes during pregnancy)?","o":["ធ្លាក់ចុះនូវការច្របាច់ឈាមចេញពីបេះដូង (cardiac output)","មានរួមនូវប្រព័ន្ធសរសៃឈាម (Systemic vasoconstriction)","មានការរួមតូចនៅសរសៃអាកទែនៅតំរងនោម (vasoconstriction of renal arterioless)","មានការធ្លាក់ចុះនូវការផលិតគ្រាប់ឈាមក្រហម","មានការកើនឡើងចំណុះឈាម (increase blood volume)"],"a":[4]},{"i":"8cec45fd","b":"MED","p":"C","q":"តើសរសៃប្រសាទគុយប៊ីតាល់ (Ulnar nerve) ឆ្លងកាត់តំបន់មួយណា?","o":["ផ្នែកខាងក្រៅ Epicondyle នៃឆ្អឹងដៃ (Humerus)","ស្បែកនៅលើផ្ទៃរបស់ឆ្អឹង palmarនៃមេដៃ (thumb)","សាច់ដុំនៅម្រាមដៃទី១ និង tic","And antibacterial","An antibiotic"],"a":[2]},{"i":"be884414","b":"MED","p":"C","q":"ស្ត្រីម្នាក់អាយុ 78ឆ្នាំ មានគ្រុន (Fibril), បេះដូងលោតញ៉ាប់ (tachycardia), និងចុកពោះ (abdominal pain)។ ពេលពិនិត្យពោះមានដុំមួយឈឺ នៅកណ្ដៀតក្អមពោះខាងឆ្វេង(tender mass at left iliac fossa ) ។បន្ទាប់ពីការសង្គ្រោះ (Resuscitation) និងការធ្វើតេស្តឈាម តើយើងត្រូវធ្វើអ្វីសមស្របបន្ដទៀត ដើម្បីតាមដានជំងឺនេះ?","o":["ថត ស្កែន ពោះ និងអាងត្រគៀក(Abdominal and pelvic CT scan)","ពិនិត្យរកឈាមក្នុងលាមក(Faecal occult blood)","បញ្ចូលបារិយ៉ូម​ថត( Barium enema)","អេកូពោះ (Ultrasound of the abdomen)","ឆ្លុះពោះវៀនធំ (Colonoscopy)"],"a":[0]},{"i":"c2f1a34f","b":"MED","p":"C","q":"ក្មេងប្រុសម្នាក់អាយុ 15ឆ្នាំ មានរោគសញ្ញា ឈឺនៅជុំវិញផ្ចិត(central periumbilical pain), ក្តៅខ្លួនតិចៗ (low grad temperature), ក្អួត (Nausea) ។ ប៉ុន្មានម៉ោងក្រោយមកឈឺរាលដាលមកដល់កណ្ដៀតក្អមស្ដាំ (Right Iliac fossa) ។តើរោគវិនិច្ឆ័យណាមួយ ដែលអ្នកគិតដល់(Diagnosis)?","o":["រលាកកូនកណ្ដុរនៅពោះ (Mesenteric lymphadenitis)","រលាកខ្នែងពោះវៀនស្រួចស្រាវ (Acute appendicitis)","ជំងឺក្រោន (Crohn’s disease)","ជំងឺរលាកអាងត្រគាក (Pelvic inflammatory disease)","រលាកខ្នែងមីកកិល (Meckel’s diverticulitis)"],"a":[1]},{"i":"d701c451","b":"MED","p":"C","q":"ផលប៉ះពាល់ (Side-effects) នៃ NSAIDs (Non-steroidal anti-inflammatory drugs) គឺចំណុច ទាំងអស់នេះ លើកលែងតែ:","o":["បង្ករឱ្យកើនជំងឺហឺត(Provocation of asthma)","ខូចមុខងារផ្លាកែត(Platelet dysfunction)","ស្ទះទឹកនោម(Urinary retention)","ខូចតំរង់នោម(Renal impairment)","ហូរឈាមក្រពះ ពោះវៀន(Gastrointestinal bleeding)"],"a":[2]},{"i":"0d8a53f5","b":"MED","p":"C","q":"បុរសម្នាក់អាយុ 58ឆ្នាំ នៅពេលបត់ជើងធំឈឺខ្លាំង (severs pain), ឈាមស្រក់ស្រស់ៗ (bright red bleeding) ។ ពេលពិនិត្យរុន្ធគូតមានដាច់រហែក (tear) ជាមួយការហើមតិចតួចនៅស្បែកនៅ Posterior midline នៃ anus ។តើរោគវិនិច្ឆ័យគឺអ្វី?","o":["បូសជុំវិញរុន្ធគូថ(Peri-anal abscess)","ជំងឺឫសដូងបាត(Haemorrhoids)","បូសអន្ទុង(Anal fistula)","ដុំរុន្ធគូថ(Pilonidal sinus)","រហែករុន្ធគូថ(Anal fissure)"],"a":[4]},{"i":"5051eeb4","b":"MED","p":"C","q":"តើចំណុចណាមួយត្រឹមត្រូវទៅនឹងនិយមន័យរបស់ Mallory Weiss Syndrome?","o":["ដាច់បំពង់អាហារបន្ទាប់ពីការក្អួត(It is an esophageal rupture)","ព្យាបាលបំពង់អាហារដោយTreatment requires esophageal banding","ការរហែកបំពង់អាហារ(tear)ដោយសារការប្រឹងក្អួតខ្លាំង","វាជា auto-immune condition","ផលវិបាកនៃជំងឺក្រិនថ្លើមដោយសារស្រា (It is a consequence of alcoholic liver damage)"],"a":[2]},{"i":"38e73760","b":"MED","p":"C","q":"Graduated compressive stocking ត្រូវបានធ្វើលើអ្នកជំងឺវះកាត់ហើយដឹងខ្លួនឡើងវិញ (patient recovering) តើដើម្បីការពារអ្វី?","o":["ហើមជើង (Peripheral edema)","រុំការពារដំបៅ (Pressure ulcers)","រលាកកោសិកា (Cellulitis)","រលាកសរសៃវ៉ែន (Superficial thrombo phlebitis)","កកឈាមក្នុងសរសៃវ៉ែន (Venous thrombo embolism)"],"a":[4]},{"i":"d8252661","b":"MED","p":"C","q":"ស្ត្រីម្នាក់អាយុ 58ឆ្នាំ លេចចេញនូវរោគសញ្ញា ដែលប្រាប់ដោយគ្រូពេទ្យទូទៅ (General practisener)របស់គាត់ថា មាន Hiatus hernia on the bases ។ គាត់សួរទៅវិញថា តើគាត់មិនត្រូវធ្វើអ្វីខ្លះ(not a useful measure)មុនពេលវះកាត់","o":["ការបញ្ចុះទំងន់ (Weight loss)","ការឈប់បារី (Smoking cessation)","ប្រើថ្នាំប្រឆាំងអាស៊ីត (Antacids)","បង្កើនចំណីអាហារ និងសំរាន្ដ(Elevation of the food of the bed)","បរិភោគតិចៗតែច្រើនដង (Frequent small meals)"],"a":[3]},{"i":"f3152c44","b":"MED","p":"C","q":"តើគុណសម្បត្តិ (advantage) អ្វីរបស់ Tramadol លើសពី Morphine?","o":["មានអន្ដរកម្ម(Interaction)តិចតួចជាមួយantidepressants បើធៀបទៅនឹង morphine","សម្ពោធផ្លូវដង្ហើមចុះ (Less respiratory depression)","ថយចុះការបង្កររោគ","រោកតិចតួច(Less diarrhea)","ងាយស្រួល reversed ជាមួយ flumazenil"],"a":[1]},{"i":"f726fd81","b":"MED","p":"C","q":"ស្រ្ដីម្នាក់បានសំរាកនៅបន្ទប់ពីសង្រ្គោះបន្ទាន់(Emergency department) ដោយក្អករយៈពេល 5ថ្ងៃ និងក្តៅខ្លួន 2ថ្ងៃ ហើយល្ហិតល្ហៃទៅៗ (increased lethargy) ។ Oxygen saturation 90% សំពាធឈាម 90/50 mmHg, ចង្វាក់បេះដូង 120 /1នាទី, កំដៅ: 38.5 oC តាមការពិនិត្យ នាងមានជំងឺរលាកទងសួត(bronchial breathing) នៅសួតក្រោមផ្នែកខាងស្ដាំ (Right lung base)។តើរោគវិនិច្ឆ័យណាមួយ ខាងក្រោមនេះ?","o":["Bronchitis","Pneumonia","Pulmonary embolism","Pulmonary hemorrhage","Respiratory tract infection"],"a":[1]},{"i":"2e5b4af5","b":"MED","p":"C","q":"តើអ្នកធ្វើការគណនាយ៉ាងដូចម្តេចចំពោះសម្ពោធឈាម (Mean Arterial Pressure)?","o":["Diastolic BP + systolic BP","(Diastolic BP / 3) + systolic BP","Diastolic BP + 1/3 (systolic BP - diastolic BP)","Diastolic BP + 1/3 (systolic BP + diastolic BP)","(Diastolic BP + systolic BP) / 2"],"a":[2]},{"i":"7bd7991f","b":"MED","p":"C","q":"ស្រ្ដីម្នាក់មានអាយុ 25ឆ្នាំ បានសំរាកនៅបន្ទប់ពីសង្រ្គោះបន្ទាន់(Emergency department) ដោយក្អករយៈពេល 5ថ្ងៃ និងក្តៅខ្លួន 2ថ្ងៃ ហើយល្ហិតល្ហៃទៅៗ (increased lethargy) ។ Oxygen saturation 90% សំពាធឈាម 90/50 mmHg, ចង្វាក់បេះដូង 120 /1នាទី, កំដៅ: 38.5 oC តាមការពិនិត្យ នាងមានជំងឺរលាកទងសួត(bronchial breathing) នៅសួតក្រោមផ្នែកខាងស្ដាំ (Right lung base)។ គ្រូពេទ្យបានធ្វើការវាយតំលៃថាគាត់ត្រូវចាក់បញ្ចូល IV fluids ។តើ Fluid ណាដែលត្រូវចាក់បញ្ចូលដំបូងមុនធ្វើការវាយតំលៃឡើងវិញ?","o":["1 litre normal saline rapidly","1 litre 5% glucose rapidly","1 litre normal saline over 2 hours","1 litre 5% glucose over 1 hour","500 mls of 5% glucose rapidly"],"a":[0]},{"i":"492f2e29","b":"MED","p":"C","q":"ស្ត្រីម្នាក់មានអាយុ 50ឆ្នាំ ដែលបានបញ្ជូនទៅ Emergency department គាត់បានដូលនៅផ្ទះ ខណៈពេលក្រោកឈរនៅកន្លែងលាងដៃ (Standing at the sink) ។ គាត់នៅចាំបានថា គាត់មានអារម្មណ៏ក្តៅខ្លួន (hot) ហើយចង់ក្អួត (Nauseated) មុននឹងព្រឹលភ្នែក (tunnel vision) ហើយបន្ទាប់មកក៏ចេញមកក្រៅ។ ជារឿយៗគាត់មានសភាពល្អ ហើយញ៉ាំថ្នាំបញ្ចុះសំពាធឈាមជាធម្មតា (single anti-hypertensive agent) ។ តាមការពិនិត្យ(physical examination) ឃើញគាត់មានសភាពល្អ គ្មានអ្វីធំដុំ នឹងគ្មានសញ្ញាជំងឺបេះដូងសរសៃឈាម (cardiovascular) និងគ្មានសញ្ញាសរសៃប្រសាទ(focal neurological deficits) ទេ។តើអ្វីដែលជាមូលហេតុនៃការដួលសន្លប់របស់គាត់(Syncopal episode)?","o":["Vasovagal syncope","Transient ischaemic attack","Orthostatic hypotension","Ventricular tachycardia","Ventricular fibrillation"],"a":[0]},{"i":"a8caf674","b":"MED","p":"C","q":"ស្ត្រីម្នាក់អាយុ 35ឆ្នាំ ត្រូវបានដឹកបញ្ជូនទៅ Emergency department ដោយ ឡានសង្គ្រោះ (Ambulance) បន្ទាប់ពីឃើញគាត់ដួលនៅមាត់ទឹកប្រឡាយ(Lying in the gutter) ។ គាត់អាចនិយាយបាន ប៉ុន្តែមិនអាចឆ្លើយសមស្របទៅនឹងអ្វីដែ ្រោម","o":["ពន្យល់ម្តាយថា ទារក ដែលបៅទឹកដោះគោ ជាទូទៅតែងតែមាន លាមកតិចជាង ទារកដែលបៅទឹកដោះម្ដាយ ។ ប្រសិនបើ ទារក មានលាមកជារៀងរាល់ 1 ទៅ 3 ថ្ងៃម្ដង និងគ្មានរោគសញ្ញាអ្វីទេនោះ ក៏មិនត្រូវការ ការព្យាបាលដែរ ។","បន្ថែម កន្ទក់ 2ស្លាបព្រាកាហ្វេ ទៅក្នុងទឹកដោះគោ ដើម្បីបង្កើនអាហារដែលមានសរសៃរ","ប្រើ glycerine suppositories 2ដងក្នុង1ថ្ងៃ","ប្តូរ ទៅ ទឹកដោះគោផ្សេងទៀត","ផ្តល់នូវ ប្រេងរ៉ែ និង ទឹក ជាតំរូវការ"],"a":[0]},{"i":"40c49848","b":"PED","p":"B","q":"ការចាក់ថ្នាំបង្ការ :\nកុមារម្នាក់អាយុ 4 ខែ ត្រូវបានម្ដាយនាំមកគ្លីនិករបស់អ្នក។ ម្តាយបាននិយាយថានៅពេលដែលកូនគាត់មានអាយុ 6 សប្ដាហ៍ នាងបានយកកូនទៅពិនិត្យនៅមណ្ឌលសុខភាព គិលានុប្បដ្ឋាកបានប្រាប់ថា កុមារ ផ្ដាសាយ និងមិនអាចទទួល ថ្នាំបង្ការ បានទេ ។តាំងពីកើតមក កុមារបានចាក់តែថ្នាំបង្ការជំងឺរលាកថ្លើមប្រភេទ B និងជំងឺរបេង BCG នៅក្នុងមន្ទីរពេទ្យលើកទី1។ សប្តាហ៍កន្លងទៅនេះ កុមារមានជំងឺរលាកផ្លូវដង្ហើមផ្នែកខាងលើ ប៉ុន្ដែបើយោងតាមម្ដាយរបស់កុមារ គឺកុមារមានភាពសប្បាយរីករាយ សកម្ម អត់គ្រុនក្ដៅ និងបៅដោះធម្មតា ។ ការពិនិត្យរាងកាយ កុមារមានទំងន់និងប្រវែងសមស្របតាមអាយុ ញញឹមហើយ សកម្មនិងអ្វីផ្សេងទៀតធម្មតា លើកលែងតែ មានការហៀរសំបោរថ្លាៗតិចតួច ។ឥឡូវនេះតើកុមារគួរទទួលថ្នាំបង្ការមួយណា បើយោងតាមការណែនាំរបស់កម្មវិធីជាតិសម្រាប់ការចាក់ថ្នាំបង្ការ","o":["ខាន់ស្លាក់ តេតាណូស ក្អកមាន់ (DTP) រលាកថ្លើមប្រភេទ B រលាកស្រោមខួរ (Hib) ថ្នាំបង្ការជំងឺគ្រុនស្វិតដៃជើងបន្ដក់ (OPV)","ជំងឺរលាកថ្លើមប្រភេទ B DTaP OPV ជំងឺរាក ថ្នាំបង្ការជំងឺកញ្រ្ចឹល (Rouvax)","DTaP OPV ជំងឺរលាកថ្លើមប្រភេទ B","ជំងឺរលាកថ្លើមប្រភេទ B ថ្នាំបង្ការ pneumococcal polysaccharide (PPV) OPV","ជំងឺរលាកថ្លើមប្រភេទ B DTaP PPV IPV HIB ជំងឺរាក"],"a":[0]},{"i":"c7e9ee6d","b":"PED","p":"B","q":"ការចាក់ថាំបង្ការ :\nកុមារម្នាក់អាយុ 4 ខែ ត្រូវបានម្ដាយនាំមកគ្លីនិករបស់អ្នក។ ម្តាយបាននិយាយថានៅពេលដែលកូនគាត់មានអាយុ 6 សប្ដាហ៍ នាងបានយកកូនទៅពិនិត្យនៅមណ្ឌលសុខភាព គិលានុប្បដ្ឋាកបានប្រាប់ថា កុមារ ផ្ដាសាយ និងមិនអាចទទួល ថ្នាំបង្ការ បានទេ ។តាំងពីកើតមក កុមារបានចាក់តែថ្នាំបង្ការជំងឺរលាកថ្លើមប្រភេទ B និងជំងឺរបេង BCG នៅក្នុងមន្ទីរពេទ្យលើកទី1។ សប្តាហ៍កន្លងទៅនេះ កុមារមានជំងឺរលាកផ្លូវដង្ហើមផ្នែកខាងលើ ប៉ុន្ដែបើយោងតាមម្ដាយរបស់កុមារ គឺកុមារមានភាពសប្បាយរីករាយ សកម្ម អត់គ្រុនក្ដៅ និងបៅដោះធម្មតា ។ ការពិនិត្យរាងកាយ កុមារមានទំងន់និងប្រវែងសមស្របតាមអាយុ ញញឹមហើយ សកម្មនិងអ្វីផ្សេងទៀតធម្មតា លើកលែងតែ មានការហៀរសំបោរថ្លាៗតិចតួច ។តើប្រយោគខាងក្រោម មួយណាដែលត្រឹមត្រូវទាក់ទងនឹង ការចាក់ថ្នាំបង្ការរបស់កុមារនាពេលអនាគត","o":["មិនត្រូវផ្តល់ថ្នាំបង្ការនៅពេលមានគ្រុនក្ដៅតិចតួច","មិនត្រូវផ្តល់ថ្នាំបង្ការ បើសិនជាកុមារមានជំងឺកង្វះអាហារូបត្ថម្ភ","ផ្តល់ថ្នាំបង្ការ ទោះបីជាកុមារមានគ្រុនក្ដៅតិចតួច ឬ ក៏ហៀរសំបោរក៏ដោយ","ពន្យារពេលការចាក់ថ្នាំបង្ការ បើសិនជាកុមារមាន ជំងឺរលាកផ្លូវដង្ហើមផ្នែកខាងលើតិចតួច","ចម្លើយ ក និង ខ គឺត្រឹមត្រូវ"],"a":[2]},{"i":"026009c0","b":"PED","p":"B","q":"ការចាក់ថាំបង្ការ :\nកុមារម្នាក់អាយុ 4 ខែ ត្រូវបានម្ដាយនាំមកគ្លីនិករបស់អ្នក។ ម្តាយបាននិយាយថានៅពេលដែលកូនគាត់មានអាយុ 6 សប្ដាហ៍ នាងបានយកកូនទៅពិនិត្យនៅមណ្ឌលសុខភាព គិលានុប្បដ្ឋាកបានប្រាប់ថា កុមារ ផ្ដាសាយ និងមិនអាចទទួល ថ្នាំបង្ការ បានទេ ។តាំងពីកើតមក កុមារបានចាក់តែថ្នាំបង្ការជំងឺរលាកថ្លើមប្រភេទ B និងជំងឺរបេង BCG នៅក្នុងមន្ទីរពេទ្យលើកទី1។ សប្តាហ៍កន្លងទៅនេះ កុមារមានជំងឺរលាកផ្លូវដង្ហើមផ្នែកខាងលើ ប៉ុន្ដែបើយោងតាមម្ដាយរបស់កុមារ គឺកុមារមានភាពសប្បាយរីករាយ សកម្ម អត់គ្រុនក្ដៅ និងបៅដោះធម្មតា ។ ការពិនិត្យរាងកាយ កុមារមានទំងន់និងប្រវែងសមស្របតាមអាយុ ញញឹមហើយ សកម្មនិងអ្វីផ្សេងទៀតធម្មតា លើកលែងតែ មានការហៀរសំបោរថ្លាៗតិចតួច ។តើប្រយោគខាងក្រោមដែលទាក់ទងនឹងការទទួលថ្នាំបង្ការប្រឆាំងនឹងជំងឺគ្រុនស្វិតដៃជើង មួយណា ជាការពិត","o":["ថ្នាំបន្តក់តាមមាត់ (OPV) គឺជា inactivated vaccine ( killed )","ថ្នាំចាក់ (IPV) គឺជា​ Live attenuated vaccine","OPV និង IPV ទាំងពីរនេះ ត្រូវបានណែនាំដោយកម្មវិធីថ្នាក់ជាតិរបស់ EPI នៅក្នុងប្រទេសកម្ពុជា","OPV គឺមានជាប់ទាក់ទង ជាមួយនឹង ការប្រឈមគ្រោះថា្នក់តិចតួចនៃ paralytic poliomyelitis","ចម្លើយ ក និង ខ គឺត្រឹមត្រូវ"],"a":[3]},{"i":"e8a5df68","b":"PED","p":"B","q":"ការចាក់ថាំបង្ការ :\nកុមារម្នាក់អាយុ 4 ខែ ត្រូវបានម្ដាយនាំមកគ្លីនិករបស់អ្នក។ ម្តាយបាននិយាយថានៅពេលដែលកូនគាត់មានអាយុ 6 សប្ដាហ៍ នាងបានយកកូនទៅពិនិត្យនៅមណ្ឌលសុខភាព គិលានុប្បដ្ឋាកបានប្រាប់ថា កុមារ ផ្ដាសាយ និងមិនអាចទទួល ថ្នាំបង្ការ បានទេ ។តាំងពីកើតមក កុមារបានចាក់តែថ្នាំបង្ការជំងឺរលាកថ្លើមប្រភេទ B និងជំងឺរបេង BCG នៅក្នុងមន្ទីរពេទ្យលើកទី1។ សប្តាហ៍កន្លងទៅនេះ កុមារមានជំ R","p":"A","q":"ក្រោយកាត់មហារីកពោះវៀនស៊ីកម៉ា (sigmoid colectomy)៥ថ្ងៃ មុខរបួសវះដាច់ចេញពីគ្នានិងមានលេចចេញឈាមលាយប្លាស្មាជាច្រើន។ ពិនិត្យមុខរបួស ដាច់ចេញពីគ្នាយ៉ាងខ្លាំង។ ការព្យាបាលបន្ត ល្អបំផុតគេគួរធ្វើអ្វី?","o":["បើកទូលាយមុខរបួសដើម្បីបង្ហូរកាកសំណល់ចេញពីមុខរបួស","យកសារធាតុរាវទៅបណ្តុះមេរោគនិងក្រោយមានលទ្ធផលប្រើអង់ទីប៊ីយ៉ូទិកសមស្រប","ប្រើបង់បិទភ្ជឹតគែមមុខរបួសឡើងវិញដោយប្រុងប្រយ័ត្ន","បញ្ជូនត្រលប់ទៅបន្ទប់វះកាត់ភ្លាម","អនុវត្តការចងរឹតពោះរបៀប Scultetus binder"],"a":[3]},{"i":"7972c356","b":"SUR","p":"A","q":"រោគសញ្ញានិងចង្កោមរោគសញ្ញានៃការបែកគ្រាប់ឈាមដោយសារប្រតិកម្មការបញ្ចូលឈាមគឺ?","o":["ឡើងកម្តៅ (Hypothermia) ខ្លួនឡើងត្រជាក់ខ្លាំង","សម្ពាធឈាមកើនខ្ពស់ (Hypertension)","ទឹកនោមច្រើន (Polyuria)","ហូរឈាមខុសធម្មតា (Abnormal bleeding)","ស្រកៀរស្បែកតំបន់បញ្ចូលឈាម (Hypesthesia at the transfusion site)"],"a":[3]},{"i":"292c9083","b":"SUR","p":"A","q":"គ្រូពេទ្យវះកាត់គួរផ្តោតការយកចិត្តទុកដាក់លើតេស្តណាអំពីតួនាទីឈាមកក ចំពោះអ្នកជម្ងឺដែលបានប្រើថ្នាំ ប្រឆាំង រលាកឬថ្នាំបន្ថយការឈឺចាប់?","o":["APTT","PT","រយៈពេលរឹបទីឡាស (Reptilase time)","រយៈពេលឈាមហូរ (Bleeding time)","រយៈពេលត្រុមប៊ីន (Thrombin time)"],"a":[3]},{"i":"2719952a","b":"SUR","p":"A","q":"សារធាតុបន្សាបដំបូងបង្អស់ ក្រោយពេលវះកាត់គឺ៖","o":["សារធាតុជាសាខានៃអាមីណូអាស៊ីត","សារធាតុមិនមែនជាសាខានៃអាមីណូអាស៊ីត","កេតូន (Ketone)","គ្លីកូសែន (Glycogen)","គ្លុយកូស (Glucose)"],"a":[3]},{"i":"9780d1e2","b":"SUR","p":"A","q":"ការធ្វើរោគវិន្និច្ឆ័យតាមរយៈឧបករណ៌ឆ្លុះកាត់ជញ្ជាំងពោះ ( laparoscopy) តើគេមិនអនុវត្តចំពោះអ្នកជម្ងឺណា?","o":["អ្នកជម្ងឺដែលហើមតឹងក្រោយរបួសបញ្ឆឹតពោះដោយគ្រាប់កាំភ្លើង","អ្នកជម្ងឺមានស្ថេរភាពក្រោយរបួសដោយរបួសចាក់នៅជញ្ជាំងទ្រូងផ្នែកខាងក្រោម","អ្នកជម្ងឺដែលមានដុំពកសាច់នៅក្បាលលំពែង","ស្រ្តីវ័យក្មេងដែលមានការឈឺចាប់នៅអាងត្រគាកនិងមានគ្រុនក្តៅ","អ្នកជម្ងឺមនុស្សចាស់កំពុងនៅក្នុងបន្ទប់សង្រ្គោះដោយសង្ស័យខ្វះឈាមចិញ្ចឹមនៅពោះវៀន(intestinal ischemia)"],"a":[0]},{"i":"8950d683","b":"SUR","p":"A","q":"ស្រ្តីអាយុ២៣ឆ្នាំក្រោយវះកាត់ក្រពេញទីរ៉ូអ៊ីតទាំងមូលដោយសារកាស៊ីណូម៉ា (carcinoma)ក្រពេញ ទីរ៉ូអ៊ីត។ ក្រោយវះកាត់បានពីរថ្ងៃ គាត់ចាប់ផ្តើមត្អូញថាមានអារម្មណ៍ចាក់ស្កៀប :"A","q":"ជាទូទៅដើម្បីអនុត្តន៍ការវះកាត់មួយ គេត្រូវផ្គត់ផ្គង់ដង្ហើមយ៉ាងដូចម្តេច?\n(Generally accepted indications for mechanical ventilatory support include)","o":["សំពាធ O2ទាបជាង70 kPa និង PCO2 ខ្ពស់ជាង50 kPa ធៀបនឹងបរិយាកាសក្នុងបន្ទប់","សម្ពាធ O2 រវាងកូនថង់សួតនិងអាទែរ ខុស គ្នា 150 kPa ពេលដកដង្ហើមជាមួយ O2100%","សមត្ថភាព (ចំណុះ) ជីវិត40–60 mL/kg (Vital capacity of 40–60 mL/kg)","អត្រាសង្វាក់ដង្ហើមលើសពី៣៥ដងក្នុងមួយនាទី","អត្រានៃចំនួន dead spacetidal (VD/VT)ទាបជាង 0.6"],"a":[3]},{"i":"2c503d4d","b":"SUR","p":"A","q":"ប្រតិកម្មបែកគ្រាប់ឈាមដោយសារការបញ្ចូលឈាមមិនត្រូវគ្នា ការព្យាបាលត្រឹមត្រូវបំផុតគឺ៖","o":["ជម្រុញការបញ្ចេញទឹកនោមដោយប្រើម៉ានីតុល៥០% ចំនួន 250 ml","ព្យាបាលការគ្មានទឹកនោមដោយសារធាតុរាវនិងប៉ូតាស្យូម","ធ្វើអោយកំរិតអាស៊ីតទឹកនោមខ្ពស់ដើម្បីបង្ការកកអេម៉ូក្លូប៊ីនក្នុងបំពង់តម្រងនោម","ដកវត្ថុក្រៅរាងកាយ (foreign bodies) ចេញ, ដូចជា Foley catheters, ដែលជាមូលហេតុធ្វើអោយមានផលវិបាកហូរឈាម","បញ្ឈប់ការបញ្ចូលឈាមជាបន្ទាន់។"],"a":[4]},{"i":"d230d2d6","b":"SUR","p":"A","q":"តើគេត្រូវរួមផ្សំប្រភេទថ្នាំស្ពឹកតាមផ្លូវដង្ហើមមួយណា ដើម្បីកបង្កើនប្រសិទ្ធភាពថ្នាំសណ្តំទូទៅ តាមផ្លូវដង្ហើម?","o":["Diethyl ether","Nitrous oxide","Halothane","Methoxyflurane","Trichloroethylene"],"a":[1]},{"i":"bcc3e327","b":"SUR","p":"A","q":"ដូប៉ាមីន (Dopamine) ជាថ្នាំ ដែលត្រូវបានគេប្រើប្រាស់ញឹកញាប់ចំពោះអ្នកជម្ងឺធ្ងន់ធ្ងរព្រោះ?","o":["នៅកំរិតខ្ពស់វាបង្កើនលំហូរឈាមនៅ សរីរាង្គខាងក្នុង","នៅកំរិតខ្ពស់បង្កើនលំហូរក្នុងសរសៃឈាមបេះដូងកូរ៉ូណែរ (coronary flow)","នៅកំរិតទាបវាបន្ថយល្បឿនសង្វាក់បេះដូង","នៅកំរិទាបវាធ្វើអោយភាពយឺតនៃសរសៃឈាមបរិមណ្ឌលថយចុះ","វារារាំងការរំដោះចេញនូវកាតេកូបាឡាមីន( catecholamine)"],"a":[1]},{"i":"5cb91a4e","b":"SUR","p":"A","q":"យន្តការបំពេញ(ប៉ះប៉ូវ)ក្នុងពេលមានការហូរឈាមស្រួចស្រាវគឺ","o":["បន្ថយលំហូរឈាមក្នុងសរសៃឈាមបេះដូងនិងខួរក្បាល","បន្ថយការកន្រ្តាក់សាច់ដុំបេះដូង","ពង្រីកសរសៃឈាមក្នុងតម្រងនោមនិងសរីរៈខាងក្នុង","បង្កើនល្បឿនសង្វាក់ដង្ហើម (Increased respiratory rate)","បន្ថយការស្រូបយកសូដ្យូមនៅតម្រងនោម (Decreased renal sodium resorption)"],"a":[3]},{"i":"9a2d2416","b":"SUR","p":"A","q":"យុវតីអាយុ១៨ឆ្នាំម្នាក់ឡើងកន្ទាលត្រអាកនិងពិបាកដកដង្ហើមក្រោយចាក់ថ្នាំប៉េនីស៊ីលីន។ សម្ពាធឈាម 120/60 mm Hg សង្វាក់បេះដូង 155 beats/min, និងសង្វាក់ដង្ហើម 30 breaths/min។ ការព្យាបាលគឺ៖","o":["បញ្ចូលអុកស៊ីសែន (Intubation)","ថ្នាំ Epinephrine","ថ្នាំ Beta blockers","ថ្នាំ Iodine","បញ្ចូលសារធាតុរាវ (Fluid challenge)"],"a":[1]},{"i":"da8a6cd0","b":"SUR","p":"A","q":"កំណកឈាម ក្នុងពេលបញ្ចូលឈាម មានការរួមផ្សំជាមួយ ៖ ( During blood transfusion, clotting of transfused blood is associated with)","o":["ការមិនចុះសម្រុងរវាងក្រុមឈាម ABO (ABO incompatibility)","ការមិនចុះសម្រុងនៃក្រុមឈាមដែលមានចំនួនតិច (Minor blood group incompatibility)","ការមិនចុះសម្រុងនៃប្រភេទឈាម Rh (Rh incompatibility)","ការបញ្ចូលឆ្លងកាត់ Ringer’s lactate (Transfusion through Ringer’s lactate)","ការបញ្ចូលឆ្លងកាត់ ដិចស្រ្តូ៥%និងទឹក (Transfusion through 5% dextrose and water)"],"a":[3]},{"i":"ae319cec","b":"SUR","p":"A","q":"ក្នងចំណោមអ្នកជម្ងឺសម្រាកក្នុងបន្ទប់សង្រ្គោះបន្ទាន់ ត្រូវទទួលរបបអាហារអោយបានត្រឹមត្រូវ តើអ្វីជាភស្តុតាងបញ្ជាក់អំពីភាពត្រឹមត្រូវនៃរបបអាហារ?","o":["កំរិតបញ្ចេញនីត្រូសែនតាមទឹកនោម (Urinary nitrogen excretion levels)","កំរិតប្រូតេអ៊ីនសរុបក្នុងសេរ៉ូម (Total serum protein level)","កំរិតអាល់ប៊ុយមីនក្នុងសេរ៉ូម (Serum albumin level)","កំរិតបញ្ចូល transferrin ក្នុងសេរ៉ូម Serum transferrin levels","ផលចែកនៃដង្ហើម (Respiratory quotient)"],"a":[2]},{"i":"e869b54c","b":"SUR","p":"A","q":"គ្រោះថ្នាក់នៃការបូមរសក្រពះដោយសារកាដឺទែរចូលទៅក្នុងផ្លូវដង្ហើម ការព្យាបាលដំបូងត្រូវធ្វើអ្វី?","o":["បញ្ចូលទុយោក្នុងបំពង់ខ្យល់ និងការបូមស្លេស (Tracheal intubation and suctioning)","ព្យាបាលដោយស្តេរ៉ូអ៊ីត( Steroids)","ចិញ្ចឹមអាហារដោយសារធាតុរាវតាមសរសៃវ៉ែន (Intravenous fluid bolus)","ចោះនៅគ្រីកូទីរ័យ (Cricothyroidotomy)","សំពាធវិជ្ជមានខ្យល់ដង្ហើមចេញខ្ពស់ (High positive end expiratory pressure)"],"a":[0]},{"i":"e5117361","b":"SUR","p":"A","q":"នៅក្នុងការអនុវត្តន៍ចោះបំពង់ខ្យល់ អ្វីដែលជាអត្ថិភាព?\n(In performing a tracheostomy, authorities agree that)","o":["សាច់ដុំ strap អាចត្រូវបំបែកពីគ្នា (The strap muscles should be divided)","ចង្កេះក្រពេញទីរូអ៊ីតមិនត្រូវបានប៉ះពាល់ (The thyroid isthmus should be preserved)","បំពង់ខ្យល់គួរចោះនៅកង់ទី២ ឬទី៣","ផ្លូវចោះគឺត្រូវកាត់ទទឹង (Only horizontal incisions should be used)","ចោះបំពង់ខ្យល់ត្រឹមត្រូវគឺគេច្រើនចោះនៅគ្រីកូទីរ័យ ដើម្បីធ្វើការសង្រ្គោះបន្ទាន់"],"a":[2]},{"i":"cdc9d9ac","b":"SUR","p":"A","q":"សម្ពាធឈាមវ៉ែនសង់ត្រាល់ អាចធ្លាក់ទាបដោយសារ៖\nCentral venous pressure (CVP) may be decreased by","o":["ស្ទះសរសៃឈាមក្នុងសួត (Pulmonary embolism)","កើនបរិមាណឈាម (Hypervolemia)","សម្ពាធខ្យល់ដង្ហើមវិជ្ជមាន (Positive-pressure ventilation)","ខ្យល់ចូលក្នុងសួត (Pneumothorax)","Sepsis ដោយសារពពួកមេរោគក្រាមអវិជ្ជមាន (Gram-negative sepsis)"],"a":[4]},{"i":"ec253bbf","b":"SUR","p":"A","q":"ការស្វិតសាច់ដុំនៅប្រអប់ដៃ អាចបណ្តាលមកពីរបួសសរសៃប្រសាទណា?\n(Wasting of the intrinsic muscles of the hand can be expected to follow injury of the)","o":["សរសៃប្រសាទយូណា (Ulnar nerve)","សរសៃប្រសាទរ៉ាដ្យាល់ (Radial nerve)","សរសៃប្រសាទប្រាស៊ីយ៉ាល់ (Brachial nerve)","សរសៃប្រសាទអាក់ស៊ីឡារី (Axillary nerve)","សរសៃប្រសាទតេណានិងអ៊ីប៉ូតេណា (Thenar and hypothenar nerves)"],"a":[0]},{"i":"2c3a46d1","b":"SUR","p":"A","q":"សំដៅលើការសះស្បើយរបួស តើលក្ខណៈមួយណាត្រឹមត្រូវ?","o":["កូឡាជែនទៅដល់ជាអតិបរិមា ប្រហែលជាមួយអាទិត្យក្រោយរបួស","ម៉ូណូស៊ីតដើរតួនាទីសំខាន់ក្នុងការសះស្បើយរបួសធម្មតា","ហ្វីប្រូប្លាសលេចមុខក្នុងរបួស ក្នុងចន្លោះ២៤ទៅ៣៦ម៉ាងក្រោយរបួស","តួនាទីរបស់ម៉ូណូស៊ីតក្នុងការសះស្បើយរបួសគឺ លេបនិងកំទេចមេរោគ","អត្ថិភាពនៃការសះស្បើរបួសជាដំបូងគឺជាតួនាទីរបស់សរសៃកូឡាជែនប្រភេទ១"],"a":[1]},{"i":"3bbf0088","b":"SUR","p":"A","q":"ក្នុងខណៈដែលអ្នកប្រចាំការនៅក្នុងបន្ទប់សង្គ្រោះបន្ទាន់ មានក្មេងប្រុស១២ឆ្នាំម្នាក់មកដល់ ក្នុងសភាពឈឺចាប់ និងរលាកនៅបាតជើងឆ្វេងផ្នែកខាងមុខ( over the ball of his left foot)និងស្នាមក្រហមឆ្នូតលាត សន្ធឹងឡើងលើនៅផ្នែកខាងក្នុងកំភួនជើង។ ក្មេងប្រុសចាំថាបានដករណបឈើពីបាតជើងមុននេះមួយថ្ងៃ។ តើនេះជាការករោគដោយមេរោគណា?","o":["ក្លូស្ទ្រីដ្យូមពែកហ្វ្រាំងហ្សង់ (Clostridium perfingens)","ក្លូស្ទ្រីដ្យូមតេតានី (Clostridium tetani)","ស្តាហ្វីឡូកូក (Staphylococcus)","អេស្សីរីស្សីយ៉ា (Escherichia coli)","ស្ត្រឹបតូកូក (Streptococcus)"],"a":[4]},{"i":"fd45674a","b":"SUR","p":"A","q":"ការពិពណ៌នាខាងក្រោម មួយណាគឺជាការរបួសបណ្តាសរសៃពួរនៅប្រអប់ដៃ?The true statement regarding tendon injuries in the hand is","o":["សរសៃពួរបត់ម្រាមដៃស្រទាប់រាក់ ច្បាមបញ្ចប់នៅឆ្អឹងម្រាមដៃថ្នាំងទី១ (Flexor digitorum superficially inserts on the distal phalanx)","សរសៃពួរបត់ម្រាមដៃស្រទាប់ជ្រៅ ច្បាមបញ្ចប់នៅឆ្អឹងម្រាមដៃថ្នាំងកណ្តាល (Flexor digitorum profundus inserts on the middle phalanx)","សរសៃពួរបត់ម្រាមដៃស្រទាប់រាក់ កើតចេញពីសាច់ដុំ common muscle belly (The tendons of flexor digitorum superficialis arise from a common muscle belly)","លទ្ធផលល្អបំផុតដើម្បីជួសជុលសរសៃពួរបត់ ដែលរបួសនៅក្នុង fibroosseous tunnel (zone 2)","ដំណើរការនៃការសះស្បើយរបួសសរសៃពួរគឺការកកើតដុំសាច់សរសៃពួរ (The process of healing a tendon injury involves formation of a tenoma)"],"a":[4]},{"i":"ce674f58","b":"SUR","p":"A","q":"ចំពោះករណីខាងក្រោមតើមួយណាដែលចាត់ទុកថាសម្អាតរបួសក្រខ្វក់ (ឆ្លងរោគ)","o":["កាត់ថង់ប្រម៉ាត់ ដោយសារក្រួសប្រម៉ាត់","ការវះកាត់ជម្ងឺក្លនលូន ដោយការភ្ជឹតភ្ជាប់គ្នា (mesh repair)","ការវះកាត់ដុំសាច់ដោះ ដោយកាត់សំអាតដុំសាច់ដល់ក្លៀក","វះកាត់ខ្នែងពោះវៀនដោយសារអាប់សែបិទមុខ","របួសដោយសារគ្រាប់កាំភ្លើង ប៉ះពាល់ពោះវៀនតូចនិងពោះវៀនស៊ីចម៉ា"],"a":[0]},{"i":"20eea3ff","b":"SUR","p":"A","q":"បុរសអាយុ២៥ឆ្នាំម្នាក់ត្រូវបានបញ្ជូនចូលបន្ទប់សង្រ្គោះបន្ទាន់ ក្រោយរលាកពេលភ្លើងឆេះអាគារ។ គាត់មានអាការៈ ពងទឹកនិងស្បែកឡើងក្រហម នៅមុខ, អវយវៈលើឆ្វេង និងទ្រូង និងរោលដៃស្តាំ។ គាត់ស្ថិតក្នុងអា ការៈឡេះឡះ សម្ពាធឈាមធ្លាក់ចុះ សង្វាក់បេះដូងលឿន។ តើការព្យាបាលដូចចម្លើយខាងក្រោម មួយ ណាត្រឹមត្រូវ?","o":["មិនគួរប្រើថ្នាំអង់ទីប៊ីយ៉ូទិកនឹងកន្លែង ព្រោះវានឹងជួយជម្រុញអោយការលូតលាស់របស់មេរោគដែលប្រឆាំងថ្នាំ","ចាំបាច់ត្រូវត្រូវចៀរសំអាតជាលិកាមុខនិងដៃរលាកអោយបានរហ័ស","ការវះសម្លាកគួរ អនុវត្តន៍ តែពេលណាមានរបួសសរសៃប្រសាទធ្ងន់ធ្ងរ","ចៀរសម្អាតរលាកកំរឹត៣ឬ កំរឹត២ជ្រៅ ជាទូទៅគេអនុវត្តន៍នៅថ្ងៃទី៣ ទៅទី៧ ក្រោយរលាក","ការប៉ះស្បែកចំរៀកក្រាស គួរត្រូវបានគេអនុវត្តភ្លាមលើសម្លាកកំរឹតបី ក្នុងគោលបំណងបង្ការ បាត់បង់ជាតិទឹក"],"a":[3]},{"i":"a6acadfb","b":"SUR","p":"A","q":"បុរសអាយុ២៥ឆ្នាំម្នាក់ត្រូវបាននាំចូលបន្ទប់សង្រ្គោះបន្ទាន់ក្រោយរលាកពេលភ្លើងឆេះអាគារ។ គាត់មានអាការៈ ពងទឹកនិងស្បែកឡើងក្រហម នៅមុខ, អវយវៈលើឆ្វេង និងទ្រូង ខ្លោចដៃស្តាំ។ គាត់ស្ថិតក្នុងអា ការៈឡេះឡះ សម្ពាធឈាមធ្លាក់ចុះ សង្វាក់បេះដូងលឿន។ តើលក្ខណៈខាងក្រោមមួយណាត្រឹមត្រូវចំពោះអ្នកជម្ងឺរលាកខាងលើនេះ?","o":["ប្រើថ្នាំប៉េនីស៊ីលីនកម្រឹតខ្ពស់ដើម្បីបង្ការទុកមុន","ចាក់ថ្នាំបង្ការតេតាណូសគឺមិនចាំបាច់ទេបើសិនជាអ្នកជម្ងឺបានចាក់ថ្នាំបង្ការមុននេះបីឆ្នាំ","ផ្ទៃរលាកនេះមានប្រមាណ៦០%នៃផ្ទៃសរុបដងខ្លួនដោយប្រើច្បាប់លេខ៩","អាំងឌីកាទ័រសមស្របបំផុតសម្រាប់ការបង្រ្គប់ជាតិទឹកគឺអត្រានៃសង្វាក់បេះដូង","គួរបញ្ចូលទុយយោដកដង្ហើមភ្លាមដើម្បីការពារផ្លូវដង្ហើម និងដកដង្ហើមដោយអុកស៊ីសែន"],"a":[4]},{"i":"2163e7b0","b":"SUR","p":"A","q":"តើលក្ខណៈខាងក្រោមមួយណាត្រឹមត្រូវចំពោះ carpal tunnel syndrome","o":["វាកម្រកើតមានឡើងក្រោយការប៉ះទង្គិចណាស់","វាអាចកើតមានឡើងនៅលើអ្នកមានផ្ទៃពោះ","វាច្រើនជាមូលហេតុដែលធ្វើអោយស្ពឹកក្រោយការដើរជាច្រើនម៉ោង","វាច្រើនរួមផ្សំជាមួយ ជម្ងឺសរសៃឈាម (It is often associated with vascular compromise)","ការព្យាបាលដោយការវះកាត់គឺដើម្បីរំដោះ extensor retinaculum"],"a":[1]},{"i":"23046495","b":"SUR","p":"A","q":"ការព្យាបាល leukoplakia នៅក្នុងមាត់គឺ៖","o":["គ្រប់របួសទាំងឡាយត្រូវកាត់ចេញ តាមរយៈ ឧបករណ៍ឆ្លុះ biopsy.","ប្រើអង់ទីប៊ីយ៉ូទិកនឹងកន្លែង (Application of topical antibiotics)","ព្យាបាលដោយកាំរស្មីក្នុងកម្រឹតទាប (Low-dose radiation therapy)","ជ្រើសរើសធ្មេញដាក់អោយសមស្រប (Ascertaining that dentures fit properly)","ព្យាបាលនឹងកន្លែងដោយសារធាតុគីមី"],"a":[3]},{"i":"2b74e015","b":"SUR","p":"A","q":"សំដៅលើការចុះខ្សោយក្រពេញ adrenal cortical តើការពិពណ៌នាខាងក្រោម មួយណាត្រឹមត្រូវ?","o":["ជាការព្យាបាលដោយស្តេរ៉ូអ៊ីតគឺមិនមានប្រសិទ្ធភាព","ជាធម្មតាវាជាផលវិបាកនៃការរាលដាលនៃមហារីកពីកន្លែងផ្សេង ដូចជាសួត ឬដោះ ទៅកាន់ ក្រពេញអាដ្រេណាល់","ការចុះខ្សោយក្រពេញ adrenal រ៉ាំរ៉ៃ (ជំងឺ Addison) អ្នកជំងឺមុនវះកាត់ អាចដឹងតាមរយៈសញ្ញាមួយចំនួន៖ ជាតិស្ករក្នុងឈាមខ្ពស់ សូដ្យូមមក្នុងឈាមខ្ពស់ និងប៉ូតាស្យូមក្នុងឈាមទាប (hyperglycemia, hypernatremia, and hypokalemia)","ការស្លាប់ដោយមិនបានព្យាបាលជំងឺចុះខ្សោយក្រពេញអាដ្រេណាល់រ៉ាំរ៉ៃ អាចកើតឡើងក្នុងពេលវះកាត់","មូលហេតុញឹកញាប់បំផុតក្នុងពេលបច្ចុប្បន្ន គឺករោគដោយសារ របេងរ៉េស៊ីស្តង់ថ្នាំ"],"a":[3]},{"i":"976c9606","b":"SUR","p":"A","q":"ស្រ្តីអាយុ៣៥ឆ្នាំម្នាក់បានពិនិត្យដោះដោយម៉ាមូក្រាមលើកទីមួយ។ តើរូបភាពម៉ាម៉ូក្រាហ្វិកដែលគេទទួលបានបែបណា ទើបតម្រូវអោយធ្វើប៊ីយ៉ូបស៊ីបន្តទៀត?","o":["ដុំពកក្នុងដោះមានអង្កត់ផ្ចឹតធំជាង២មីល្លីម៉ែត្រ","ចង្កោមដុំពកតូចៗក្នុងដោះមានចំនួនស្មើឬលើសពី៥ក្នុង១សង្ទីម៉ែត្រការ៉េ","ជាដុំរឹងមួយដែលអាចបាត់ទៅវិញនៅពេលសង្កត់","ដុំពកតូចៗមានរាងជាទ្រនាប់ (Saucer-shaped microcalcifications)","ដុំពកដោះរឹងមិនស្មើសាច់ជាច្រើន (Multiple round well-circumscribed breast densities)"],"a":[1]},{"i":"f3035128","b":"SUR","p":"A","q":"រោគវិនិ្នច្ឆ័យ ជំងឺកើនមុខងារក្រពេញប៉ារ៉ាទីរ៉ូអ៊ីត ដោយឯកឯង (primary hyperparathyroidism)?","o":["សេរ៉ូមអាស៊ីតហ្វូសហ្វាតាសលើសពី 120 IU/L","សេរ៉ូមអាល់កាលីនលើសពី 120 IU/L","សេរ៉ូមកាល់ស្យូមលើសពី 11 mg/dL","កាល់ស្យូមក្នុងទឹកនោមក្រោម 100 mg/day","កំរិតអ័រម៉ូនប៉ារ៉ាទីរ៉ូអ៊ីតក្រោម 5 pmol/L"],"a":[2]},{"i":"871a5e3e","b":"SUR","p":"A","q":"តើគេផ្តល់សូម៉ាតូស្តាទីន (Somatostatin) នៅក្នុងទម្រង់ការណាមួយ","o":["រារាំង(Inhibition)កោសិកាអាដ្រេណូគ័រទីកាល់","រារាំង(Inhibition) កោសិកាអាល់ហ្វានៃលំពែង","ភ្ញោច (Stimulation) កោសិកា antral gastrin ក្រពះ","រំញោច (Stimulation) ការបញ្ចេញនៃកោសិកាក្នុងផ្នែកដើមពោះវៀនតូច (duodenum)","ភ្ញោចចលនាផ្លូវរំលាយអាហារ"],"a":[1]},{"i":"500068d4","b":"SUR","p":"A","q":"តើការអធិប្បាយខាងក្រោម មួយណាត្រឹមត្រូវ សំដៅលើ Cushing syndrome secondary to adrenal adenoma?","o":["40–60% នៃ Cushing syndrome ទាំងអស់ បណ្តាលមកពី Adrenal adenomas","ជាទូទៅការព្យាបាល lateralizing the tumors មុនវះកាត់ដោយទម្រង់ការគីមីជីវៈ និង កាំរស្មីអ៊ិច មិនទទួលបានជោគជ័យទេ","ត្រូវធ្វើការត្រួតពិនិត្យក្រពេញអាដ្រេណាល់ទាំងសងខាង","ចំពោះដុំពកធម្មតា (មិនស្មុគស្មាញ) ការវះកាត់បើកពោះត្រូវបានគេអនុវត្តជាទូទៅ","ការព្យាបាលក្រោយវះកាត់ ដោយប្រើគ័រទីកូអ៊ីត គឺដើម្បីបង្ការការចុះខ្សោយមុខងារអាដ្រេណាលីន"],"a":[4]},{"i":"3baefaa4","b":"SUR","p":"A","q":"ស្រ្តីអាយុ៤០ឆ្នាំម្នាក់មានដុំគីស១ទៅ២សង្ទីម៉ែត្រនៅក្នុងដោះ ។ មិនឃើញមានហើមកូនកណ្តុរនៅក្លៀក ទេ។ តើគេត្រូវតាមដានអ្វីបន្តទៀត?","o":["ត្រូវពិនិត្យឡើងវិញ​ភ្លាមក្រោយពេលអស់រដូវ","ត្រូវកាត់យកដុំគីសទៅពិនិត្យកោសិកាភ្លាម","ត្រូវបូមយកដុំគីសទៅវិភាគកោសិកា","ធ្វើហ្ល្វុយអ័រស្កូពី (Fluoroscopically) ដោយប្រើម្ជុលនាំផ្លូវនៅនឹងកន្លែងដើម្បីពិនិត្យកោសិកា","ថតដោះដោយម៉ាម៉ូក្រាហ្វី និងវាយតម្លៃឡើងវិញក្រោយទទួលបានលទ្ធផល"],"a":[2]},{"i":"503b63ff","b":"SUR","p":"A","q":"សំដៅលើ papillary carcinoma នៃក្រពេញទីរ៉ូអ៊ីត តើការអធិប្បាយខាងក្រោមមួយណាត្រឹមត្រូវ ជាងគេបំផុត?","o":["ការរាលដាលទៅសរីរាង្គផ្សេងទៀតមានដោយកម្រ ការរីកធំនៅនឹងកន្លែងគឺលឿន ការស៊ីចូលទៅក្នុងបំពង់ខ្យល់ និង រីកសរសៃឈាមតែងកើតមានជានិច្ច","ការសង្កត់និងរាលដាលទៅសរីរាង្គផ្សេងទៀតមិនអាចកើតមានឡើយ ដែលបង្កើតជាពាក្យ កាកស៊ីណូម៉ាក្លែងក្លាយ (carcinoma misleading)","ការរាលដាលចូលទៅក្នុងឆ្អឹង ជួបប្រទះញឹកញាប់ និងក្លាយទៅជាការបំផ្លាញឆ្អឹង ជាពិសេស ឆ្អឹងកង។","វាច្រើនតែរាលដាលទៅក្នុងកូនកណ្តុរនៅក ទៅឆ្ងាយជាងនេះ និងរាលដាលទៅក្បែរខាង មានដោយកម្រ។","ការរាលដាលយ៉ាងឆាប់រហ័ស ទៅបណ្តាសរីរាង្គដូចជា៖ថ្លើម សួត និងខួរឆ្អឹង អត្រាអ្នកអាច រស់បាន៥ឆ្នាំ មានប្រហែល១០%។"],"a":[3]},{"i":"17f90401","b":"SUR","p":"A","q":"បើសិនជាគេថត CT scanពោះផ្នែកខាងលើ រកឃើញដុំម៉ាស់៣សង្ទីម៉ែត្រនៅក្នុងក្រពេញអាដ្រេណាល់ដោយចៃដន្យ។ តើជំហ៊ានបន្ទាប់នៃការវិភាគនិងការព្យាបាល គេធ្វើអ្វីសមស្របជាងគេ?","o":["ពិនិត្យបន្ថែម (Observation)","ធ្វើ ប៊ីយ៉ូបស៊ី តាមស៊ីធីស្កែនដោយម្ជុលនាំផ្លូវ (CT-guided needle biopsy)","កាត់ដុំម៉ាស់ចេញ (Excision of the mass)","វាស់ការបញ្ចេញកាតេកូឡាមីនក្នុងទឹកនោម","ធ្វើតេស្តគ័រទីសុល (Cortisol provocation test)"],"a":[0]},{"i":"1ecca66c","b":"SUR","p":"A","q":"ស្រ្តីម្នាក់បានជួបគ្រោះថ្នាក់ របួសនៅដើមទ្រូង ដោយបុកនឹងចង្កូតរថយន្ត ។ ទាក់ទងនឹងការរលួយជាលិកាខ្លាញ់នៃដោះ ( fat necrosis of the breast) របស់គាត់ តើការអធិប្បាយខាងក្រោមមួយណាត្រឹមត្រូវ?","o":["ស្ទើរទាំងអស់នៃអ្នកជំងឺ មានប្រវត្តិប៉ះទង្គិច","របួសជាទូទៅ​មិនឈឺចាប់ និងរលាយទៅវិញ","វាជាឪកាស ក្លាយជាមហារីកដោះ","វាពិបាកក្នុងការបែងចែកអោយដាច់ពី (ឬអោយប្រាកដថា) មហារីកដោះណាស់","អនុវត្តទម្រង់ការកាត់យកចេញ (Excision exacerbates the process)"],"a":[3]},{"i":"33d6a423","b":"SUR","p":"A","q":"ការធ្វើរោគវិន្និច្ឆ័យត្រឹមត្រូវបំផុតចំពោះអ្នកជំងឺម្នាក់ដែលមាន៖ លើសឈាម, hypo kalemia និងមានដុំពកខាងលើតម្រងនោមទំហំ៧សង្ទីម៉ែត្រគឺ៖","o":["Hypernephroma","Cushing’s disease","Adrenocortical carcinoma","Pheochromocytoma","Carcinoid"],"a":[2]},{"i":"ce67273d","b":"SUR","p":"A","q":"សំដៅលើជំងឺ Pagetតើការអធិប្បាយខាងក្រោមមួយណាត្រឹមត្រូវ?","o":["ជាទូទៅ នឹងក្លាយទៅជាជំងឺ Paget នៃឆ្អឹង។","មានវត្តមានជាមួយជំងឺត្រអកជុំវិញក្បាលដោះ (nipple-areolar eczematous changes)","មិនមានហើមកូនកណ្តុរនៅក្លៀកទេព្រោះ វាជាគ្រាន់តែជារោគសញ្ញា intraductal carcinoma នៃប៉ុណ្ណោះ។","មានចំនួន១០ទៅ១៥% នៃមហារីកដោះថ្មីត្រូវបានគេធ្វើរោគវិន្និច្ឆ័យឃើញ","ក្នុងពេលដែលមានវត្តមានជាដុំម៉ាស់ ការព្យាបាលដ៏ត្រឹមត្រូវបំផុតគឺវះកាត់ដ៏ទូលាយ១។"],"a":[1]},{"i":"56181176","b":"SUR","p":"A","q":"បុរសអាយុ៤០ឆ្នាំម្នាក់មានប្រវត្តិជំងឺរលាកក្រពះជាយូរមកហើយ ការព្យាបាលដោយថ្នាំមិនបានគាប់ប្រសើឡើងទេ ទើបគាត់ចូលសំរាកព្យាបាលនៅក្នុងមន្ទីរពេទ្យ។ កំរិតសេរ៉ូមហ្គាស្រ្តីន កើនឡើងគួរអោយកត់សម្គាល់ ។ តាមរយៈ ការវះបើកពោះឃើញមានដុំម៉ាស់តូចមួយស្ទាបឃើញនៅកន្ទុយលំពែង ។ ការអធិប្បាយខាងក្រោមមួយណាត្រឹមត្រូវ ទាក់ទងនឹងសភាពអ្នកជំងឺ?","o":["ហីស្តាមីនឬអាហារប្រូតេអ៊ីននឹងធ្វើអោយកើនការបញ្ចេញអាស៊ីត","ការចាក់បញ្ចូលសេក្រេទីន អាចទប់ស្កាត់ការបញ្ចេញអាស៊ីត","ដុំម៉ាស់លំពែងប្រហែលជាទើបចាប់ផ្តើម","ការកាត់ផ្នែកខាងចុងលំពែង ជាជម្រើសនៃការព្យាបាល","H2 receptor antagonists មិនបានផលចំណេញអ្វី ពីការព្យាបាលសភាពនេះទេ"],"a":[3]},{"i":"7fbd5f64","b":"SUR","p":"A","q":"ផលវិបាកជាទូទៅនៃការកាត់ក្រពេញទីរ៉ូអ៊ីត មានផលវិបាកមួយដែលគួរបង្ការគឺ៖","o":["របួសសរសៃ recurrent laryngeal nerve","របួសសរសៃ superior laryngeal nerve","ចង្កោមរោគសញ្ញានៃកំរិតកាល់ស្យូមក្នុងឈាមចុះទាប","ក្រពេញទីរ៉ូអ៊ីតកាន់តែធ្ងន់ធ្ងរឡើង (Thyroid storm)","ហូរឈាមក្រោយវះកាត់និងកកឈាមក្នុងរបួស"],"a":[3]},{"i":"950ee08a","b":"SUR","p":"A","q":"ក្រោយការកែតម្រូវអ្នកជំងឺម្នាក់ដែលមានកម្រិតកាល់ស្យូមក្នុងឈាមខ្ពស់ (hypercalcemia) តាម រយៈការបំពេញជាតិទឹក និងបញ្ចុះ ទឹកនោមតិចតួចដោយ (furosemide)តើការព្យាបាលដ៏ត្រឹមត្រូវបំផុតគឺ","o":["ចាក់ដោយស្តេរ៉ូអ៊ីតក្នុងកម្រិតបរិមាណថេរ","ព្យាបាលដោយកាំរស្មីចំពោះការរាលដាលទៅក្នុងឆ្អឹង","កាត់៣/៤នៃក្រពេញប៉ារ៉ាទីរ៉ូអ៊ីត","វះកនិងកាត់អាដេណូមក្រពេញប៉ារ៉ាទីរ៉ូអ៊ីត (parathyroid adenoma)","ចៀសវាងត្រូវពន្លឺថ្ងៃ, តម វីតាមីនដេ និង អាហារធ្វើពីផលិតផលទឹកដោះ"],"a":[3]},{"i":"2ea81078","b":"SUR","p":"A","q":"ស្រ្តីអាយុ៣៦ឆ្នាំម្នាក់ មានដុំម៉ាស់ទំហំ១.៥សង្ទីម៉ែត្រនៅក្រពេញទីរ៉ូអ៊ីតខាងស្តាំ។ ការវិភាគលើសារធាតុដ ានដំបូងដោយចោះដាក់ទ្វារលាមកសិប្បនិម្មិត","ការធ្វើរោគវិន្និច្ឆ័យត្រឹមត្រូវបំផុតនៅលើទារកទើបកើតដោយបារីយ៉ូមអេនីម៉ា(BE)","លក្ខណៈរបស់វាគឺ មិនមានកូនកណ្តុរនៅលើពោះវៀនធំទទឹង","វារួមផ្សំការកើនឡើងជំងឺថ្មី នៃភាពមិនធម្មតារបស់ ផ្លូវបន្តពូជនិងម៉ូត្រ","ជាជំងឺពីកំណើតដែលជួបប្រទះញឹកញាប់បំផុត ធ្វើអោយការបន្ទោរបង់មិនដឹងខ្លួន"],"a":[0]},{"i":"cf288955","b":"SUR","p":"A","q":"ភាពខុសធម្មតានៃជញ្ជាំងពោះពីកំណើតខាងក្រោមនេះ ជាទូទៅតើមួយណាដែលបាត់ទៅវិញដោយឯកឯងនៅអាយុ ៤ឆ្នាំ","o":["ក្លនលូននៅផ្ចឹត (Umbilical hernia)","Patent urachus","Patent omphalomesenteric duct","Omphalocele","Gastroschisis"],"a":[0]},{"i":"20961423","b":"SUR","p":"A","q":"ការកាត់ថង់ប្រម៉ាត់តាមរយៈអង់ដូស្កូប ត្រូវបានគេអនុវត្តចំពោះករណីចង្កោមរោគសញ្ញាក្រួសផ្លូវប្រម៉ាត់ ក្នុងលក្ខខ័ណ្ឌមួយណាក្នុងចំណោមខាងក្រោម","o":["ក្រឹនថ្លើម (Cirrhosis)","អត្ថិភាពវះកាត់ពោះខាងលើ (Prior upper abdominal surgery)","សង្ស័យថាមានមហារីកថង់ប្រម៉ាត់ ( Suspected carcinoma of the gall bladder)","ជំងឺធាត់ (Morbid obesity)","ជំងឺឈាមកក (Coagulopathy)"],"a":[3]},{"i":"5f8fb6be","b":"SUR","p":"A","q":"កុមារដែលមាន ទ្វារលាមក ខុសធម្មតាពីកំណើត (anorectal anomalies) មានទំនោរធ្វើអោយមានសរីរាង្គផ្សេងទៀតខុសធម្មតាដែរ។ តើភាពខុសធម្មតាមួយណាក្នុងចំណោមខាងក្រោម?","o":["ភាពខុសធម្មតានៃឆ្អឹងកងក (Abnormalities of the cervical spine)","ទឹកក្នុងខួរក្បាល (Hydrocephalus)","ចង្អៀតឌុយអូដឺណូម (Duodenal atresia)","ជំងឺបេះដូង (Heart disease)","ល្អក់កែវភ្នែក (Corneal opacities)"],"a":[3]},{"i":"9a353670","b":"SUR","p":"A","q":"ស្រ្តីអាយុ៤៨ឆ្នាំម្នាក់ ស្រាប់តែឈឺចាប់នៅតំបន់ខាងក្រោមនិងខាងស្តាំនៃពោះ ក្នុងខណៈកំពុងលេងតឺនីស។ ការឈឺចាប់កាន់តែខ្លាំងឡើង ១ថ្ងៃក្រោយមកគាត់ត្រូវបានបញ្ជូនទៅបន្ទប់សង្រ្គោះបន្ទាន់ ដោយសារក្តៅខ្លួនតិចតួច គ្រាប់ឈាមស ១៣.០០០ និងត្អូញធំអាហារ ចង់ក្អួតជាប្រចាំ ឈឺ ដូចគេចាក់នឹងកាំបិតនៅតំបន់ផ្នែកក្រោមនិងស្តាំនៃពោះ។ ការពិនិត្យឃើញ គាត់មានការឈឺចាប់នៅ តំបន់ផ្នែកក្រោមនិងស្តាំនៃពោះ ជាមួយនឹងការកន្រ្តាក់សាច់ដុំ ដែលនេះបណ្តាលមកពីម៉ាស់ មួយ។ អ៊ុលត្រាសោន ឃើញមានដុំម៉ាស់មួយនៅជញ្ជាំងពោះ។ តើក្នុងចំណោមរោគវិន្និច្ឆ័យខាងក្រោមនេះមួយណាដែលទំនងជាត្រឹមត្រូវជាងគេ","o":["រលាកខ្នែងពោះវៀនស្រួចស្រាល់ (Acute appendicitis)","មហារ ់","ប្រភេទសាមញ្ញបំផុតកើតឡើងនៅកន្លែងភ្ជាប់គ្នារវាងពោះវៀនធំចុះនិងពោះវៀនស៊ិចម៉ា"],"a":[1]},{"i":"5c130231","b":"SUR","p":"A","q":"ស្រ្តីអាយុ៣២ឆ្នាំម្នាក់ចូលមន្ទីរពេទ្យ ដោយសារមុននេះ២៤ម៉ោង មានចុកពោះនៅម្តុំខាងក្រោមនិងខាងស្តាំពោះ។ គាត់បានវះកាត់រលាកខ្នែងពោះវៀន និងចេញទៅផ្ទះបួនថ្ងៃហើយ ។ នៅខាងចុងខ្នែងពោះវៀនមានដុំសាច់(carcinoid tumor) ប៉ុនទំហំ១.២សង្ទីម៉ែត្រ។ តើការពណ៌នាខាងក្រោមមួយណាត្រឹមត្រូវ?","o":["អ្នកជំងឺគួរទទួលការណែនាំអោយ វះកាត់ ចុងពោះវៀនតូច-ដើមពោះវៀនធំ (ileocolectomy)","ទីតាំងច្រើនជួបប្រទះបំផុតនៃ carcinoids គឺខ្នែងពោះវៀន","ជាងពាក់កណ្តាល នៃអ្នកជំងឺ carcinoid tumors មានចង្កោមរោគសញ្ញា carcinoma","ដុំពកជា apudoma (The tumor is an apudoma)","បណ្តុំរោគសញ្ញា carcinoma ហាក់កើតឡើងតាមការរាលដាលតាមប្រព័ន្ធវ៉ែនព័កប៉ុណ្ណោះ"],"a":[3]},{"i":"c19a3c2c","b":"SUR","p":"A","q":"តើការពិពណ៌នាខាងក្រោមមួយណាត្រឹមត្រូវសំដៅលើក្លនលូន (direct inguinal hernia) ដោយផ្ទាល់?","o":["វាកើតឡើងច្រើនបំផុតនៅលើស្រ្តី","វាលូនចេញនៅខាងក្នុងប្រព័ន្ធសរសៃឈាមអេពីហ្គាសស្រ្តីកក្រោម","វាអាចត្រូវបានបើកនិងចងនៅមាត់ខាងក្នុង (They should be opened and ligated at the internal ring)","ជាទូទៅវាលូនចូលទៅក្នុងថង់ស្រោមពងស្វាសនៃបុរស","ជាទូទៅការលូនចូលត្រូវ ជាប់គាំងច្រើនជាងក្លនលូនដោយប្រយោល"],"a":[1]},{"i":"3e4cfb0f","b":"SUR","p":"A","q":"តើការពិពណ៌នាខាងក្រោមមួយណាត្រឹមត្រូវសំដៅលើ stress ulceration?","o":["វាជាដំបៅ ពិតប្រាកដរាលចូលទៅក្នុងសាច់ដុំនិងភ្នាស","ជាទូទៅវាច្រើនកើតនៅ antrum នៃក្រពះ","ការកើនឡើងនៃការបញ្ចេញអាស៊ីតក្រពះត្រូវបានគេចាត់ទុកថាជាមូលហេតុរបស់វា","វាកើតឡើងច្រើនកន្លែង","វាដូចជាកើតឡើងក្រោយ ស្ហុកនិងសិបស៊ីស តែមួយចំនួនមិនដឹងមូលហេតុ ក្រោយការវះកាត់ធំ ការប៉ះទង្គិច ឬ រលាក។"],"a":[3]},{"i":"9323a67a","b":"SUR","p":"A","q":"តើការពិពណ៌នាខាងក្រោមមួយណាត្រឹមត្រូវទាក់ទងនឹងការរលាកផ្លូវប្រម៉ាត់ ( cholangitis)","o":["មេរោគដែលតែងបង្កជំងឺញឹកញាប់ជាងគេគឺ Staphylococcus aureus","រោគវិន្និច្ឆ័យត្រូវបានធ្វើឡើងតាមរបៀប Charcot triad","ជំងឺកើតឡើងដំបូងពេលនៅក្មេង អ្នកជំងឺមានប្រព័ន្ធភាពស៊ាំខ្សោយ","ការកាត់ថង់ប្រម៉ាត់ជាជម្រើសសម្រាប់អ្នកជំងឺនេះ","ការវះកាត់ជាករណីតែមួយគត់ដែលត្រូវអនុវត្ត ក្រោយធ្វើរោគវិន្និច្ឆ័យថារលាកផ្លូវប្រម៉ាត់"],"a":[1]},{"i":"0a8f840e","b":"SUR","p":"A","q":"បុរសអាយុ៨៨ឆ្នាំម្នាក់ មានប្រវត្តិខ្សោយតម្រងនោមតំណាក់កាលចុងក្រោយ ជំងឺសរសៃឈាមបេះដូងធ្ងន់ធ្ងរ និងការរាលដាលមហារីកសួតទៅខួរក្បាល បច្ចុប្បន្នមានជំងឺរលាកថង់ប្រម៉ាត់ស្រួច ស្រាវ។ ក្រុមគ្រួសារចង់ព្យាបាលគាត់ ។ តើគួរជ្រើសរើសការព្យាបាលមួយណា","o":["ចោះថង់ប្រម៉ាត់ (Tube cholecystostomy)","វះកាត់ថង់ប្រម៉ាត់ (Open cholecystectomy)","កាត់ថង់ប្រម៉ាត់តាមរយៈអង់ដូស្កូប (Laparoscopic cholecystectomy)","អង់ទីប៊ីយ៉ូទិកតាមសរសៃវ៉ែនបន្ទាប់មកជ្រើសរើសការកាត់ថង់ប្រម៉ាត់","បំបែកក្រួសប្រម៉ាត់រួច ព្យាបាលដោយអាស៊ីតប្រម៉ាត់រយៈពេលវែង"],"a":[0]},{"i":"3075dc0c","b":"SUR","p":"A","q":"របួស Dieulafoyនៅក្រពះ មានលក្ខណៈដូចខាងក្រោម","o":["របួសយ៉ាងធំនៅភ្នាសនិងស្រទាប់ក្រោម, ប្រព័ន្ធសរសៃឈាមផុយស្រួយ","តែងតែហូរឈាមឡើងវិញ ក្រោយព្យាបាលដោយអង់ដូស្កូប","មានហូរឈាមឈាមច្រើនដែលតម្រូវអោយកាត់ក្រពះ១ភាគធំ","ទីតាំងរបស់វាស្ថិតនៅផ្នែកខាងលើនៃក្រពះ","មានការប្រែប្រួលអាស៊ីត-ប៉ិបទីតនៅភ្នាសក្រពះ"],"a":[3]},{"i":"71f56aaa","b":"SUR","p":"A","q":"ក្នុងពេលធ្វើការវះកាត់រលាកខ្នែងពោះវៀនស្រួចស្រាវ គេបានរកឃើញដុំម៉ាស់មួយទំហំ ៤សង្ទីម៉ែត្រនៅផ្នែកកណ្តាលនៃខ្នែងពោះវៀន ។ ការកាត់ពិនិត្យភ្លាមៗ វាជាដុំសាច់ (carcinoid tumor) ។ តើការព៌ណនាខាងក្រោមមួយណាត្រឹមត្រូវ?","o":["ជាករណីមិនត្រូវវះកាត់","ការកាត់មួយកំណាត់ខាងស្តាំនៃពោះវៀនធំ គួរបានត្រូវគេអនុវត្ត","៥០%នៃករណីនេះ នឹងវិវត្តន៍ទៅជា ចង្កោមរោគសញ្ញា កាកស៊ីណ័យទេ (carcinoid syndrome)","ដុំសាច់កាកស៊ីណ័យ (Carcinoid tumors) រីកធំឡើងចេញពីកោសិកា islet","ចង្កោមរោគសញ្ញា កាកស៊ីណ័យ (carcinoid syndrome) អាចកើតឡើងតែក្នុងករណីមាន ការរាលដាលនៃមហារីកថ្លើមប៉ុណ្ណោះ។"],"a":[1]},{"i":"10f4fd06","b":"SUR","p":"A","q":"តើការពិពណ៌នាខាងក្រោមមួយណាត្រឹមត្រូវទាក់ទងនឹង​ rectal carcinoid tumors","o":["ការកាត់តាមអង់ដូស្កូប អាចធ្វើបានក្នុងករណីដុំសាច់តូចជាង២សង្ទីម៉ែត្រ","អ្នកជំងឺតែងមានចង្កោមរោគសញ្ញា carcinoid syndrome","ដុំសាច់រីកធំយ៉ាងលឿន","ការកើតឡើងវិញនៅនឹងកន្លែង គឺមានដោយកម្រក្រោយការវះកាត់ទាំងស្រុងលើកទីមួយ","វាអាចក្លាយជា carcinoid syndrome ពេលអវត្តមាននៃ ការរាលដាលទៅថ្លើម"],"a":[3]},{"i":"b1f4c0a9","b":"SUR","p":"A","q":"ការវះកាត់ប៉ូលីពក្នុងថង់ប្រម៉ាត់ត្រូវបានគេអនុវត្តក្នុងករណីមួយណា?","o":["ទំហំធំជាង០.៥សង្ទីម៉ែត្រ","មានលេចចេញរោគសញ្ញាគ្លីនីក","អ្នកជំងឺមានអាយុលើសពី២៥ឆ្នាំ","មានវត្តមានប៉ូលីពតូចៗជាច្រើន","មិនអាចមើលឃើញដោយអ៊ុលត្រាសោន"],"a":[1]},{"i":"2a58a956","b":"SUR","p":"A","q":"អ្នកជំងឺដែលបានកាត់លំពែងទាំងស្រុងអាចមានផលវិបាកអ្វី","o":["ទឹកនោមផ្អែមប្រភេទទីមួយ (Diabetes mellitus)","កំរិតកាល់ស្យូមក្នុងឈាមកើនខ្ពស់ (Hypercalcemia)","កំរិតហ្វូស្វ័រក្នុងឈាមកើនខ្ពស់ (Hyperphosphatemia)","ទល់លាមក (Constipation)","ឡើងទម្ងន់ (Weight gain)"],"a":[0]},{"i":"175e730d","b":"SUR","p":"A","q":"ស្រ្តីអាយុ២៨ឆ្នាំម្នាក់ ពីមុនមានសុខភាពល្អ ចូលមកបន្ទប់សង្រ្គោះបន្ទាន់ ដោយសារមុននេះ២៤ម៉ោងមានអាការៈ ធំអាហារ និងចង្អោរ ឈឺចាប់នៅផ្នែកខាងក្រោមពោះ និងឈឺខ្លាំងជាងគេនៅតំបន់ខាងក្រោមនិងខាងស្តាំពោះ។ ពិនិត្យឃើញមានសញ្ញាស្រោមពោះនៅតំបន់ខាងក្រោមនិងខាងស្តាំពោះ សីតុណ្ហភាពក្នុងទ្វារលាមក៣៨.៣៨អង្សាសេ។ វះកាត់បើកពោះនៅតំបន់ខាងក្រោមនិងខាងស្តាំឃើញមានរន្ធធ្លាយតូចមួយនៃថង់តូចមួយរបស់ដើមពោះវៀនធំ (cecal diverticulum)។ តើការអធិប្បាយខាងក្រោមមួយណាត្រឹមត្រូវចំពោះសភាពខាងលើ","o":["Cecal diverticula ជាមូលហេតុនៃការធ្លាយ","Cecal diverticula ជាទូទៅមានចំនួនច្រើន","Cecal diverticula ជាក្លនលូនភ្នាសដែលលូនចូលទៅក្នុងសាច់ដុំ","Diverticulectomy បិទដើមពោះវៀនធំ និង កាត់ខ្នែងពោះវៀន អាចជាករណីត្រូវអនុវត្ត","ileocolectomy ជាករណីត្រូវអនុវត្ត ពេលមានការរលាកនៅនឹងកន្លែង"],"a":[3]},{"i":"bd0eed73","b":"SUR","p":"A","q":"ការពណ៌នាខាងក្រោមមួយណាត្រឹមត្រូវទាក់ទងនឹង cavernous hemangiomata នៅថ្លើមមនុស្សពេញវ័យ?","o":["ភាគធំក្លាយជាចង្កោមរោគសញ្ញា","វាអាចក្លាយជាកាច","វារីកធំក្រោមការភ្ញោចរបស់អ័រម៉ូន","វាគួរតែកាត់ចេញដើម្បីចៀសវាងការធ្លុះធ្លាយដោយខ្លួនឯងនិងហូរឈាមគ្រោះថ្នាក់ដល់ជីវិត","ការថតស្កែន radionucleotide ថ្លើមអណ្តើកជាមធ្យោបាយធ្វើរោគវិន្និច្ឆ័យល្អបំផុត"],"a":[2]},{"i":"3cde5a23","b":"SUR","p":"A","q":"អ្នកជំងឺ៧២ឆ្នាំម្នាក់មានជំងឺដំបៅប្រភេទទី១ តាមបណ្តោយ incisura និងមានសំឡាកជាក់លាក់មួយចំនួនតាមបណ្តោយកំណោងតូចក្រពះ។ ជ្រើសរើសទម្រង់ការវះកាត់មួយសមស្របសម្រាប់អ្នកជំងឺខាងលើ?","o":["កាត់សរសៃ Vagus និង កាត់ផ្នែកក្រោមក្រពះ (Vagotomy and antrectomy)","កាត់តែផ្នែកក្រោមក្រពះក្រពះប៉ុណ្ណោះ (Antrectomy alone)","កាត់សរសៃ Vagus និង បង្កើតពីល័រថ្មី (Vagotomy and pyloroplasty)","កាត់សរសៃ Vagus និង ភ្ជាប់ក្រពះជាមួយផ្នែកកណ្តា  (Foramen of Morgagni hernia)"],"a":[3]},{"i":"bb86c00b","b":"SUR","p":"A","q":"ក្លនលូន (hernia) អាចជាមូលហេតុធ្វើអោយ respiratory distress ស្រួចស្រាល់ លើកុមារ ។ តើការពិពណ៌នាភាពខុសធម្មតាខាងក្រោមមួយណាត្រឹមត្រូវ","o":["របួសខ្ទាំសាច់ដុំសន្ទះទ្រូង (Rupture of the diaphragm)","ក្លនលូនបំពង់អាហារនៃសាច់ដុំសន្ទះទ្រូង (Paraesophageal hiatal hernia)","ក្លនលូនចុះឡើងនៃសាច់ដុំសន្ទះទ្រូង (Sliding hiatal hernia)","ប្រហោងក្លនលូន Bochdalek (Foramen of Bochdalek hernia)","ប្រហោងក្លនលូន Morgagni (Foramen of Morgagni hernia)"],"a":[3]},{"i":"313620c4","b":"SUR","p":"A","q":"ការព្យាបាលដំបូងចំពោះអ្នកជំងឺដែលចុះខ្សោយប្រព័ន្ធប្រសាទប្លោកនោម គឺវិធានការមួយណាក្នុងចំណោមចម្លើយខាងក្រោម?","o":["វះកាត់បង្កើនទំហំប្លោកនោម","ដាក់កាដឺទែរដោយខ្លួនឯង (Self-catheterization)","បង្វែរបង្ហួរនោមទៅខាងលើប្លោកនោម","កំរិតបរិមាណសារធាតុរាវចូល ត្រូវតិចជាង៣០០មីល្លីលីត្រក្នុងមួយថ្ងៃ","កាត់បង្ហួរនោមនៅកប្លោកនោម"],"a":[1]},{"i":"3d66d0f6","b":"SUR","p":"A","q":"ការអធិប្បាយខាងក្រោមមួយណាត្រឹមត្រូវចំពោះ hypospadias?","o":["ច្រើនមានរួមផ្សំជាមួយ កំណោងខាងពោះនៃលឹង្គ (chordee)","ច្រើនជាង៥០%ករណី កើតឡើងជាមួយពងស្វាសមិនចុះក្រោម","ការភ្ជឹតមុខរន្ធនោមនៅខាងខ្នងលឹង្គមានដោយកម្រ","ជាជម្ងឺកើតឡើងម្តងម្កាល មិនមានភស្តុតាងណាបញ្ជាក់ថាជាជម្ងឺតំណពូជទេ","ភាគច្រើនកើតនៅចន្លោះ លឹង្គនិងស្រ្កូតូម ( The most common location is penoscrotal)"],"a":[0]},{"i":"40cb7cdf","b":"SUR","p":"A","q":"ដំបូន្មានចំពោះការព្យាបាលមហារីកប្លោកនោមដំណាក់កាល A (នៅរាក់និងក្រោមភ្នាស) គឺ៖","o":["កាត់នៅនឹងកន្លែង","កាត់ដល់គល់ប្លោកនោម","ព្យាបាលដោយកាំរស្មី","ព្យាបាលដោយសារធាតុគីមីនឹងកន្លែង","ព្យាបាលដោយសារធាតុគីមីជាប្រព័ន្ធ"],"a":[3]},{"i":"1a8d72a9","b":"SUR","p":"A","q":"បុរសអាយុ៣៦ឆ្នាំម្នាក់ ត្រូវបានបញ្ជូនមកកាន់បន្ទប់សង្រ្គោះបន្ទាន់ ដោយសារការចុកចាប់នៅតំបន់ កណ្ឌៀតក្អម (renal colic)។ កាំរស្មីអ៊ិចបង្ហាញថាមានក្រួសទំហំ ១.៥សង្ទីម៉ែត្រ ។ តើការពិពណ៌នាខាងក្រោម មួយណាត្រឹមត្រូវ?","o":["ព្យាបាលដោយមិនវះកាត់ដូចជាបង្រ្គប់ជាតិទឹកនិងបន្ថយការឈឺចាប់ មិនទទួលបានលទ្ធផលគាប់ប្រសើរទេ","គួរធ្វើការថតកាំរស្មីអ៊ិចបន្តគ្នានៅតម្រងនោម បង្ហូរនោម ប្លោកនោម (KUB)","ស្ទើរគ្រប់ការវិភាគទឹកនោមទាំងអស់នឹងបង្ហាញថាមានឈាមក្នុងទឹកនោម(microhematuria)","ក្នុងពេលដែលរោគសញ្ញាទាំងឡាយត្រូវបានព្យាបាល ជំងឺនេះកម្រកើតឡើងវិញណាស់","មានការកើនឡើងសារធាតុនីត្រូសែននិងក្រេអាទីនីន"],"a":[0]},{"i":"6e947d63","b":"SUR","p":"A","q":"ការព្យាបាលដ៏ត្រឹមត្រូវ នៃការមិនចុះក្រោមរបស់ពងស្វាសទាំងសងខាងលើកុមារ (bilateral undescended testicles)គឺ?","o":["វះកាត់ភ្លាមដើម្បីយកវាចុះទៅក្នុងថង់ពងស្វាស","ព្យាបាលដោយ Chorionic gonadotropin មួយខែ មុនអាយុ១ខួប បើវាមិនទាន់ចុះ វះកាត់យកវាចុះទៅក្នុងថង់ពងស្វាស","តាមដានរហូតដល់អាយុ២ឆ្នាំ ព្រោះជាទូទៅវាមិនទាន់ចុះភ្លាម","តាមដានរហូតដល់អាយុ៥ឆ្នាំ បើមិនទាន់ចុះដោយខ្លួនឯង វះកាត់បង្កើតថង់ពងស្វាសមុនអាយុចូលសាលារៀន","មិនចាំបាច់ព្យាបាល ធានាចំពោះឪពុកម្តាយថានឹងមានសាច់ដុំចូលបំពេញនិងមានការបង្កើតមេជីវិត ទោះបីពងស្វាសមិនចុះក្រោមក៏ដោយ"],"a":[1]},{"i":"2a70d258","b":"SUR","p":"A","q":"ចម្លើយខាងក្រោម តើការពណ៌នាមួយណាត្រឹមត្រូវ ចំពោះ Seminoma","o":["វាជាប្រភេទមហារីកពងស្វាសដែលតែងជួបប្រទះញឹកញាប់បំផុត","ជាញឹកញាប់គេឃើញវារាលដាលទៅថ្លើមនិងឆ្អឹង","ការព្យាបាលដោយកាំរស្មី មិនកបឡើយ","អត្រារស់ក្រោយអាយុ៥ឆ្នាំមាន៥០%","ច្រើនបង្ហាញថាមានការឈឺចាប់អវយវៈពេលពិនិត្យដោយពន្លឺឆ្លងកាត់ជាលិកា"],"a":[0]},{"i":"8f9867ee","b":"SUR","p":"A","q":"ក្មេងប្រុសអាយុ១០ឆ្នាំម្នាក់ត្រូវបាននាំចូលបន្ទប់សង្រ្គោះបន្ទាន់ ដោយសារការឈឺចាប់ នៅពង ស្វាសរយៈពេល៥ម៉ោងមកហើយ។ ការឈឺចាប់ចាប់ផ្តើមយ៉ាងស្រួចស្រាវធ្វើអោយវាភ្ញាក់ពីដំណេក។ ការពិនិត្យរូបសាស្រ្ត ឃើញពងស្វាសឆ្វេងឈឺយ៉ាងខ្លាំង។ ការឈឺចាប់មិនថមថយទេ ទោះរុញឡើងលើក៏ដោយ។ វិភាគទឹកនោម មិនមានអ្វីគួរកត់សម្គាល់។ តើការពណ៌នាខាងក្រោមមួយណាត្រឹមត្រូវ ចំពោះការធ្វើរោគវិន្និច្ឆ័យនិងការព្យាបាលលើអ្នកជំងឺនេះ?","o":["នេះប្រហែលជាឪពុកអ្នក ឬបងប្អូនប្រុសរបស់ជំងឺមានបញ្ហាដូចគ្នានេះដែរ","ការវះកាត់ គួរត្រូវពន្យារហូតដល់ ការថតស្កែនតិចណេចូម(technetium scan)បញ្ជាក់អោយរោគវិន្និច្ឆ័យគ្លីនិកសិន។","ភាគច្រើននៃពងស្វាសដែលរងការរមួល អាចសង្រ្គោះបាន បើសិនបានវះកាត់ក្នុងអំឡុង២៤ម៉ោង","បើសិនជាមានការរមួលនោះ ពងស្វាសទាំងពីរ គួរតែទទួលការវះកាត់ទម្លាក់វាចុះក្រោម (orchiopexy)","ត្រូវធ្វើរោគវិន្និច្ឆ័យញែកចេញ ជាមួយគីសស្ពែម៉ាតូសែល (spermatocele)ផងដែរ"],"a":[3]},{"i":"fb56e551","b":"SUR","p":"A","q":"របេងផ្លូវទឹកនោមនិងផ្លូវបន្តពូជ លើបុរស ត្រូវបានគេរកឃើញតាមរយៈ","o":["មើលនឹងមីក្រូទស្សន៍ឃើញមានឈាមក្នុងទឹកនោម (Microscopic hematuria)","មានមេរោគក្នុងទឹកនោមតែមិនមានខ្ទុះក្នុងទឹកនោមទេ (Bacteriuria without pyuria)","មានគីសក្នុងតម្រងនោមម្ខាង (Unilateral renal cysts)","ឈឺចាប់ ហើម អេពីឌីឌីម (Painful swelling of the epididymis)","មានខ្យល់ក្នុងទឹកនោម (Pneumaturia)"],"a":[0]},{"i":"0643ea9d","b":"SUR","p":"A","q":"តើការពិពណ៌នាខាងក្រោមមួយណាត្រឹមត្រូវ ទាក់ទងនឹងមហារីកប្រូស្តាត (carcinoma of the prostate)","o":["វាកើតឡើងក្នុងចំណោមជនជាតិអាមេរិកស្បែកខ្មៅច្រើនជាងក្រុមអាមេរិកផ្សេងទៀត","ការពិនិត្យដោយមីក្រូទស្សន៍លើមហារីកប្រូស្តាតអាចឃើញបានតាមរយៈការកាត់ទទឹងបង្ហួរនោម នៃប្រូស្តាត ជាករណីអនុវត្តន៍ចំពោះការកាត់ដល់ឬសគល់នៃប្រូស្តាត។","វាកើតឡើងដំបូងនៅផ្នែកកណ្តាលនៃក្រពេញ","ជាទូទៅវារាលដាលទៅឆ្អឹង (It commonly produces osteoclastic bony metastases)","ការធ្វើ Screening for prostate-specific antigenទោះបីងាយស្រួលតាមផ្លូវទ្វារធំ តែមិនផ្តល់ផលប្រយោជន៍ក្នុងការរកជំងឺឃើញឡើយ។"],"a":[0]},{"i":"ecc47906","b":"SUR","p":"A","q":"តើការពិពណ៌នាខាងក្រោមមួយណាត្រឹមត្រូវទាក់ទងនឹង ដុំពកស្លូតនៃប្រូស្តាត ( benign) (BPH)?","o":["ការរីកចំរើននៃ BPH សំខាន់គឺកើតឡើងនៅផ្នែកខាងក្រៅនៃក្រពេញ","សន្មតយកការសល់ចាល់ទឹកនោមច្រើនជាង១០០មីល្លីលីត្រ ល្បឿននៃការបញ្ចេញទឹក៣០មីល្លីលីត្រក្នុងមួយវិនាទី ឬ តិចជាង ជាភស្តុតាងបញ្ជាក់ថា មានការស្ទះការបញ្ចេញទឹកនោម","ការកាត់ប្រូស្តាតតាមផ្លូវលើឆ្អឹងថ្ងាសចំពោះ BPH គឺដើម្បីកោសសម្អាតប្រូស្តាតទាំងមូល និង បញ្ចៀសមហារីកប្រូស្តាតក្នុងពេលអនាគត។","ការវះកាត់ត្រូវគេបានគេអនុវត្តពេលមាន៖ ស្ទះចាល់ទឹកនោមស្រួចស្រាល់ និង រលាកផ្លូវទឹកនោម","BPH វាប្រឈមនឹងការក្លាយទៅជាមហារីកប្រូស្តាត"],"a":[3]},{"i":"d845c613","b":"SUR","p":"A","q":"ក្នុងអំឡុងពេលការវះកាត់មិនស្ថេរភាព ចំពោះអ្នកជំងឺរបួសបង្ហូរនោមខាងឆ្វេង ដែលត្រូវដាច់រហែកអស់៥០% នៃរង្វង់របស់វា។ បើសិនសភាពអ្នកជំងឺមិនអំណោយផលសម្រាប់ការព្យាបាល ការព្យាបាលជំនួសគឺ៖","o":["ចងបង្ហូរនោមដែលរបួសនិងចោះបង្ហូរតម្រងនោមរួមខាង","កាត់តម្រងនោម រួមខាង ( Ipsilateral nephrectomy)","ដាក់កាដឺទែរពីចុងក្រោមបង្ហូរនោមឆ្លងកាត់របួសចាក់នៃជញ្ជាំងពោះ","ដាក់បំពង់បង្ហូរទឹកនោមក្បែររបួស ដោយមិនចាច់រៀបចំរបួសទេដែលអាចធ្វើអោយរំខានដល់សភាពអ្នជំងឺ","យកកំណាត់បង្ហូរនោមខាងដើមបង្ហូរចេញក្រៅតាមស្បែក"],"a":[0]},{"i":"bf713194","b": UR","p":"A","q":"តើការពិពណ៌នាខាងក្រោមមួយណាត្រឹមត្រូវ អំពីរបួសខ្ទាំខួរក្បាល (cerebral contusions)?","o":["វាកើតឡើងច្រើនជាងគេនៅក្លែបអុកស៊ីពីតាល់ (occipital lobes)","វាអាចកើតឡើងនៅផ្នែកម្ខាងទៀតនៃប្រអប់លលាដ៏ក្បាល","វាកម្រមានរួមផ្សំជាមួយការហូរឈាមក្នុងខួរក្បាលណាស់","វាអាចកើតឡើងដោយឯកឯងលើអ្នកជម្ងឺដែលបានប្រើថ្នាំប្រឆាំងការកកឈាម","ថ្នាំប្រឆាំងប្រកាច់មានតួនាទីដំបូងក្នុងការព្យាបាលនូវវិបត្តិនេះ"],"a":[1]},{"i":"8da5ad23","b":"SUR","p":"A","q":"ក្នុងពេលកំពុងមើលការប្រកួតវាយកូនហ្គោល បុរស៣៧ឆ្នាំម្នាក់ត្រូវកូនហ្គោលប៉ះទង្គិចផ្នែកម្ខាងនៃក្បាល ។ ក្រោយប៉ះទង្គិចគាត់នៅដឹងខ្លួននិងនិយាយប៉ប៉ាច់ប៉ប៉ោចធម្មតា តែច្រើនថ្ងៃក្រោយមក ស្រាប់តែបាត់ភាពរួសរាយរបស់គាត់ ច្រលំខ្លះៗ មិនអាចធ្វើចលនាមួយចំហៀងខ្លួនខាងស្តាំ។ (ជ្រើសរើសរោគវិន្និច្ឆ័យមួយ) ការពិពណ៌នាខាងក្រោម ជ្រើសយកប្រភេទសរសៃឈាមដែលតែងមានទំនាក់ទំនងនឹងរោគសញ្ញាខាងលើជិតស្នឹតជាងគេ?","o":["ដុំឈាមកកនៅ Subdural នៃខួរក្បាល (Subdural hematoma)","ដុំឈាមកកនៅ Epidural នៃខួរក្បាល (Epidural hematoma)","ដាច់សរសៃអាទែរ Carotid (Carotid dissection)","ខ្ទាំខួរក្បាល (Brain contusion)","របួសរីកសរសៃអាទែរក្នុងខួរក្បាល (Ruptured intracranial aneurysm)"],"a":[0]},{"i":"2b7d879f","b":"SUR","p":"A","q":"ស្រ្តីអាយុ៤២ឆ្នាំម្នាក់ភ្លាមៗត្អូញឈឺក្បាលយ៉ាងខ្លាំង រឹងក ខ្លាចពន្លឺ ។ ក្រោយមកបាត់ស្មារតី កូនក្រមុំភ្នែករីក។ (ជ្រើសរើសរោគវិន្និច្ឆ័យមួយ) \nការពិពណ៌នាខាងក្រោម ជ្រើសយកប្រភេទសរសៃឈាមដែលតែងមានទំនាក់ទំនងនឹងរោគសញ្ញាខាងលើជិតស្នឹតជាងគេ?","o":["ដុំឈាមកកនៅ Subdural នៃខួរក្បាល ​(Subdural hematoma)","ដុំឈាមកកនៅ Epidural នៃខួរក្បាល ​(Epidural hematoma","ដាច់សរសៃអាទែរ Carotid (Carotid dissection)","របួសខ្ទាំខួរក្បាល (Brain contusion)","របួសរីកសរសៃអាទែរក្នុងខួរក្បាល ​(Ruptured intracranial aneurysm)"],"a":[4]},{"i":"b94e0cde","b":"SUR","p":"B","q":"តើរោគសញ្ញាខាងក្រោមមួយណាមិនមែនជារោគសញ្ញាតែងកើតមានឬ ក្លាស៊ីកចំពោះការបាក់បាតប្រអប់លលាដ៏ក្បាល (basal skull fracture)?","o":["Battle sign","racoon eyes","ឈាមហូរក្នុងត្រចៀកកណ្តាល (hemotympanum)","Freedman sign","ហូរទឹកខួរឆ្អឹងខ្នងតាមច្រមុះ/ត្រចៀក (CSF rhinnorhea/ottorrhea)"],"a":[3]},{"i":"4d490c4c","b":"SUR","p":"B","q":"ស្រ្តីអាយុ១៩ឆ្នាំម្នាក់ប៉ះទង្គិចក្បាល ត្រូវបាននាំចូលបន្ទប់សង្រ្គោះបន្ទាន់ដោយក្រុមសង្រ្គោះបន្ទាន់ ។ សភាពចរន្តឈាមរបស់គាត់ ធម្មតាតែតម្រូវអោយមានជំនួយការដកដង្ហើម តាមរយៈបំពង់ដាក់ក្នុងបំពង់ខ្យល់។ រំញោចឈឺចាប់គាត់មិនបើកភ្នែកទេ ហើយមានឥរិយាបថដេកសណ្តូកខុសធម្មតា។ តើចម្លើយខាងក្រោមមួយណាមិនត្រឹមត្រូវ?","o":["ពិន្ទុ Glasgow របស់គាត់គឺ៣ (her GCS is 3)","ពិន្ទុ Glasgow 8 ជាករណីត្រូវដាក់ intubation","របួសតែក្បាលជាមូលហេតុធ្វើអោយស្ហុក","គាត់គួរដកដង្ហើមជាមួយ pCO2 of 30-35 mm Hg","ចម្លើយទាំងអស់សុទ្ធតែមិនត្រឹមត្រូវ (all are incorrect)"],"a":[2]},{"i":"2e036ac9","b":"SUR","p":"B","q":"សំដៅលើការហូរឈាមច្រមុះ ការអធិប្បាយខាងក្រោមគឺសុទ្ធតែខុស លើកលែងតែមួយ?","o":["ការហូរឈាមច្រមុះកម្រកើតមានលើកុមារ","ជាធម្មតាវាជាលទ្ធផលនៃការរបួសសរសៃឈាមច្រមុះនៅខាងក្រោយ","វាអាចព្យាបាលបានដោយការចងសរសៃអាទែរការ៉ូទីតរួមខាង","ការហូរឈាមច្រមុះអាចព្យាបាល cautery of Little’s area silver nitrate","វាមិនមែនជាមូលហេតុទូទៅនៃ ការសង្រ្គោះបន្ទាន់នៃផ្នែកត្រចៀក ច្រមុះបំពង់ទេ"],"a":[3]},{"i":"e046ae24","b":"SUR","p":"B","q":"ការក្អួតអូសបន្លាយ តើភាពខុសធម្មតានៃអេឡិចត្រូលីតមានដូចម្តេច?","o":["អាស៊ីដូសមេតាបូលីសអ៊ីយ៉ុងក្លរនិងកាលី ទាប (hypochloremic hypokalemic metabolic alkalosis)","អាល់កាឡូសមេតាបូលីសអ៊ីយ៉ុងក្លរនិងកាលីឡើងខ្ពស់ (hypochloremic hypokalemic metabolic alkalosis)","អាស៊ីដូសមេតាបូលីស អ៊ីយ៉ុងក្លរឡើងខ្ពស់ (hyperchloremic metabolic acidosis)","កំរិតប៉ូតាស្យូមក្នុងឈាមកើនខ្ពស់ (hyperkalemia)","មិនមានចម្លើយនៅលើទេ"],"a":[1]},{"i":"a1af8679","b":"SUR","p":"B","q":"ករណីត្រូវអនុវត្តន៍ ការព្យាបាលដោយវះកាត់ភ្លាមៗជាជាងការព្យាបាលដោយមិនវះកាត់ចំពោះជំងឺខ្សោយសរសៃអាទែរ (arterial insufficiency)គឺ។ ចម្លើយខាងក្រោមលើកលែងតែមួយ?","o":["ឈឺចាប់អវយវៈនៅពេលយប់ (nocturnal limb pain)","ដំបៅដោយសារខ្វះឈាមចិញ្ចឹម​ (ischemic ulceration)","បាត់ជីពចរ (absent pulse)","ជំងឺប្រសាទដោយសារខ្វះឈាមចិញ្ចឹម (ischemic neuropathy)","រលួយ ម្រាមជើង (toe gangrene)"],"a":[2]},{"i":"6d28b1bf","b":"SUR","p":"B","q":"ចម្លើយខាងក្រោមទាំងអស់ជាករណីត្រូវវះកាត់ចំពោះ diverticulitis លើកលែងតែមួយ?","o":["រលាកស្រោមពោះ (peritonitis)","នៅមានការហូរឈាម (persisting hemorrhage)","មានរន្ធធ្លាយ (fistula)","ធំជាង (greater than two severe attacks)","ដ
